# 反馈社区前台（feedback/）的边缘层配置示例。
#
# ⚠ 这份文件是**单机直装 nginx 时的参考片段**，不是线上实际使用的配置。
#    容器化部署用的是 deploy/prod/nginx/templates/30-feedback.conf.template
#    （域名、回源密钥由环境变量渲染，证书由 certbot 自动签发）。
#    两处改动要同步；压缩策略与 Accept-Encoding 的坑在两边都适用。
#    另外：接了 CDN 之后 .next/static 由 cdn.<域名> 直接服务，
#    下面 /_next/static/ 的 alias 只在不接 CDN 时才有意义。
#
# 压缩策略：优先 Brotli（br），Gzip（gzip）作为兼容性回退。
# 两条路径分别处理：
#
#   静态产物（带内容哈希，永不变更）
#     构建时已由 feedback/scripts/precompress.mjs 压成 .br 与 .gz。
#     这里用 brotli_static / gzip_static 直接把现成文件送出去，不耗 CPU。
#     实测：899.5 KB 原始产物 → Brotli 244.7 KB、Gzip 281.2 KB。
#
#   SSR 出来的 HTML（每次都不一样，没法预压缩）
#     由 nginx 实时压缩。这里刻意把上游的 Accept-Encoding 清空，
#     让 Next.js 回明文、nginx 自己压 —— 否则 Next.js 先 gzip 过了，
#     nginx 不会再碰它，HTML 就永远拿不到 Brotli。
#
# 依赖：brotli_static / brotli 指令来自 ngx_brotli 模块，需要编译进 nginx
# （nginx 官方包不自带）。没有这个模块时，把所有 brotli_* 行注释掉即可，
# 站点会退化成只有 Gzip，功能不受影响。

# ---- 全局压缩开关（放在 http 块）----
# brotli              on;      # 动态内容用 Brotli
# brotli_comp_level   5;       # 实时压缩不要用 11，CPU 划不来；5 是常用折中
# brotli_static       on;      # 优先送 .br 预压缩文件
# brotli_types        text/plain text/css application/json application/javascript
#                     text/xml application/xml image/svg+xml text/html;
# gzip                on;
# gzip_comp_level     5;
# gzip_static         on;      # 回退送 .gz 预压缩文件
# gzip_vary           on;      # 必须：否则 CDN 会把压缩版本串给不支持的客户端
# gzip_types          text/plain text/css application/json application/javascript
#                     text/xml application/xml image/svg+xml;
# gzip_min_length     1024;    # 和 precompress.mjs 的 MIN_BYTES 保持一致

upstream feedback_app {
    # Next.js 的 next start 监听端口
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name feedback.example.com;

    # ssl_certificate     /etc/ssl/feedback/fullchain.pem;
    # ssl_certificate_key /etc/ssl/feedback/privkey.pem;

    # 单个反馈正文 + 环境信息，16k 够用；真要传附件走对象存储直传，不经这里
    client_max_body_size 1m;

    # Next.js 的构建产物：文件名带内容哈希，可以放心长缓存
    location /_next/static/ {
        alias /srv/feedback/.next/static/;

        brotli_static on;
        gzip_static   on;

        # immutable 让浏览器在有效期内连 revalidate 请求都不发
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 同一个 URL 可能回 br 或 gzip 两种内容，必须让缓存按编码分开存
        add_header Vary "Accept-Encoding" always;

        access_log off;
    }

    # public/ 下的文件没有内容哈希，缓存期给短一些
    location /static/ {
        alias /srv/feedback/public/;

        brotli_static on;
        gzip_static   on;

        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Vary "Accept-Encoding" always;
    }

    # 其余全部交给 Next.js（SSR、Server Actions、路由处理）
    location / {
        proxy_pass http://feedback_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 关键：要空字符串，不是不写。
        # 不清掉的话 Next.js 会按浏览器的 Accept-Encoding 自己 gzip，
        # nginx 收到带 Content-Encoding 的响应就不再处理，HTML 就只能是 gzip。
        proxy_set_header Accept-Encoding   "";

        # SSR 页面不在边缘缓存：页面内容随登录用户变化，
        # 缓存串号会把别人的私密反馈发给错的人。
        proxy_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 开放提交接口由 Go 服务直接提供，不经过前台
    # location /open-api/ { proxy_pass http://127.0.0.1:8080; }
}
