# 反代给上游容器时的公共请求头。
#
# 这里**只放 proxy_set_header**，不放超时、proxy_http_version 这类可继承的指令。
# 原因是两条 nginx 规则不一样：
#   - 超时之类的指令在同一个块里写两次是语法错误（重复指令），所以默认值放在 http 块里继承，
#     个别 location 需要别的值时直接覆盖（admin 的 SSE 要 1 小时）。
#   - proxy_set_header 相反：某个 location 只要出现一次，就会**整组**覆盖继承来的头。
#     所以公共头必须和 location 自己的头写在一起，也就是靠这个 include 带进去。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# 空字符串 + HTTP/1.1 才能对上游复用长连接
proxy_set_header Connection        "";

# 内部身份头一律由边缘层决定，客户端送来的先清掉（各 server 块按需再 set 回去）。
# 不清的话浏览器可以自带一个 X-Service-Token 试探，绕过回源鉴权。
proxy_set_header X-Service-Token   "";
