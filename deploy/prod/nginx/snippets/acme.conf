# Let's Encrypt HTTP-01 挑战。只在 80 端口开放，且不跟 HTTPS 跳转抢优先级
# （location 的最长前缀匹配会赢过 `location /` 的 return 301）。
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
    # 挑战文件只在申领期间存在几秒，缓存住会让续期失败
    add_header Cache-Control "no-store" always;
}
