# HTTPS 响应的公共头。
#
# 为什么要在 location 里重复 include 这一份：nginx 的 add_header 只要在某个 location 里出现过
# 一次，就会**整组覆盖**从 server 继承来的 add_header。所以任何自己加了 Cache-Control 的
# location 都必须把这些头再带一遍，否则那条路径上的 HSTS 与 Alt-Svc 会静默消失。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 告诉浏览器下次可以直接走 HTTP/3（QUIC），省掉 TCP + TLS 的来回
add_header Alt-Svc 'h3=":443"; ma=86400' always;
