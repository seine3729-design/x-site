# 带内容哈希的静态产物：改内容必然换文件名，可以放心长缓存。
#
# brotli_static / gzip_static 让 nginx 直接把构建期压好的 .br / .gz 原样发出去：
# 那是 Brotli 11（离线压，代价只付一次），比运行时现压的 5 档更小，而且零 CPU。
# 两个都开是为了优先级：客户端 Accept-Encoding 带 br 就送 .br，只带 gzip 才回退 .gz，
# 两个文件都没有时才落到 http 块里的实时压缩。
brotli_static on;
gzip_static   on;

add_header Cache-Control "public, max-age=31536000, immutable" always;
# 同一个 URL 可能回 br 或 gzip 两种内容，必须让中间缓存按编码分开存
add_header Vary "Accept-Encoding" always;
include /etc/nginx/snippets/https-headers.conf;

access_log off;
