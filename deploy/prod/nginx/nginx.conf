user nginx;
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;

# Brotli 的两个动态模块（Alpine 的 nginx-mod-http-brotli 装的）
include /etc/nginx/modules/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志刻意不记完整 IP、不记 Cookie / Authorization（docs/10 日志与隐私）。
    # $remote_addr 的末段置零由 map 完成，见下面的 $client_net。
    log_format  xsite  '$client_net - "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" rt=$request_time '
                       'ua=$upstream_addr us=$upstream_status urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log xsite;

    map $remote_addr $client_net {
        ~^(?<a>\d+\.\d+\.\d+)\.\d+$   $a.0;
        ~^(?<b>[0-9a-fA-F:]+:)[^:]*$  $b:;
        default                       "-";
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout 65;
    client_max_body_size 32m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    reset_timedout_connection on;

    # 容器 DNS。
    #
    # 要知道的事：开源版 nginx 只在启动/重载时解析 upstream 里的服务名，之后一直用那个 IP
    # （`server x:1 resolve;` 是 nginx Plus 的功能）。所以重建了 apps / admin / feedback / service
    # 容器之后必须让 nginx 重载，否则它会一直打到已经消失的旧 IP 上回 502。
    # 发布脚本（deploy/prod/scripts/deploy.sh）在起完服务后会 reload；entrypoint.sh 里还有
    # 每 6 小时一次的重载兜底（本来是为了换证书，顺带也修这个）。
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ---- 压缩：优先 Brotli，不支持时自动回退 Gzip ----
    #
    # 两条路径，优先级也是两层：
    #
    # 1) 带内容哈希的静态产物 —— 构建期已压成 .br 与 .gz（Brotli 11，离线压，代价只付一次）。
    #    brotli_static / gzip_static 直接把现成文件送出去，零 CPU。客户端 Accept-Encoding 带 br
    #    就送 .br，只带 gzip 才回退 .gz，两份都没有才落到下面的实时压缩。
    #    具体开关在 snippets/static-immutable.conf，由各 location include。
    #
    # 2) 动态内容（SSR 出来的 HTML）—— 每次都不一样，没法预压缩，只能实时压。
    #    这里 brotli 与 gzip 同时开着，nginx 会按客户端的 Accept-Encoding 选，br 优先。
    #    档位刻意不用 11：实测首页 Brotli 11 约 19 ms、体积只比 5 小 12%，而这个代价每个请求
    #    都要付一遍。5 是常用折中（apps 自己的动态压缩也用 5，见 apps/src/lib/server/compress.ts）。
    brotli              on;
    brotli_comp_level   5;
    brotli_static       on;
    brotli_min_length   1024;
    brotli_types        text/plain text/css application/json application/javascript
                        text/javascript text/xml application/xml image/svg+xml
                        application/manifest+json application/wasm;

    gzip                on;
    gzip_comp_level     5;
    gzip_static         on;
    # 必须：否则中间缓存会把压缩版本串给不支持的客户端
    gzip_vary           on;
    gzip_min_length     1024;
    gzip_proxied        any;
    gzip_types          text/plain text/css application/json application/javascript
                        text/javascript text/xml application/xml image/svg+xml
                        application/manifest+json application/wasm;

    # ---- TLS ----
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:20m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # Let's Encrypt 已于 2025 年停止提供 OCSP，不配 stapling

    # ---- 反代默认值 ----
    # 放在 http 块里是为了能被 location 覆盖（同一个块里重复写同一条指令是语法错误）。
    # 请求头不放这里：location 里只要出现一次 proxy_set_header 就会整组覆盖继承的，
    # 所以公共头走 snippets/proxy.conf 的 include。
    proxy_http_version    1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_redirect        off;

    # ---- 限流 ----
    # 兜底闸门，业务配额在 apps（RATE_LIMIT_*）与 Go 服务里按身份判定，这里只拦明显异常的量。
    limit_req_zone  $binary_remote_addr zone=edge_pages:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=edge_admin:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
    limit_conn_status 429;

    # 真实客户端 IP。
    #
    # 用户端域名挂在 Cloudflare 代理（橙云）后面 —— apps 的静态资源靠边缘缓存加速，
    # 不用独立 CDN 域名（原因见 deploy/prod/README.md 第 4 节）。那时 $remote_addr 是
    # Cloudflare 的边缘节点，限流、风控、日志会把所有访客当成同一个来源。
    #
    # EDGE_TRUST_CLOUDFLARE=1 时 entrypoint.sh 会把 snippets/cloudflare-ips.conf 放进这个目录，
    # 里面是 set_real_ip_from（可信来源白名单）+ real_ip_header CF-Connecting-IP。
    # 顺序很重要：只打开 real_ip_header 而不限制来源，等于让任何人伪造客户端 IP。
    # 目录为空时这条 include 什么也不做，直接用 $remote_addr。
    include /etc/nginx/realip/*.conf;

    include /etc/nginx/http.d/*.conf;
}
