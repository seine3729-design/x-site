# 生产编排（单主机）。服务器上只需要这个文件 + 同目录的 .env，镜像全部由 CI 构建并推到镜像仓库。
#
#   docker compose -f compose.yaml --env-file .env pull
#   docker compose -f compose.yaml --env-file .env --profile release run --rm migrate
#   docker compose -f compose.yaml --env-file .env up -d
#
# 用 deploy/prod/scripts/deploy.sh 执行上面这一串（它还会在起完服务后重载 nginx，见 nginx.conf 的说明）。
#
# 数据库与 Valkey 也放在这里，是为了单机就能跑起来。换成托管实例时：注释掉 postgres / valkey 两个服务，
# 把 .env 里的 DATABASE_URL / DATABASE_RO_URL / VALKEY_URL 指过去（线上必须 sslmode=verify-full
# 与 rediss://，docs/00 第 3.5 节），其余不用改。
#
# 对象存储用 R2 等外部服务，不在这里编排（docs/12）。

name: xsite-prod

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# 后端两个进程（api / worker）共享同一份配置。只有 worker 需要的项在各自的服务里追加。
x-service-env: &service-env
  APP_ENV: production
  HTTP_ADDR: ":8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # production 启动校验会拒绝 AUTO_MIGRATE，迁移由 migrate 服务在发布流程里执行
  AUTO_MIGRATE: "false"
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
  # 只采信来自 compose 网络（nginx、apps、feedback）的 X-Forwarded-For
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}

  DATABASE_URL: ${DATABASE_URL:?必须设置 DATABASE_URL}
  DATABASE_RO_URL: ${DATABASE_RO_URL:-}
  VALKEY_URL: ${VALKEY_URL:?必须设置 VALKEY_URL}

  BFF_SERVICE_TOKEN: ${BFF_SERVICE_TOKEN:?必须设置 BFF_SERVICE_TOKEN（至少 32 字符）}
  EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?必须设置 EDGE_SHARED_SECRET（至少 32 字符）}
  API_ENC_KEYS: ${API_ENC_KEYS:?必须设置 API_ENC_KEYS}
  ADMIN_ORIGINS: https://${ADMIN_DOMAIN:?必须设置 ADMIN_DOMAIN}
  ADMIN_TOTP_KEKS: ${ADMIN_TOTP_KEKS:?production 必须设置 ADMIN_TOTP_KEKS}
  JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?必须设置 JWT_SIGNING_KEYS}
  PLAY_TOKEN_KEYS: ${PLAY_TOKEN_KEYS:?必须设置 PLAY_TOKEN_KEYS}
  MEDIA_KEKS: ${MEDIA_KEKS:?必须设置 MEDIA_KEKS}
  STORAGE_KEKS: ${STORAGE_KEKS:?必须设置 STORAGE_KEKS}
  LINE_SIGN_KEYS: ${LINE_SIGN_KEYS:?必须设置 LINE_SIGN_KEYS}
  CONFIG_BACKUP_KEYS: ${CONFIG_BACKUP_KEYS:?必须设置 CONFIG_BACKUP_KEYS}

  # 媒体主存储（docs/12）。注意：MEDIA_SOURCE_BUCKET 是私有入库桶，不能等于公开读的 S3_BUCKET_ASSETS，
  # 启动校验会拒绝；也不要和前端静态产物的 CDN 桶混用。
  S3_ENDPOINT: ${S3_ENDPOINT:?必须设置 S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-auto}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?必须设置 S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?必须设置 S3_SECRET_KEY}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?必须设置 S3_BUCKET_MEDIA}
  S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:?必须设置 S3_BUCKET_ASSETS}
  MEDIA_SOURCE_BUCKET: ${MEDIA_SOURCE_BUCKET:?必须设置 MEDIA_SOURCE_BUCKET}

  MEDIA_ORPHAN_RETENTION: ${MEDIA_ORPHAN_RETENTION:-720h}
  MEDIA_CLEANUP_INTERVAL: ${MEDIA_CLEANUP_INTERVAL:-24h}
  GEOIP_XDB_PATH: ${GEOIP_XDB_PATH:-/data/geoip/ip2region.xdb}
  GEOIP_RELOAD_INTERVAL: ${GEOIP_RELOAD_INTERVAL:-10m}

  OTEL_SERVICE_NAME: xsite-service
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  # ------------------------------------------------------------------ 数据
  # 镜像由 CI 从 deploy/local/postgres/ 构建（PG 18 + pg_bigm）。这个 Dockerfile 本地与生产共用：
  # 中文检索要 pg_bigm，官方镜像没有，两边必须是同一个扩展版本，否则本地测得过的查询线上走不了索引。
  postgres:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX:?必须设置 IMAGE_PREFIX}/postgres:${RELEASE_TAG:-latest}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      XSITE_DB: ${XSITE_DB:-xsite}
      XSITE_APP_USER: ${XSITE_APP_USER:-xsite_app}
      XSITE_APP_PASSWORD: ${XSITE_APP_PASSWORD:?必须设置 XSITE_APP_PASSWORD}
      XSITE_RO_USER: ${XSITE_RO_USER:-xsite_ro}
      XSITE_RO_PASSWORD: ${XSITE_RO_PASSWORD:?必须设置 XSITE_RO_PASSWORD}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_min_duration=500ms
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
    volumes:
      - pgdata:/var/lib/postgresql
    # 只给本机，便于 psql 与 pg_dump；不对公网开放
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${XSITE_DB:-xsite} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30

  valkey:
    <<: [*restart, *logging]
    image: valkey/valkey:9.1
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?必须设置 VALKEY_PASSWORD}
    # 和本地开发的参数不同，两处都是刻意的：
    #   appendonly yes —— xsite: 命名空间里不只有可丢弃的缓存，还有会话、限流计数、
    #     尚未落库的曝光/搜索计数和榜单本体（docs/11 S4-4 的键白名单）。不持久化等于每次重启丢数据。
    #   volatile-lru   —— 只淘汰设了过期时间的键。allkeys-lru 会在内存紧张时把「待落库的计数」
    #     这类没有 TTL 的有状态数据也淘汰掉，那是静默丢数据；volatile-lru 最坏情况只是会话提前失效。
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --appendfsync everysec
        --maxmemory ${VALKEY_MAXMEMORY:-1gb} --maxmemory-policy volatile-lru
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------ 后端
  # 一次性迁移。profile release 让它不随 `up -d` 启动：
  #   docker compose --profile release run --rm migrate
  migrate:
    profiles: [release]
    image: ${IMAGE_PREFIX}/service:${RELEASE_TAG:-latest}
    entrypoint: ["/app/admintool"]
    command: ["migrate"]
    environment: *service-env
    depends_on:
      postgres:
        condition: service_healthy
    <<: *logging

  service:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/service:${RELEASE_TAG:-latest}
    environment: *service-env
    volumes:
      - ./geoip:/data/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # distroless 镜像里没有 curl / wget / shell，健康检查只能由 api 自己做（cmd/api 的 -healthcheck）
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 通用 worker：不消费媒体队列（MEDIA_TRANSCODE_CONCURRENCY=0），用 distroless 镜像
  worker:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/service:${RELEASE_TAG:-latest}
    entrypoint: ["/app/worker"]
    environment:
      <<: *service-env
      MEDIA_TRANSCODE_CONCURRENCY: "0"
    volumes:
      - ./geoip:/data/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # 转封装 worker：带 FFmpeg 的镜像，单独一个服务方便按 CPU 单独扩缩
  media-worker:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/media-worker:${RELEASE_TAG:-latest}
    environment:
      <<: *service-env
      MEDIA_TRANSCODE_CONCURRENCY: ${MEDIA_TRANSCODE_CONCURRENCY:-1}
      MEDIA_WORK_DIR: /tmp/xsite-transcode
      # 资源机账号密码只给 worker（docs/11 第 9.2 节）
      FTP_LOCAL_USER: ${FTP_LOCAL_USER:-}
      FTP_LOCAL_PASSWORD: ${FTP_LOCAL_PASSWORD:-}
    volumes:
      - ./geoip:/data/geoip:ro
      - transcode_tmp:/tmp/xsite-transcode
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ------------------------------------------------------------------ 前端
  apps:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/apps:${RELEASE_TAG:-latest}
    environment:
      APP_ENV: production
      APPS_PORT: "3001"
      SERVICE_INTERNAL_URL: http://service:8080
      BFF_SERVICE_TOKEN: ${BFF_SERVICE_TOKEN}
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET}
      # BFF 的限流与会话计数用 Valkey 的 1 号库，和后端的 0 号库分开
      VALKEY_URL: ${APPS_VALKEY_URL:?必须设置 APPS_VALKEY_URL}
      # 图片与视频线路域名池：生产环境 CSP 的 img-src / connect-src 从这里取，
      # 后台线路表新增域名后必须同步这里，否则封面与视频在生产被 CSP 拦掉（apps/config/security-headers.ts）
      IMAGE_BASE_URLS: ${IMAGE_BASE_URLS:-}
      MEDIA_CONNECT_ORIGINS: ${MEDIA_CONNECT_ORIGINS:-}
    depends_on:
      service:
        condition: service_healthy

  # 运营后台没有常驻进程：它是纯静态 SPA。这个一次性容器把镜像里的 dist（含构建期压好的
  # .br / .gz）导出到卷，边缘层直接从磁盘发文件。
  #
  # 不再在后台容器里套一层 nginx：少一跳，而且边缘层那个 nginx 带 ngx_brotli，
  # 能把 Brotli 11 的预压缩文件原样送出去；官方 nginx 镜像没有这个模块，
  # 经它代理还会把预压缩换成运行时现压的低档 Brotli。
  admin-assets:
    <<: *logging
    image: ${IMAGE_PREFIX}/admin:${RELEASE_TAG:-latest}
    restart: "no"
    volumes:
      - admin_static:/export

  feedback:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/feedback:${RELEASE_TAG:-latest}
    environment:
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      SERVICE_INTERNAL_URL: http://service:8080
      BFF_SERVICE_TOKEN: ${BFF_SERVICE_TOKEN}
    depends_on:
      service:
        condition: service_healthy

  # 同上：把 .next/static 导出给边缘层直接发。next start 不认预压缩文件，只会现压 gzip。
  feedback-assets:
    <<: *logging
    image: ${IMAGE_PREFIX}/feedback:${RELEASE_TAG:-latest}
    restart: "no"
    user: root
    entrypoint: ["/usr/local/bin/export-assets.sh"]
    volumes:
      - feedback_static:/export

  # ------------------------------------------------------------------ 边缘层
  nginx:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/edge:${RELEASE_TAG:-latest}
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN:?必须设置 APPS_DOMAIN}
      APPS_ALIASES: ${APPS_ALIASES:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      FEEDBACK_DOMAIN: ${FEEDBACK_DOMAIN:?必须设置 FEEDBACK_DOMAIN}
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET}
      # 用户端域名挂在 Cloudflare 代理后面时设 1：客户端 IP 取 CF-Connecting-IP，
      # 并且只信任 Cloudflare 的回源网段（deploy/prod/nginx/snippets/cloudflare-ips.conf）
      EDGE_TRUST_CLOUDFLARE: ${EDGE_TRUST_CLOUDFLARE:-1}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3（QUIC）走 UDP。缺这一行浏览器拿到 Alt-Svc 也连不上，会静默退回 HTTP/2
      - "443:443/udp"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - edge_certs:/etc/nginx/certs
      # 静态产物只读挂载：边缘层只发文件，写入由各自的 *-assets 一次性服务负责
      - admin_static:/srv/admin:ro
      - feedback_static:/srv/feedback:ro
    depends_on:
      apps:
        condition: service_started
      feedback:
        condition: service_started
      service:
        condition: service_healthy
      # 静态产物必须先导出，否则后台域名会在一段时间里全是 404
      admin-assets:
        condition: service_completed_successfully
      feedback-assets:
        condition: service_completed_successfully

  certbot:
    <<: [*restart, *logging]
    image: ${IMAGE_PREFIX}/certbot:${RELEASE_TAG:-latest}
    environment:
      APPS_DOMAIN: ${APPS_DOMAIN}
      APPS_ALIASES: ${APPS_ALIASES:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      FEEDBACK_DOMAIN: ${FEEDBACK_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?必须设置 CERTBOT_EMAIL}
      # 演练发布流程时设 1 用 staging 环境，避免撞 Let's Encrypt 的签发频率限制
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - nginx

volumes:
  pgdata:
  valkeydata:
  transcode_tmp:
  letsencrypt:
  certbot_webroot:
  edge_certs:
  admin_static:
  feedback_static:
