# worker 进程热重载（./dev.sh up 中的 worker 容器使用）
root = "."
tmp_dir = "tmp/worker"

[build]
cmd = "go build -o ./tmp/worker/bin ./cmd/worker"
entrypoint = ["./tmp/worker/bin"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "vendor", "api"]
exclude_regex = ["_test\\.go$"]
delay = 300
kill_delay = "5s"
send_interrupt = true

[log]
time = false

[misc]
clean_on_exit = true
