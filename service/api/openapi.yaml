    POST /api/admin/apikeys/{id}/disable|enable（停用 / 启用）。权限点 apikeys.view / apikeys.edit（后者为高敏）。
    这是**开放平台**的密钥，消费端是 S4-6 的采集入库接口；和社区模块的 /api/admin/feedback/api-keys 是两套互不相干的东西。
    密钥 = 固定前缀 xsk_ + 32 字节随机数的 base64url 编码（共 47 字符）。库里只存 SHA-256 哈希与开头 10 位（key_hint）：
    后台列表、审计记录、服务端日志都不可能出现完整密钥，丢了只能重新生成。
    用 SHA-256 而不是慢哈希：密钥是 32 字节随机串、熵足够高，没有字典或暴力破解的空间，而慢哈希会让每个 API 请求都付一次 KDF 代价
    （管理员密码是人选的口令，那里必须用慢哈希）。
    权限范围生成后不可修改（改范围等于改已在调用方手里的密钥能做什么，应当重新生成换掉旧的）；也没有删除接口，
    停用即时失效已经够用，留着记录才能回答「这把密钥曾经存在、被谁用过」。
    显示状态三态由 status 与 last_used_at 算出：可用 / 停用 / 未用过（启用中但从未被调用，常见于刚生成还没交付）。
    鉴权失败一律同一个错误，不区分「格式不对」「不存在」「已停用」—— 区分了就等于告诉试探者哪一把密钥真实存在。
