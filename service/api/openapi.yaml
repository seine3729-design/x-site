    两个写接口收 multipart（file + source），不走上传会话：CSV 是几十到几百 KB 的小文件，
    为它走「建会话 → 传内容 → 完成」三步没有收益。上限 1 MiB、2000 行，超出让运营拆分文件。
    **预览与正式导入是同一条代码路径**（照 storage.CleanupService 的 dry-run 做法），只有写库与记录被 dry_run 跳过：
    拆成两套逻辑的话「预览说会新增 3 部」与「导入真的新增 3 部」必然漂移，而运营恰恰是看了预览才敢点导入的。
    **CSV 只带剧级信息**（剧名、别名、简介、标签）。docs/06 第 8 节首句写「导入剧与分集」，但同节的列定义里
    没有任何分集字段，docs 里也没有定义过 CSV 的分集列格式或集号来源 —— 本次按列定义实现，
    episodes_created / episodes_updated 恒为 0（保留字段是为了让 FTP 扫描与开放平台推送共用同一套统计口径）。
    解析：要求第一行是表头（按位置猜会在列顺序变化时静默导错数据），列名认中英文多种写法；
    去 UTF-8 BOM（Excel 另存会加，不去掉第一个列名就认不出来）；非 UTF-8 直接拒并提示用「CSV UTF-8」另存；
    别名与标签在单元格内按中英文逗号、顿号、竖线、分号、斜杠切分；超长字段截断而不是报错。
    查重按**剧名或别名**双向精确匹配（CSV 剧名对库里剧名与别名、CSV 别名对库里剧名），
    迁移 00041 为此加了 drama_title_exact_idx 与 drama_aliases_gin_idx（原有的 bigm 索引是给模糊搜索用的，支撑不了精确匹配）。
    **回收站里的剧也算已存在**：否则导入会建一部同名的新剧，把运营刚删掉的东西又带回来。
    新建的剧为草稿、写入 source（采集批次）；**更新只覆盖 CSV 带来的那几列** —— 别名取并集、简介留空表示不改，
    不碰封面、评分、状态、上架时间，标签只追加不删。不复用 content 的 UpdateDrama：那是整体保存语义，
    会把 CSV 没提供的字段清成默认值。
    屏蔽词**只认 block**（docs/02 第 5.7 节「采集只认 block」）：剧名、别名与简介都查（采集来的简介里塞引流联系方式是常见手法），
    命中的整行被拒、不写库；mask 与 review 在采集场景不做任何事。复用常驻的那个 Aho-Corasick 自动机，不另起一个。
    标签按名称大小写不敏感 get-or-create，已被合并的标签自动改指目标（否则 content 域的校验会在别处拒绝它）。
    整批一个事务：导入对运营是一个动作，出错就该什么都没发生 —— 一半进去了另一半没进，他既不知道从哪行重来也没法干净重试。
