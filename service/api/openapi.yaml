        - { name: pinned, in: query, schema: { type: string, enum: ["true", "false"] }, description: 是否置顶 }
        - { name: missing, in: query, schema: { type: string, enum: ["true"] }, description: 只看片库没有的词 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminHotWordPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
