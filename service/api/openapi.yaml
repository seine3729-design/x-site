        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminAnnouncementPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建公告
      description: |
        需要 announcements.edit。新建后前台立即生效。站内信（inbox）暂未开放，新建返回 400。
        只有弹窗保存配图（其他方式的 image 一律清空）。记审计 announcement.create。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnnouncementRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminAnnouncementResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/announcements/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AdminOrigin"
      - $ref: "#/components/parameters/CSRFToken"
    patch:
      summary: 保存公告
      description: 需要 announcements.edit。整体保存（未传的可选字段按默认值保存），前台立即生效。记审计 announcement.update（修改前后）。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnnouncementRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminAnnouncementResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除公告
      description: 需要 announcements.edit。不可恢复（设置类数据不进回收站，暂停请改为停用）。记审计 announcement.delete。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/ads:
    get:
      summary: 广告列表（页码分页，按编号倒序）
      description: |
        需要 ads.view。q 匹配广告名或跳转网址。display_status 由状态与结束时间算出；imp_count / click_count 由 worker
        每分钟从 Valkey 落库，最多晚 1 分钟。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: slot, in: query, schema: { $ref: "#/components/schemas/AdSlot" } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminAdPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建广告
      description: |
        需要 ads.edit；素材类型为 html 时另要 ads.custom_html（默认只有超级管理员），否则 403。新建后前台立即生效。
        只保存该素材类型用得到的字段（图片：image、alt；视频：video_url、image 封面、alt；文字：text；HTML：html），其余清空；
        html 按白名单清洗后保存（去掉脚本、样式表、iframe、表单、事件属性与 javascript: 等协议，站外链接加 target=_blank 与 noopener），
        清洗后为空返回 400。记审计 ad.create。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAdRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminAdResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/ads/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AdminOrigin"
      - $ref: "#/components/parameters/CSRFToken"
    patch:
      summary: 保存广告
      description: |
        需要 ads.edit。整体保存（未传的可选字段按默认值保存；曝光、点击累计不变），前台立即生效。
        改成 html 素材、或原本就是 html 素材的广告（含停用、改成其他类型）都要 ads.custom_html，否则 403。记审计 ad.update（修改前后）。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAdRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminAdResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除广告
      description: 需要 ads.edit（html 素材也不需要 ads.custom_html）。不可恢复（设置类数据不进回收站，暂停请改为停用）。记审计 ad.delete。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/moderation:
    get:
      summary: 评论 / 弹幕审核列表（页码分页，按 id 倒序）
      description: |
        需要 moderation.view（docs/06 第 24 节，S2-5）。kind=comment（默认）或 danmaku。按状态（pending/visible/hidden）筛选；
        reported=true 只看被举报的；blockword=true 只看当前内容命中屏蔽词的（服务层按最新 500 条扫描）；q 搜内容或用户名。
        每条附 hit_words（当前命中的屏蔽词，供高亮）与 report_count。已软删的评论不在列表内。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [comment, danmaku] }, description: 缺省 comment }
        - { name: status, in: query, schema: { type: string, enum: [pending, visible, hidden] } }
        - { name: reported, in: query, schema: { type: boolean }, description: 只看被举报 }
        - { name: blockword, in: query, schema: { type: boolean }, description: 只看含屏蔽词 }
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审核列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list, total, page, page_size]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/ModerationItem" } }
                          total: { type: integer }
                          page: { type: integer }
                          page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/moderation/actions:
    post:
      summary: 批量审核操作
      description: |
        需要 moderation.edit（docs/06 第 24 节，S2-5）。对一批评论 / 弹幕执行 approve（通过并显示）、hide（隐藏）或 delete。
        评论 delete 为软删（可随回收站还原）；弹幕 delete 为硬删、不可恢复。单次最多 200 条。记审计 moderation.<action>。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, action, ids]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [comment, danmaku] }
                action: { type: string, enum: [approve, hide, delete] }
                ids: { type: array, items: { type: integer, format: int64 }, minItems: 1, maxItems: 200 }
      responses:
        "200":
          description: 影响条数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [affected]
                        properties:
                          affected: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/comment-policy:
    get:
      summary: 读评论先审后显开关
      description: 需要 moderation.view（docs/06 第 24 节，S2-5）。pre_moderation=true 时所有评论先进待审。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 评论策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CommentPolicy" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存评论先审后显开关
      description: 需要 moderation.edit。整体保存。记审计 comment_policy.update。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentPolicy" }
      responses:
        "200":
          description: 保存后的评论策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CommentPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/reports:
    get:
      summary: 举报队列（页码分页，按提交时间倒序）
      description: |
        需要 reports.view（docs/06 第 25 节，S2-5）。按状态（pending/resolved/rejected）、对象类型（comment/danmaku/drama/comment_image）、
        原因（attack/vulgar/illegal/minor/ad/spoiler/other）精确筛选；q 匹配说明或举报人用户名。举报人多态：注册用户显示昵称、游客显示「游客」。
        处罚举报人 / 被举报人（改账号状态）依赖用户管理（第 26 节），本切片只保存处理结果。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: status, in: query, schema: { type: string, enum: [pending, resolved, rejected] } }
        - { name: target_type, in: query, schema: { type: string, enum: [comment, danmaku, drama, comment_image] } }
        - { name: reason, in: query, schema: { type: string, enum: [attack, vulgar, illegal, minor, ad, spoiler, other] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 举报列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list, total, page, page_size]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/AdminReport" } }
                          total: { type: integer }
                          page: { type: integer }
                          page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/reports/{id}/handle:
    post:
      summary: 保存举报处理结果
      description: |
        需要 reports.edit（docs/06 第 25 节，S2-5）。status 只能置为 resolved（已处理）或 rejected（已驳回），note 为处理说明 ≤500 字。
        记审计 report.handle。处罚举报人 / 被举报人依赖用户管理（第 26 节）。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [resolved, rejected] }
                note: { type: string, maxLength: 500, description: 处理说明 }
      responses:
        "200":
          description: 处理后的举报
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/users:
    get:
      summary: 注册用户列表（页码分页，按注册时间倒序）
      description: |
        需要 users.view（docs/06 第 26 节，S2-7 / A2-2）。q 对用户名与昵称做大小写不敏感的包含匹配
        （服务端会转小写、全角转半角，LIKE 元字符按字面处理）；status 精确筛选账号状态。
        回收站里的账号（deleted_at 非空）不出现在列表里。响应不含密码哈希 —— 后台没有任何接口读它。
        游客设备见 GET /api/admin/guests。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: status, in: query, schema: { type: string, enum: [normal, muted, banned] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list, total, page, page_size]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/UserAccount" } }
                          total: { type: integer }
                          page: { type: integer }
                          page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/users/{id}:
    get:
      summary: 用户详情
      description: |
        需要 users.view（docs/06 第 26 节）。比列表多出资料审核状态（昵称 / 简介 / 头像）、看剧历史开关与社区足迹统计。
        docs/06 第 26 节还要求显示会员状态、等级成长值、金币余额、邀请关系与风控标记，那些表要等
        会员支付（S3-10）与福利体系（M6），本切片不下发这些字段。回收站里的账号返回 404。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserAccountDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/users/{id}/status:
    post:
      summary: 改账号状态（封禁即时下线）
      description: |
        需要 users.edit（docs/06 第 26 节，S2-7）。normal（正常）/ muted（禁言，发不出评论与弹幕）/
        banned（封禁）三选一，其他取值 400。记审计 user.status（含改前与改后状态）。

        **banned 的三重生效**（docs/11 S2-7「封禁即时踢下线」）：
        1. 登录被拒（domain/user.Login 检查 status）；
        2. 吊销该用户的全部会话（identity.RevokeAllSessions，原因 banned_by_admin）——
           不做这一步，30 天滑动有效的 Refresh Token 还能一直轮换，封禁只挡住了登录入口；
        3. 发评论 / 弹幕的前置校验把 banned 一并拦下 —— 不做这一步，手上那张最多还活 15 分钟的
           无状态 Access Token 仍能发言。
        muted 与 normal 不吊销会话：禁言只限制发言，不该顺带把人踢下线。

        状态已落库但吊销会话失败时返回 500 并提示重试（重试会重新吊销）；当成功返回就回到了封禁半失效的状态。
        **不提供重设用户密码**（docs/adr/0001）：账号只有用户名 + 密码、没有找回渠道，后台也不开后门。
        删除 / 放回收站本期未接入（docs/06 第 26 节）。游客没有账号状态，不能改。
      tags: [admin-community]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [normal, muted, banned] }
      responses:
        "200":
          description: 改后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

