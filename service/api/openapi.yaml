  # ---------- 存储源（S1-6a，docs/12 第 2、4.4、8.1 节）----------

  /api/admin/storage/providers:
    get:
      summary: 存储源列表（页码分页，按编号倒序）
      description: 需要 storage_providers.view。q 匹配名称或桶名（不区分大小写）。凭据只写不读，响应只含是否已配置与 secret 末 4 位（cred_tail），不返回明文。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 50 }, description: 搜名称或桶名 }
        - { name: type, in: query, schema: { type: string, enum: [s3, r2, custom] }, description: 按类型筛选 }
        - { name: status, in: query, schema: { type: string, enum: [active, draining, disabled] }, description: 按状态筛选 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminStorageProviderPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建存储源
      description: |
        需要 storage_providers.edit（高敏，S2-6 起需重新验证）。按类型切换必填字段：s3 需 region、bucket；
        r2 需 account_id、bucket（endpoint 自动生成为 https://<account_id>.r2.cloudflarestorage.com，region=auto）；
        custom/s3_compatible 需 endpoint、bucket；custom/http_origin 需 endpoint（base_url）。除 http_origin 外必须提供读写凭据。
        凭据信封加密入库、只写不读。自定义端点非开发环境只允许 https，解析到内网或保留地址时 400。记审计 storage_provider.create。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageProviderRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageProviderResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/providers/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      summary: 修改存储源
      description: |
        需要 storage_providers.edit。整体保存；凭据留空（write_cred / read_cred 省略或两字段都为空）表示保持原值，
        不会清空已配置的凭据。记审计 storage_provider.update（修改前后，不含凭据明文）。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageProviderRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageProviderResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除存储源
      description: |
        需要 storage_providers.edit。设置类数据，不进回收站。该存储源上还有媒体副本（media_replica）时返回 400
        并提示先设为停写（draining）并迁移（S1-6f，docs/12 第 5 节第 5 条）。记审计 storage_provider.delete。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/providers/{id}/test:
    post:
      summary: 连通性测试
      description: |
        需要 storage_providers.view（不改数据，但仍是写请求，要带 CSRF 令牌）。S3 / R2 / 自定义 S3 兼容源依次执行
        写入探测文件 → 读取校验 → 预签名下载 → 删除；HTTP 源做可达性探测。某一步失败后停止，探测失败也返回 200，
        原因写在失败的那一步。自定义端点在连接前解析并校验出站地址（SSRF）。记审计 storage_provider.test（结果与失败的一步）。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminStorageProbeResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 存储线路（S1-6b，docs/12 第 3 节）----------

  /api/admin/storage/lines:
    get:
      summary: 线路列表（含地区规则，按优先级倒序）
      description: 需要 storage_lines.view。可按存储源、类型（video/image）、状态筛选；一次返回全部，不分页。每条含其地区规则 rules。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: provider_id, in: query, schema: { type: integer, format: int64 }, description: 按所属存储源筛选；省略或 0 为全部 }
        - { name: kind, in: query, schema: { type: string, enum: [video, image] } }
        - { name: status, in: query, schema: { type: string, enum: [active, watch, disabled] } }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageLinePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建线路
      description: |
        需要 storage_lines.edit。挂到指定存储源（provider_id，之后不能更换），线路类型须与存储源用途兼容
        （video 线路要求存储源用途为 video 或 both，image 同理）。access_mode 为 cdn / public 时必须填访问域名 base_url；
        presign 直连存储时可留空。未填的可选字段按默认值保存（token_ttl=600、weight=100、region_scope=global、
        video_process=standard、status=active、probe_path=/_probe/256k.bin）。记审计 storage_line.create。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageLineRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageLineResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/lines/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      summary: 修改线路
      description: |
        需要 storage_lines.edit。整体保存（不改所属存储源 provider_id）；未传字段按默认值保存。地区规则另由
        PUT /api/admin/storage/lines/{id}/rules 维护，本接口不改规则。记审计 storage_line.update。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageLineRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageLineResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除线路
      description: 需要 storage_lines.edit。级联删除其地区规则。记审计 storage_line.delete。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/lines/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/PathID"
    put:
      summary: 整体替换线路的地区规则
      description: |
        需要 storage_lines.edit。整体替换该线路的全部地区规则（最多 100 条）。字段留空表示不限（country 存为 *、
        province / isp 存为 *、asn 留空）；effect=include 命中则线路对该地区生效，exclude 则排除；boost 为命中加分（0–100）。
        记审计 storage_line.set_rules。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageLineRulesRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageLineRules" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/lines/{id}/test:
    post:
      summary: 线路连通性测试
      description: |
        需要 storage_lines.view（不改数据，但仍是写请求，要带 CSRF 令牌）。对 base_url + probe_path 发起 HTTP 探测，
        检查状态码、Content-Type 与 CORS 头；直连存储线路（无 base_url）返回提示改在存储源测试中查看。探测失败也返回 200，
        原因写在 message。记审计 storage_line.test。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminStorageLineProbeResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 存储设置（S1-6d，docs/12 第 7、8.4 节）----------

  /api/admin/storage/settings:
    get:
      summary: 读取存储全局设置
      description: |
        需要 storage_settings.view。单行设置，始终存在；主存储 ID 为 0 表示未设置。
        响应另附 delivery 交付自检：主存储没挂可用线路时，上传成功的资源前台取不到
        （播放返回 503），后台在设置页直接看到原因与修复入口。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminStorageSettingsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存存储全局设置
      description: |
        需要 storage_settings.edit。整体保存。候选线路数量 1–5；默认链接有效期 60–604800 秒；主存储须存在且用途与类型
        兼容（视频主存储用途为 video 或 both，图片同理），为 0 表示不设。记审计 storage_settings.update。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageSettingsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageSettingsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 选线预览（S1-6d，docs/12 第 8.3 节）----------

  /api/admin/storage/preview:
    get:
      summary: 选线预览
      description: |
        需要 storage_preview.view。输入客户端 IP（经 GeoIP 解析，数据未接入时解析为未知地区 XX）或直接输入
        「国家 + 省份 + 运营商 + ASN」，按选线算法（匹配精度 + 加分 + 优先级×10 + 健康分×0.3 − 观察惩罚）对该类型全部线路
        打分排序，返回解析出的地区、候选数量与每条线路的评估（含落选原因）。健康分当前为占位 100（S1-6d 其余接入 Valkey 聚合）。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [video, image] } }
        - { name: ip, in: query, schema: { type: string }, description: 客户端 IP；填了优先用它经 GeoIP 解析，否则用下面直接输入的地区 }
        - { name: country, in: query, schema: { type: string }, description: ISO 两位国家码（如 CN）；留空视为未知 XX }
        - { name: province, in: query, schema: { type: string } }
        - { name: isp, in: query, schema: { type: string }, description: 运营商（如 电信 / 联通） }
        - { name: asn, in: query, schema: { type: string }, description: ASN 数字 }
      responses:
        "200": { $ref: "#/components/responses/AdminStoragePreviewResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/replicate:
    post:
      summary: 手动触发媒体复制
      description: |
        需要 storage_settings.edit。按范围扫描媒体对象并逐个入队复制任务，由 worker 把对象复制到全部
        role=mirror 的存储源；接口只负责入队，立即返回入队的对象数量，不等待复制完成。
        复制任务幂等（已就绪的镜像会跳过），重复触发安全；单次最多入队 50000 个对象，达到上限时 capped 为 true，
        可再次触发继续。范围：all 全部对象 / drama 某部剧的对象（需 drama_id）/ provider 某存储源上有副本的对象（需 provider_id）。
        记审计 storage.replicate。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageReplicateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageEnqueueResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/migrate:
    post:
      summary: 把一个存储源上的副本迁移到另一个存储源
      description: |
        需要 storage_settings.edit。扫描迁出存储源上有副本的对象并逐个入队迁移任务：worker 先把对象复制到迁入存储源，
        确认就绪后再撤掉迁出存储源的副本记录 —— 中间任何一步失败都不会让对象变成「没有任何可用副本」。
        副本记录清空后该存储源才能删除（docs/12 第 5 节第 5 条）。建议先把迁出存储源设为停写（draining）再迁移。

        **迁移不删除迁出存储源上的物理文件**：只撤副本记录，因此迁移是可逆的（重新触发复制即可恢复），
        文件由运维确认后自行清桶。迁入目标必须可写（active、非只读角色、非 HTTP 源），否则 400。
        记审计 storage.migrate。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageMigrateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageEnqueueResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/adopt:
    post:
      summary: 把历史产物登记为存储源副本
      description: |
        需要 storage_settings.edit。S1-6f 之前转封装产物直接写默认桶、没有副本记录，因此选源看不到它们、
        复制任务也找不到复制源。把原默认桶登记成存储源后，用这个操作给这些历史对象补上副本记录。

        扫描还没有任何副本记录的媒体对象并逐个入队，worker 会**先校验对象在该存储源上真实存在**再登记 ready 副本：
        HLS 目录要求目录下有文件且含 master.m3u8（只有切片的半成品不算），单文件用 HEAD 校验。
        校验不通过的对象跳过、不写副本 —— 否则选源会把线路下发到实际没有文件的存储源。
        已有副本记录的对象会被跳过（幂等，可重复触发）。只读 HTTP 源不能作为副本所在的存储源。
        记审计 storage.adopt。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageAdoptRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageEnqueueResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/orphans:
    get:
      summary: 孤立产物统计
      description: |
        需要 storage_settings.view。统计已标记为孤立（不再被任何分集引用）的媒体对象：总数、已过保留期可清理的数量、
        占用字节与当前保留期。不改数据。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminStorageOrphanStats" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/cleanup:
    post:
      summary: 清理孤立产物
      description: |
        需要 storage_settings.edit。删除已过保留期的孤立产物（分集删除后、重新转封装后不再被引用的），
        连同各存储源上的物理文件。平时由 worker 每天自动跑，这个接口用于手动提前触发或预览。

        **不可逆**，所以设计上有三道保护：保留期从「首次被发现孤立」算起（默认 720 小时，production 不应短于 168 小时）；
        删文件前再查一次引用，仍被引用就跳过；某个存储源上的文件删不掉时保留对象记录、下一轮再试
        （宁可留垃圾文件也不让数据库与存储不一致）。建议先用 dry_run=true 预览会删掉什么，预览不改任何数据、也不记审计。
        实际删除记审计 storage.cleanup。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStorageCleanupRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStorageCleanupResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/storage/health:
    get:
      summary: 线路健康看板
      description: |
        需要 storage_preview.view。返回每条线路的生效健康分（0–100）与最近一次服务端探测明细（可达性、HTTP 状态、耗时、CORS）。
        生效健康分 = 服务端探测 × probe_weight + 客户端上报 × client_weight（40%/60%），缺一边时只用另一边，
        两者都无数据时按缺省满分、不过滤线路。探测分由 worker 周期性拉 probe_path 得出（成功率与耗时，EMA 平滑存 Valkey）；
        客户端分由最近 window_min 分钟的上报聚合得出（失败率 60% + 平均首帧 40%，样本不足 5 条时不计分但仍返回原始指标）。
        看板的 client 为全部地区汇总，选线时按用户所在地区单独计算（本地区样本不足时回退到汇总）。
      tags: [admin-storage]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminStorageHealthResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 资源机（S1-6，docs/06 第 31 节、docs/specs/S1-6.md）----------

  /api/admin/ftp:
    get:
      summary: 资源机列表（页码分页，按编号倒序）
      description: 需要 ftp.view。q 匹配名称或地址（不区分大小写）。账号密码不入库，cred_env 是 worker 读取账号密码的两个环境变量名。
      tags: [admin-resource]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminFTPServerPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 登记资源机
      description: |
        需要 ftp.edit（高敏，S2-6 起需 5 分钟内重新验证二次因子）。账号密码不在这里填写：cred_ref 留空时自动生成（R + 6 位），
        由技术在 worker 的密钥管理中配置 FTP_<cred_ref>_USER 与 FTP_<cred_ref>_PASSWORD。
        非开发环境只允许 tls=explicit；只支持被动模式（passive=false 返回 400）；地址是内网或保留地址的 IP 时 400。记审计 ftp_server.create。
      tags: [admin-resource]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFTPServerRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminFTPServerResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/ftp/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AdminOrigin"
      - $ref: "#/components/parameters/CSRFToken"
    patch:
      summary: 保存资源机
      description: |
        需要 ftp.edit。整体保存：未传的可选字段按新建时的默认值保存；cred_ref 留空时保持原值（换了标识就要重新配置账号密码）。
        记审计 ftp_server.update（修改前后）。
      tags: [admin-resource]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFTPServerRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminFTPServerResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除资源机
      description: 需要 ftp.edit。设置类数据，不进回收站。记审计 ftp_server.delete。
      tags: [admin-resource]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/ftp/{id}/test:
    post:
      summary: 测连
      description: |
        需要 ftp.view（不改数据，但仍是写请求，要带 CSRF 令牌）。由 worker 发起连接（不暴露 API 节点 IP）：依次解析地址并校验出站策略、
        建立连接（含 TLS 握手）、登录、读取登录目录；某一步失败后停止。探测失败也返回 200，原因写在失败的那一步。
        worker 25 秒内没有返回结果时 503 UNAVAILABLE（任务已撤销）。停用的资源机也可以测。记审计 ftp_server.test（结果与失败的一步）。
      tags: [admin-resource]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminFTPProbeResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/admin/ftp/{id}/list:
    post:
      summary: 打开目录
      description: |
        需要 ftp.view。请求体可以省略（打开登录目录）。先切换到 path 再读取，响应的 path 是服务器返回的实际目录；
        条目去掉 . 与 ..，目录在前、按名称排序，最多 1000 条（超出时 truncated=true）。其余同测连。记审计 ftp_server.list。
      tags: [admin-resource]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFTPListRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminFTPProbeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ---------- 缓存管理（S4-4，docs/06 第 28 节）----------

  /api/admin/cache:
    get:
      summary: 缓存概览
      description: |
        需要 cache.view。返回站点配置版本、Valkey 的键总数与内存占用、可选的清理范围，以及各键前缀的当前键数。
        prefixes 同时列出可清的读穿缓存与故意不清的有状态数据（会话、限流计数、尚未落库的统计、榜单本体），
        后者 purgeable=false 并在 reason 里写明原因，便于运维确认「这些键存在但不该清」而不是以为漏了。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminCacheOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/cache/purge:
    post:
      summary: 清缓存
      description: |
        需要 cache.edit。按范围清除 Valkey 中的读穿缓存，返回实际删除的键数。
        只清白名单内的键前缀，绝不会动后台会话、限流计数、尚未落库的广告曝光与搜索次数、线上榜单本体。
        scope=drama 与 scope=play 必须带 drama_id；scope=play 会按该剧各分集当前产物的目录清清单原文，
        这部剧还没有转码产物时返回 keys=0（不算错误）。
        scope=site_config 与 scope=all 会额外令站点配置版本 +1 并经 Pub/Sub 广播失效（S1-9），
        响应的 site_version 是新版本：前台配置的 ETag 由版本号派生，只清 Valkey 的话浏览器与 CDN 上的旧配置仍然有效。
        记审计 cache.purge。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCachePurgeRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminCachePurgeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 功能开关与年龄门（S3-3 / A3-3，docs/06 第 36 节）----------

  /api/admin/brand:
    get:
      summary: 品牌、配色与布局
      description: |
        需要 brand.view。一次返回 `site`（品牌）、`theme`（配色）、`layout`（布局）三段，外加各下拉的可选值
        （`options`）——`/brand` 是一个页面三张卡，发三次请求没有意义；保存仍分三个接口。
        没保存过的段按默认值返回（深色、经典红、2:3 封面、经典页头、标题在封面下、手机沉浸 + 电脑详情、显示底栏），
        页面上不会出现空下拉。可选值由后端给出，前端不要再抄一份枚举。docs/06 第 16 节、docs/specs/A3-3.md。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminBrandingConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存品牌
      description: |
        需要 brand.edit。整体保存品牌段：站名必填（≤30 字，页头、标题模板与兜底文案都要用），
        口号 ≤60 字、版权文字 ≤100 字；客服链接只收完整 http(s) 地址；Logo 与 favicon 收上传后的图片相对路径
        （如 `img/logo.webp`，由前台经图片线路拼完整地址）或完整 http(s) 地址，留空表示用站名文字。
        保存后令站点版本 +1 并广播失效，各端几秒内生效。记审计 site_config.site。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBrand" }
      responses:
        "200": { $ref: "#/components/responses/AdminBrandingConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/admin/theme:
    put:
      summary: 保存配色
      description: |
        需要 brand.edit。整体保存配色段。皮肤预设、默认深浅色、封面比例、字体都是固定取值（见 GET 返回的 options），
        未登记的取值返回 400 并列出可选项；`colors` 的键也在白名单内，值只收 #RGB / #RRGGBB（留空表示用预设色，
        保存时转小写）；圆角 0–32px。记审计 site_config.theme。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTheme" }
      responses:
        "200": { $ref: "#/components/responses/AdminBrandingConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/admin/layout:
    put:
      summary: 保存布局
      description: 需要 brand.edit。整体保存布局段（页头样式、卡片样式、播放形态、手机底栏开关），取值白名单同上。记审计 site_config.layout。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLayout" }
      responses:
        "200": { $ref: "#/components/responses/AdminBrandingConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/admin/seo:
    get:
      summary: SEO 配置
      description: |
        需要 seo.view。返回 `seo` 段，外加可配置模板的页面清单与可插入的变量清单（前端的「点击插入」照此渲染，
        不要在前端抄一份）。没保存过时按「允许收录 + 提供 sitemap + 输出结构化数据」返回——默认不收录会让站点
        白白失去搜索流量。**不含统计代码**：那段另有权限点，没有权限的人连内容都不该读到。
        docs/06 第 17 节、docs/specs/A3-3.md。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSEOConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存 SEO 配置
      description: |
        需要 seo.edit。整体保存：页面键与模板里的 `{变量}` 都必须在登记范围内，否则 400 并列出可选项
        （变量名写错会让前台把 `{dramaTitle}` 原样显示在标题里）；单条模板 ≤120 字，留空表示该页用前台默认。
        站长验证最多 10 组、名称不区分大小写去重、名称与内容必须成对（整行留空的忽略）。
        保存后令站点版本 +1 并广播失效。记审计 site_config.seo。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSEO" }
      responses:
        "200": { $ref: "#/components/responses/AdminSEOConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/admin/analytics-code:
    get:
      summary: 统计代码
      description: |
        需要 **seo.analytics_code**（迁移 00003 标为高敏，默认只有超管）。读也要这个权限：这段代码会被原样注入
        每个页面，等于给站点注入任意脚本，有 seo.edit 还不够。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminAnalyticsCode" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存统计代码
      description: |
        需要 seo.analytics_code。整体保存，**不做 HTML 清洗**——这段代码就是要原样注入的第三方脚本，
        清洗掉 `<script>` 这段配置就没有意义了，所以控制手段是「仅超管可改 + 记审计全文 + 长度上限 ≤20000 字 +
        前台 CSP 约束（docs/04 第 12 节）」。保存后令站点版本 +1 并广播失效，随 `GET /api/v1/site-config` 的
        `analytics` 段下发给前台注入。记审计 site_config.analytics（含前后全文）。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnalyticsCode" }
      responses:
        "200": { $ref: "#/components/responses/AdminAnalyticsCode" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/admin/features:
    get:
      summary: 功能开关与年龄门
      description: |
        需要 features.view。返回全部功能开关（含名称与**关闭影响说明**）与年龄确认门配置。
        开关清单由后端给出，`site_config.features` 里出现的其他键一律忽略：建表时写入过 articles、actors，
        对应模块已在迁移 00010 / 00014 删除，留着会让页面长出已经不存在的功能。
        未设置过的开关按打开返回（只有明确 false 才算关闭），这样新增开关不会因为老配置里没有而默认关掉功能。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminFeatureConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/features/flags:
    put:
      summary: 保存功能开关
      description: |
        需要 features.edit。整体保存：未传的开关按打开保存，传了未登记的编码返回 400（并列出可选项）。
        保存时只写登记过的键，已废弃的一并剔除。
        保存后令站点配置版本 +1 并广播失效（S1-9），各端几秒内生效。记审计 site_config.features（含前后状态）。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFeatureFlagsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminFeatureConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/features/age-gate:
    put:
      summary: 保存年龄确认门
      description: |
        需要 features.edit。整体保存。
        **启用时必须填标题与两个按钮文字**：开着的年龄门挡在所有访客前面，文案缺失会让人看到无法操作的空白弹层。
        关闭时只做长度校验，允许先把文案存成草稿再启用。
        deny_url 要是完整的 http(s) 网址（挡掉 javascript: 这类），留空则停留在当前页。
        remember_days 为 0–365，0 表示每次打开都确认。文案保存时去掉首尾空白。
        保存后令站点配置版本 +1 并广播失效。记审计 site_config.age_gate。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAgeGate" }
      responses:
        "200": { $ref: "#/components/responses/AdminFeatureConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 回收站（A4-3 / S4-7，docs/06 第 35 节）----------

  /api/admin/trash:
    get:
      summary: 回收站概览
      description: |
        需要 trash.view。各分类的条数、保留期与最近一条的到期时间。
        分类目前只有 dramas（剧集）：设置类数据不进回收站（docs/06 第 35 节，误删看审计日志重建），
        其余内容模块还没实现软删。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminTrashOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/trash/items:
    get:
      summary: 回收站列表
      description: |
        需要 trash.view。按删除时间倒序，带到期时间与剩余天数（days_left 为 0 表示今天到期）。
        剩余天数向上取整：还剩半天显示 1 天，宁可让人觉得时间多一点，也不要让人以为已经来不及了。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: category, in: query, required: true, schema: { $ref: "#/components/schemas/AdminTrashCategory" } }
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminTrashPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/trash/items/{id}/restore:
    post:
      summary: 还原
      description: |
        需要 trash.edit。清掉删除标记。分集与标签、维度取值、专题关联一直保留着，所以还原后内容完整，
        状态也恢复成删除前的（响应的 status）。
        超过保留期但清理任务还没跑到的也允许还原：东西还在，能救就救。
        已经不在回收站里（还原过或已彻底删除）返回 404。记审计 trash.restore。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTrashActionRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminTrashRestoreResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/trash/items/{id}/purge:
    post:
      summary: 彻底删除
      description: |
        需要 trash.edit。物理删除，**不可恢复**。分集、标签与维度关联、专题关联、排行干预都会级联删除；
        分集引用的转码产物随之失去引用，由孤立产物清理任务（S1-6f）按自己的保留期回收存储上的文件
        —— 这一步不删文件。
        响应是删除前读到的内容（含标题与附带条数），审计里也记下这些：物理删除之后库里查不到了，
        出问题只能靠审计回溯。
        用 POST 而不是 DELETE：请求体要带分类，而 DELETE 带请求体在各层代理上支持不一致。
        记审计 trash.purge。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTrashActionRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminTrashItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- CSV 批量导入（A4-2 / S4-6，docs/06 第 8 节）----------

  /api/admin/import/preview:
    post:
      summary: 预览 CSV 导入
      description: |
        需要 import.view。解析 CSV 并逐行给出会发生什么，**不写库、不记导入记录**。
        收 multipart：file 是 CSV（上限 1 MiB、2000 行），source 是来源标识（选填，会写进 drama.source）。
        预览与正式导入走同一条代码路径，只有写库那几步被跳过 —— 所以预览的统计与真正导入的结果不会对不上。
        CSV 只带剧级信息（剧名、别名、简介、标签），不含分集；响应里的 episodes_* 恒为 0。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AdminImportRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/import/run:
    post:
      summary: 正式导入 CSV
      description: |
        需要 import.edit。整批在**单事务**内落地：出错就什么都没发生。
        新建的剧为草稿并写入 source；**更新只覆盖 CSV 带来的那几列** ——
        别名取并集、简介留空表示不改，不碰封面、评分、状态、上架时间，标签只追加不删。
        查重按剧名或别名双向精确匹配，回收站里的剧也算已存在（否则会建一部同名的新剧，
        把运营刚删掉的东西又带回来）。
        命中屏蔽词的整行被拒、不写库（采集只认 block 类词）。
        标签按名称大小写不敏感 get-or-create，已被合并的标签自动改指目标。
        记审计 import.run，并在 import_log 里留一条记录（预览不留）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AdminImportRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/import/logs:
    get:
      summary: 导入记录
      description: |
        需要 import.view。**只有正式导入才有记录**，预览不留痕（docs/06 第 8 节）。
        from / to 建议传带时区的 RFC3339（前端按浏览器时区换算），这样「今天」是用户的今天；
        传裸日期会按 UTC 解释。to 是开区间。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: from, in: query, description: 起始时间（含），带时区的 RFC3339 或 YYYY-MM-DD, schema: { type: string } }
        - { name: to, in: query, description: 结束时间（不含）, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminImportLogPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 资源预热（S4-5 / A4-2，docs/06 第 10 节）----------

  /api/admin/resource-warm/start:
    post:
      summary: 开一轮资源预热
      description: |
        需要 resource_warm.edit。入队 worker 任务后立即返回，预热在后台跑。
        drama_id 为 0 或省略表示全部剧；此时 include_unpublished 决定是否包含草稿与已下架的剧
        （预热未上架的剧是正常需求 —— 明天要上的剧提前热好，上架那一刻观众点开就是热的）。
        **同一时间仅一轮**（docs/02 第 4.4 节）：已有在跑的一轮时返回 409。
        没有可预热的分集（要有转封装完成的视频产物）时返回 400。
        预热拉的是播放器真正会请求的那些地址 —— worker 复用播放链路取清单，不自己拼地址。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResourceWarmStartRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminResourceWarmJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/resource-warm/stop:
    post:
      summary: 停止在跑的那一轮
      description: |
        需要 resource_warm.edit。只设停止信号，worker 处理完手上这一集就收尾 ——
        **已经热好的算数**，缓存里的东西不会退回去（docs/06 第 10 节）。
        所以点完之后状态可能还要几秒才从 running 变成 stopped。
        这一轮已经结束时返回 409。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResourceWarmStopRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminResourceWarmJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/resource-warm/progress:
    get:
      summary: 预热进度
      description: |
        需要 resource_warm.view。返回在跑的那一轮；没有在跑的时候返回最近一轮
        （让运营看到上次的结果），从来没跑过时 job 为 null。
        **带 ?stream=1 时返回 SSE**（`event: progress`，每秒一帧，`data` 与本接口的 data 同构）：
        任务跑完后推最后一帧再关闭连接；单条连接最多存活 10 分钟（代理会掐长连接，到点主动关、
        客户端的 EventSource 会自动重连）。不带 stream 就是普通 JSON，便于在不透传 event-stream 的
        环境里降级轮询。
        每次调用都会顺手把心跳停了 5 分钟的任务判定为 interrupted ——
        worker 崩了之后没人改状态，一直挂在 running 会挡住下一轮。
        note 字段说明哪一层缓存被热到了（切片进边缘、清单只进服务端缓存），页面照抄即可。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: stream, in: query, description: 传 1 时返回 SSE, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: |
            进度。不带 stream 时是 JSON；带 ?stream=1 时是 text/event-stream，
            每帧形如 `event: progress` + `data: {AdminResourceWarmProgress 的 JSON}`。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/AdminResourceWarmProgress" } } }
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/resource-warm/history:
    get:
      summary: 预热历史
      description: 需要 resource_warm.view。最近 20 轮，倒序。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminResourceWarmHistory" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 资源体检（S4-5 / A4-2，docs/06 第 9 节）----------

  /api/admin/resource-checks:
    get:
      summary: 资源体检结果
      description: |
        需要 resource_checks.view。q 匹配剧名，纯数字时也当剧编号匹配；可按剧编号筛选、只看打不开的。
        **不分页**，最多 200 条（docs/03 第 9.4 节）：体检是「扫一遍找出坏的」的工具，
        运营的用法是筛「只看打不开」逐条去修，翻页到第 7 页看第 140 条没有意义。
        超出上限时 total 会告诉运营还有多少没显示，让他缩小范围。坏的排在最前。
        响应里的 url 不含查询串（签名材料不入库），summary 是全站概览（不受筛选影响），
        results 是六种结果及中文说明（页面做图例用，前端不必写死）。
        line_warning 非空时说明有一类资源没有可用线路、体检会跳过它们。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: drama_id, in: query, description: 只看某部剧, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: bad_only, in: query, description: 只看打不开的, schema: { type: boolean } }
        - { name: limit, in: query, description: 最多返回多少条（1–200，默认 200）, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { $ref: "#/components/responses/AdminResourceCheckOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/resource-checks/run:
    post:
      summary: 发起资源体检
      description: |
        需要 resource_checks.edit。按剧入队 worker 任务后**立即返回**，不等结果：
        一部剧几十集、一集好几个资源，全站体检是分钟级的事，页面轮询列表看进展比把 HTTP 请求挂在那里等更合适。
        drama_id 为 0 或省略表示全部剧；此时 include_unpublished 决定是否包含草稿与已下架的剧
        （默认只检已上架的 —— 那些是观众现在就能点开的）。
        drama_id 指定的剧不存在时返回 404，不会回「已入队 1 部」的假成功。
        探测目标：剧的竖 / 横封面、每集的封面 / 首帧图、每集当前视频产物。
        空字段与没有产物的分集直接跳过；缺对应 kind 的线路时那类资源也跳过（不写结果）。
        **只读源站**，不会改动任何文件。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResourceCheckRunRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminResourceCheckRunResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/resource-checks/clear:
    post:
      summary: 清空体检结果
      description: |
        需要 resource_checks.edit。drama_id 为 0 或省略表示清全部。
        **只清体检表，不动源文件**（docs/06 第 9 节）：清掉的只是「上次探测的结论」，重新体检就会再长出来。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResourceCheckClearRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminResourceCheckClearResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 开放平台 API Key（A4-3，docs/06 第 32 节）----------

  /api/admin/apikeys:
    get:
      summary: API Key 列表
      description: |
        需要 apikeys.view。q 匹配用途、使用方或密钥开头几位；可按 status 筛选。
        **响应里只有 hint（开头 10 位），没有完整密钥** —— 库里也只存 SHA-256 哈希。
        附带 scopes：全部权限范围及其中文说明，供页面展示，前端不必写死清单。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: status, in: query, description: 按启用状态筛选, schema: { type: string, enum: [active, inactive] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminAPIKeyPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 生成 API Key
      description: |
        需要 apikeys.edit（高敏，S2-6 起要重新验证）。
        **响应里的 secret 是唯一一次能拿到完整密钥的机会**：系统只保存哈希与开头 10 位，
        后台列表、审计记录、服务端日志都取不回来，丢了只能重新生成一把、换掉旧的。
        密钥格式：xsk_ + 32 字节随机数的 base64url 编码，共 47 字符。
        调用方在请求头里带 Authorization: Bearer <密钥>（消费端是 S4-6 的采集入库接口）。
        审计只记用途、使用方、hint 与权限范围 —— 完整密钥不进审计，审计是给人看的，
        密钥落在那里就等于多了一处泄露面。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAPIKeyRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminNewAPIKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/apikeys/{id}:
    patch:
      summary: 改 API Key 的用途与使用方
      description: |
        需要 apikeys.edit（高敏）。只改 name 与 owner。
        **权限范围与密钥本身都不可改**：改范围等于改已经在调用方手里的密钥能做什么，
        要缩小或扩大权限应当重新生成一把、换掉旧的，这样「谁在用什么权限」始终可追溯。
        请求里带了 scopes 也会被忽略。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAPIKeyRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminAPIKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/apikeys/{id}/disable:
    post:
      summary: 停用 API Key
      description: |
        需要 apikeys.edit（高敏）。**即时生效**：鉴权只认 status='active' 的密钥，
        调用方的下一次请求就会被拒。
        没有删除接口：停用已经够用，留着记录才能回答「这把密钥曾经存在、被谁用过」。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200": { $ref: "#/components/responses/AdminAPIKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/apikeys/{id}/enable:
    post:
      summary: 重新启用 API Key
      description: 需要 apikeys.edit（高敏）。密钥本身不变，启用后立刻可以继续调用。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200": { $ref: "#/components/responses/AdminAPIKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 审计日志（A4-3 / S4-7，docs/06 第 34 节）----------

  /api/admin/audit:
    get:
      summary: 审计日志列表
      description: |
        需要 audit.view。所有后台写操作的记录，按时间倒序。
        q 匹配操作人、动作、对象类型或对象编号；另可按动作、对象类型、操作人与日期区间筛选。
        不返回 diff_before / diff_after（改动内容可能很大），详情单独取。
        **审计记录只能读**：没有新建、修改或删除接口，迁移 00003 也没有给 audit 页面生成 .edit 权限点。
        from / to 建议传带时区的完整时间（如 2026-10-25T00:00:00+08:00）；传裸日期会按服务端时区（UTC）解释。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: action, in: query, schema: { type: string, maxLength: 100 } }
        - { name: target_type, in: query, schema: { type: string, maxLength: 50 } }
        - { name: admin_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: from, in: query, description: 起始时间（含），带时区的 RFC3339 或 YYYY-MM-DD, schema: { type: string } }
        - { name: to, in: query, description: 结束时间（不含），带时区的 RFC3339 或 YYYY-MM-DD, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminAuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/audit/facets:
    get:
      summary: 审计筛选项
      description: 需要 audit.view。返回实际出现过的动作、对象类型与操作人（各带条数），供筛选下拉使用。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminAuditFacets" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/audit/verify:
    get:
      summary: 校验审计哈希链
      description: |
        需要 audit.view（读操作，不改数据）。按编号升序走哈希链，返回第一处对不上的位置。
        每条记录的哈希覆盖「上一条的哈希 + 本条全部业务字段」，所以改动或删除任何一条都会让链断开 ——
        这能发现「改完库再抹掉痕迹」，但挡不住有库权限的人写入全新的记录（那需要把哈希外发到别处对账）。
        两种断链：内容与哈希对不上（记录被改过）、与上一条的哈希对不上（中间有记录被删除或插入）。
        只报第一处：链一旦断开，后面每条的链接都会对不上。
        启用哈希链（迁移 00026）之前的记录没有哈希，不参与校验，数量在 unchained 里单独报告。
        单次最多扫 50000 条，可用 max 调小。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: max, in: query, description: 最多校验多少条（默认与上限都是 50000）, schema: { type: integer, minimum: 1, maximum: 50000 } }
      responses:
        "200": { $ref: "#/components/responses/AdminAuditVerifyResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/audit/{id}:
    get:
      summary: 审计详情
      description: |
        需要 audit.view。含改动前后对比（按系统原字段名，英文）与哈希链信息。
        密码、密钥类字段的值在写入时已替换为 ***（docs/10 第 9 节），这里不会出现原文。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200": { $ref: "#/components/responses/AdminAuditDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 配置导出导入（S4-4，docs/06 第 29 节）----------

  /api/admin/config/export:
    get:
      summary: 导出配置备份
      description: |
        需要 config.view。导出筛选维度（含取值）与广告素材，响应带 Content-Disposition 让浏览器存成文件。
        同时在库里留一条 manual 存档（导出意味着一份配置副本离开了系统，要能回答「谁什么时候导出的」）。
        signature 是对「格式版本 + data」的 HMAC：文件是明文 JSON、可人工检视，改动过的文件导入时会被拒绝；
        没有配置 CONFIG_BACKUP_KEYS 时为空串。
        不含菜单、静态页、区块（这三个模块还没实现，导出为空数组），也不含广告的 imp_count / click_count
        （运行期统计，由 worker 从 Valkey 累加落库，写进备份再导回去等于把统计回滚）。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminConfigBackup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/config/import:
    post:
      summary: 导入配置备份（覆盖）
      description: |
        需要 config.edit 🔐（高敏，S2-6 起需 5 分钟内重新验证二次因子）。请求体就是导出的备份文件，上限 8 MiB。
        校验顺序：格式版本 → 签名 → 数据结构与枚举取值 → 导入前自动存档 → 事务内写入 → 站点版本 +1。
        签名规则：配了 CONFIG_BACKUP_KEYS 时必须带有效签名（没签名或签名不符一律 400）；
        没配密钥时文件也不能带签名（无法校验，不能假装通过）；两边都没有时放行（本地开发）。
        **两类数据的写入策略不同**：
        筛选维度按 slug 合并更新（新增或覆盖），备份里没有的维度与取值**保留不删**，数量与名称在
        taxonomies_kept / terms_kept / kept_names 里返回 —— taxonomy_term 被 drama_term 以 ON DELETE CASCADE
        引用，删一个取值会静默清掉所有剧集对它的归属且不报错，所以不做整表替换；
        广告素材整表替换（ad 没有外键进出），原有广告的曝光与点击计数归零。
        导入前的配置会存成一条 before_import 存档，编号在 backup_id 里返回，可用于回滚。记审计 config.import。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminConfigBackup" }
      responses:
        "200": { $ref: "#/components/responses/AdminConfigImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/config/backups:
    get:
      summary: 备份存档列表
      description: 需要 config.view。按时间倒序，最多 50 条，不含正文（只给各类数量）。含每次导出留下的与每次导入前自动存的。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminConfigBackupList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/config/backups/{id}:
    get:
      summary: 取回一份备份存档
      description: 需要 config.view。还原成与导出一致的备份文件，带 Content-Disposition 供下载保存。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200": { $ref: "#/components/responses/AdminConfigBackup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/config/backups/{id}/restore:
    post:
      summary: 从备份存档回滚
      description: |
        需要 config.edit 🔐。直接用库里存档的正文覆盖现有配置，写入策略与导入完全相同（维度合并、广告整表替换），
        同样会先存一份当前配置的存档。
        **不验签**：存档是系统自己生成、一直存在本库里的，可信度来自「它没离开过系统」而不是签名。
        要求它带签名会让「刚启用签名」或「轮换过密钥」之前的存档全部失去回滚价值，而那恰恰是出事时最需要的几份。
        存档下载下来再上传仍然走 /config/import 的验签（文件在外面可能被改过）。
        格式版本与数据结构照样校验。记审计 config.restore。
      tags: [admin-platform]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminConfigImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 后台会员套餐（S3-15 / A3-5） ----------
  /api/admin/vip/plans:
    get:
      summary: 会员套餐列表
      description: |
        需要 vip_plans.view。返回固定五种套餐，含下架项，按 sort、id 升序。code 只读，用户端按 code 映射九语言名称。
        此接口不返回任何支付凭据；支付渠道配置与订单能力尚未开放。
      tags: [admin-billing]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 套餐列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/AdminVIPPlan" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/vip/plans/{id}:
    patch:
      summary: 保存会员套餐
      description: |
        需要 vip_plans.edit。整体保存套餐可编辑字段，套餐 code 不可修改。上架时必须有正的人民币与 USDT 价格、至少一个客户端和允许渠道；
        划线价为 0 或不得低于人民币售价。保存后失效全部客户端套餐缓存，并记审计 vip_plan.update。
      tags: [admin-billing]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVIPPlanUpdateRequest" }
      responses:
        "200":
          description: 已保存的套餐
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminVIPPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 反馈社区 · 前台（feedback/docs/08，adr/0008）----------
  # 浏览器只与 H5 前台（Next.js）同源通信，由前台服务端带 X-Service-Token 转发到这里，
  # 命中 isInternalSSR 豁免（明文）；社区会话走 Authorization: Bearer，不用 Cookie，因此不需要 CSRF。
  /api/admin/announcements:
