      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { type: array, minItems: 1, maxItems: 10, items: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/hotsearch/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AdminOrigin"
      - $ref: "#/components/parameters/CSRFToken"
    patch:
      summary: 改显示或置顶
      description: |
        需要 hotsearch.edit。部分修改，只传要改的项。置顶的词一定显示：置顶时自动设为显示，设为不显示时同时取消置顶；
        同时传 visible=false 与 pinned=true 返回 400。新置顶的排在最后，最多置顶 10 个（超过 400）。前台立即生效。
        记审计 hotsearch.update（修改前后）。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                visible: { type: boolean }
                pinned: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/AdminHotWordResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除热搜词
      description: 需要 hotsearch.edit。连同搜索次数删除，不可恢复；之后再被搜到会重新自动收录（默认不显示）。记审计 hotsearch.delete。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/ranks/recompute:
    post:
      summary: 马上重新排名（两张榜）
      description: |
        需要 ranks.edit。把重新排名交给 worker（River 任务 rank_recompute）并最多等 5 秒：done=true 表示已算完、前台已是新结果；
        done=false 表示 worker 还没算完（任务不撤销，稍后完成；worker 另外每 5 分钟自动重新排名）。任务失败返回 503。记审计 rank.recompute。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [done]
                        properties:
                          done: { type: boolean, description: 是否已在等待时间内算完 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/admin/ranks/{board}:
    parameters:
      - name: board
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RankBoard" }
    get:
      summary: 一张榜的人工调整、线上榜单与预览
      description: |
        需要 ranks.view。live 是前台正在显示的前 20 名（上次重新排名的结果，computed_at 为计算时间，没算过时为 null）；
        preview 按当前的系数与人工调整现算前 20 名，重新排名后前台就是这个结果。未知榜单 404。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminRankBoardResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: 整体保存一张榜的人工调整
      description: |
        需要 ranks.edit。overrides 是这张榜全部的调整（不在里面的调整删除；清空传空数组，不传 overrides 返回 400）。
        每部剧一行（同一部剧出现两次返回 400）：置顶（排在最前，多部置顶之间按分数）与不让上榜互斥；加分为 -1000000000 到 1000000000，负数为减分；
        三项都没调的行忽略。最多 100 行；剧集不存在或在回收站时返回 400 并列出编号。只影响这张榜，重新排名后才生效。
        返回保存后的页面数据（同 GET）。记审计 rank.update（修改前后）。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides]
              additionalProperties: false
              properties:
                overrides:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [drama_id]
                    additionalProperties: false
                    properties:
                      drama_id: { type: integer, format: int64, minimum: 1 }
                      pinned: { type: boolean, default: false }
                      blocked: { type: boolean, default: false, description: 不让上榜，只影响这张榜 }
                      boost: { type: integer, format: int64, minimum: -1000000000, maximum: 1000000000, default: 0 }
      responses:
        "200": { $ref: "#/components/responses/AdminRankBoardResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/ranking-config:
    get:
      summary: 榜单计分系数
      description: 需要 ranks.view。分数 = 播放 × play + 追剧 × follow + 点赞 × like + 看完 × finish + 运营加分（site_config.ranking）。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminRankWeightsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存榜单计分系数
      description: |
        需要 ranks.edit。四个系数都要传（缺了返回 400，不当作 0），每个 0–1000，保留两位小数。重新排名后才生效。
        只给后台读，不改前台站点配置的 version。记审计 ranking_config.update（修改前后）。
      tags: [admin-ops]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RankWeights" }
      responses:
        "200": { $ref: "#/components/responses/AdminRankWeightsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/pages:
    get:
      summary: 静态页列表
      description: 需要 pages.view。搜标题或 slug，按状态筛选，页码分页（新的在前）。docs/06 第 13 节、docs/specs/A3-1.md。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminStaticPagePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建静态页
      description: |
        需要 pages.edit。slug 全站唯一（小写字母、数字、连字符），重复返回 409。正文按白名单清洗后入库
        （两种格式同一策略；清洗后为空返回 400），响应里的 body 是清洗结果。默认草稿，草稿不对前台下发。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStaticPageRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStaticPageResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: CONFLICT（slug 已被别的静态页使用） }

  /api/admin/pages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      summary: 整体保存静态页
      description: 需要 pages.edit。整体覆盖（没传的字段按默认值保存）；规则同新建。记审计 page.update（修改前后）。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStaticPageRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminStaticPageResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: CONFLICT（slug 已被别的静态页使用） }
    delete:
      summary: 删除静态页
      description: 需要 pages.edit。删除不可恢复（不进回收站）；之后指向它的前台菜单项自动隐藏。记审计 page.delete。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { type: object, required: [id], properties: { id: { type: integer, format: int64 } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/menus:
    get:
      summary: 前台菜单（全部位置）
      description: |
        需要 menus.view。菜单条数很少，一次返回全部，按位置与顺序排。每项带 target_issue：链接目标被删除或当前不对前台显示时
        说明原因（前台不下发该项，记录保留）。docs/06 第 12 节、docs/specs/A3-1.md。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSiteMenuList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建前台菜单
      description: |
        需要 menus.edit。新建排在该位置的末尾。slug 类链接的目标必须存在（可以指向草稿，发布后自动出现），不存在返回 400；
        手机底栏最多 5 项（只算启用的），超出返回 400。保存后站点配置版本 +1，前台秒级生效。记审计 menu.create。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSiteMenuRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminSiteMenuResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/menus/reorder:
    post:
      summary: 按位置重排前台菜单
      description: 需要 menus.edit。ids 必须恰好是该位置现有的全部菜单，否则 409（别人刚增删过，请刷新）。记审计 menu.reorder。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, ids]
              additionalProperties: false
              properties:
                position: { $ref: "#/components/schemas/MenuPosition" }
                ids: { type: array, maxItems: 50, items: { type: integer, format: int64 }, description: 该位置菜单的新顺序 }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [position, ids]
                        properties:
                          position: { $ref: "#/components/schemas/MenuPosition" }
                          ids: { type: array, items: { type: integer, format: int64 } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: NOT_FOUND（未知位置） }
        "409": { description: CONFLICT（ids 与该位置现有菜单不一致，请刷新） }

  /api/admin/menus/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      summary: 整体保存前台菜单
      description: 需要 menus.edit。整体覆盖；改了位置时放到新位置的末尾。规则同新建。记审计 menu.update（修改前后）。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSiteMenuRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminSiteMenuResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除前台菜单
      description: 需要 menus.edit。删除不可恢复（不进回收站）。记审计 menu.delete。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/IdResult" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/addresses:
    get:
      summary: 防丢地址「回家的路」
      description: 需要 menus.view（与前台菜单同一个页面，docs/06 第 12 节）。存在 site_config.addresses 段，随站点配置下发。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminAddressesResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: 保存防丢地址
      description: |
        需要 menus.edit。整体覆盖；全部字段可留空。地址只收 http(s) 完整地址（站内路径与其他协议 400）；备用地址最多 3 个、
        社交账号最多 10 个且名称与链接都要填（整行留空的忽略）。保存后站点配置版本 +1 并广播失效，响应返回新版本。
        记审计 addresses.update（修改前后）。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAddresses" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [addresses, site_version]
                        properties:
                          addresses: { $ref: "#/components/schemas/SiteAddresses" }
                          site_version: { type: integer, format: int64, description: 版本 +1 后的站点配置版本 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/blocks:
    get:
      summary: 某个页面的区块（按顺序）
      description: |
        需要 blocks.view。区块条数很少，一次返回该页面的全部区块（含停用的），按编排顺序。
        docs/06 第 15 节、docs/specs/A3-1.md。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: string, maxLength: 72 }
          description: "home（默认）或 channel:{频道 slug}；未知页面 404"
      responses:
        "200": { $ref: "#/components/responses/AdminBlockList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建页面区块
      description: |
        需要 blocks.edit；type 为 custom_html 时另要 blocks.custom_html（默认只有超级管理员），否则 403。
        新建排在该页面的末尾，单个页面最多 50 个区块。按 type 只保存该类型用得到的来源参数，其余字段忽略。
        自定义 HTML 按白名单清洗后入库（脚本、样式表、iframe、表单与事件属性去掉），清洗后为空时 400。
        保存后该页面的前台缓存立即清除。记审计 block.create。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBlockRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminBlockResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/blocks/pages:
    get:
      summary: 可编排的页面
      description: 需要 blocks.view。首页固定在第一个，其后是启用的频道页（频道取值），用于后台的页面下拉。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminBlockPageList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/blocks/reorder:
    post:
      summary: 按页面重排区块
      description: 需要 blocks.edit。ids 必须恰好是该页面现有的全部区块，否则 409（别人刚增删过，请刷新）。记审计 block.reorder。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page, ids]
              additionalProperties: false
              properties:
                page: { type: string, maxLength: 72, description: "home 或 channel:{频道 slug}" }
                ids: { type: array, maxItems: 50, items: { type: integer, format: int64 }, description: 该页面区块的新顺序 }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [page, ids]
                        properties:
                          page: { type: string }
                          ids: { type: array, items: { type: integer, format: int64 } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: NOT_FOUND（未知页面） }
        "409": { description: CONFLICT（ids 与该页面现有区块不一致，请刷新） }
  /api/admin/blocks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      summary: 整体保存页面区块
      description: |
        需要 blocks.edit。整体覆盖；改了页面时放到新页面的末尾。规则同新建。
        原本是 custom_html 的区块（即使改成别的类型）也要 blocks.custom_html。记审计 block.update（修改前后）。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBlockRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminBlockResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除页面区块
      description: 需要 blocks.edit（自定义 HTML 区块也只要 blocks.edit）。删除不可恢复（不进回收站）。记审计 block.delete。
      tags: [admin-site]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/IdResult" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/feedback/auth/register:
    post:
      summary: 用邀请码注册社区账号
      tags: [反馈社区-账号]
      description: |
        必须持有效邀请码；成功即登录。
        **不发放任何找回凭据**：这个社区不收邮箱与手机号，也没有恢复码，
        忘记密码即永久失去账号（adr/0011）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbRegisterRequest" }
      responses:
        "200": { $ref: "#/components/responses/FbAuthResultOK" }
        "400": { description: 参数错误或邀请码无效 }
        "409": { description: 用户名已被使用 }
  /api/v1/feedback/auth/login:
    post:
      summary: 社区登录
      tags: [反馈社区-账号]
      description: 用户名不存在与密码错误返回同一业务码 NEED_LOGIN，响应耗时相近；失败次数过多返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbLoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/FbAuthResultOK" }
        "401": { description: 用户名或密码不正确 }
        "403": { description: 账号已被封禁 }
        "429": { description: 失败次数过多，带 Retry-After }
  # 没有 /api/v1/feedback/auth/recover：恢复码与「忘记密码」已在 0.41.0 删除（adr/0011）。
  # 唯一的改密入口是 PUT /api/v1/feedback/me/password，必须提供当前密码。
  /api/v1/feedback/auth/logout:
    post:
      summary: 退出登录
      tags: [反馈社区-账号]
      description: 幂等；没带令牌也返回成功。
      responses:
        "200": { $ref: "#/components/responses/FbEmptyOK" }
  /api/v1/feedback/me:
    get:
      summary: 当前社区用户
      tags: [反馈社区-账号]
      responses:
        "200": { $ref: "#/components/responses/FbUserOK" }
        "401": { description: 未登录或令牌已失效 }
    patch:
      summary: 修改公开资料
      tags: [反馈社区-账号]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbProfileRequest" }
      responses:
        "200": { $ref: "#/components/responses/FbUserOK" }
        "400": { description: 昵称或简介超长 }
  /api/v1/feedback/me/password:
    post:
      summary: 用当前密码改密
      tags: [反馈社区-账号]
      description: |
        成功后旧令牌立即失效，响应返回新令牌。
        这是**唯一**的改密入口，必须提供当前密码；没有「忘记密码」通道（adr/0011）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbChangePasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/FbAuthResultOK" }
        "400": { description: 当前密码不正确或新密码不合规 }
  /api/v1/feedback/me/projects:
    get:
      summary: 我加入的项目
      tags: [反馈社区-项目]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FbProjectView" } }
  /api/v1/feedback/me/issues:
    get:
      summary: 我提交的反馈
      tags: [反馈社区-反馈]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/FbFeedbackPageOK" }
  /api/v1/feedback/projects:
    get:
      summary: 可见项目目录
      tags: [反馈社区-项目]
      description: 公开项目对所有人可见；仅成员项目只对已加入的用户可见；草稿与归档不列出。
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FbProjectView" } }
                          total: { type: integer, format: int64 }
                          page: { type: integer }
                          page_size: { type: integer }
  /api/v1/feedback/projects/{slug}:
    get:
      summary: 项目详情
      tags: [反馈社区-项目]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbProjectView" } }
        "404": { description: 项目不存在或无权查看（不区分，避免探测） }
  /api/v1/feedback/projects/{slug}/join:
    post:
      summary: 加入项目
      tags: [反馈社区-项目]
      description: |
        join_mode=open 时直接成为成员（status=active）。
        join_mode=application（需审核）时落成待审（status=pending），由运营在后台通过或拒绝；
        重复调用不会重复写入，直接返回当前状态。
        join_mode=invite_only / closed 返回 403——这两种只能靠注册时的项目邀请码，
        或由运营在后台添加成员。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbProjectView" } }
        "403": { description: 该项目只能通过邀请码加入 }
        "409": { description: 项目暂停加入 }
  /api/v1/feedback/posts:
    get:
      summary: 项目动态流
      tags: [反馈社区-动态]
      description: 只返回已发布且可见的动态，置顶优先、再按发布时间倒序。
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FbPost" } }
                          total: { type: integer, format: int64 }
                          page: { type: integer }
                          page_size: { type: integer }
  /api/v1/feedback/posts/{id}:
    get:
      summary: 动态详情
      tags: [反馈社区-动态]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbPost" } }
        "404": { description: 动态不存在或无权查看 }
  /api/v1/feedback/issues:
    get:
      summary: 反馈列表
      tags: [反馈社区-反馈]
      description: |
        可见性在 SQL 中过滤：public 对所有人可见，members 要求已加入项目，private 只有作者本人可见。
        sort 取 latest（默认，按最近活动）、newest（按提交时间）、votes（按票数）。
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FbStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/FbKind" } }
        - { name: q, in: query, schema: { type: string }, description: 搜标题 }
        - { name: sort, in: query, schema: { type: string, enum: [latest, newest, votes] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/FbFeedbackPageOK" }
    post:
      summary: 提交反馈
      tags: [反馈社区-反馈]
      description: 需要已加入项目（join_mode=open 时自动加入）；项目状态必须是 recruiting 或 active。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/FbFeedbackOK" }
        "400": { description: 标题、正文或类型不合规 }
        "401": { description: 未登录 }
        "403": { description: 未加入项目或账号被限制 }
        "409": { description: 项目暂不接受新反馈 }
  /api/v1/feedback/issues/{slug}/{number}:
    get:
      summary: 反馈详情与公开状态历史
      tags: [反馈社区-反馈]
      description: events 中不含 internal_note（内部备注只出现在后台接口）。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: number, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbFeedbackDetail" } }
        "404": { description: 不存在或无权查看（私密反馈对他人一律 404） }
  /api/v1/feedback/issues/{slug}/{number}/vote:
    put:
      summary: 设置或取消投票
      tags: [反馈社区-反馈]
      description: 传目标状态，重复调用结果一致；票数以明细重算。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: number, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties: { active: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/FbFeedbackOK" }
        "404": { description: 不存在或无权查看 }
  /api/v1/feedback/leaderboard:
    get:
      summary: 贡献榜（登录可见）
      tags: [反馈社区-账号]
      description: 隐藏了等级的用户不出现在榜上（adr/0005，非货币化）。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FbLeaderboardEntry" } }

  # ---------- 反馈社区 · 运营后台（feedback/docs/07）----------
  /api/admin/feedback/projects:
    get:
      summary: 内测项目列表
      tags: [反馈社区-后台]
      description: 权限点 fb_projects.view。
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FbProjectStatus" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FbProject" } }
                          total: { type: integer, format: int64 }
                          page: { type: integer }
                          page_size: { type: integer }
    post:
      summary: 新建内测项目
      tags: [反馈社区-后台]
      description: 权限点 fb_projects.edit。只有平台管理员能创建项目（adr/0001）。
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbProjectInput" }
      responses:
        "200": { $ref: "#/components/responses/FbProjectOK" }
        "409": { description: 项目标识或编号前缀已被使用 }
  /api/admin/feedback/projects/{id}:
    patch:
      summary: 保存内测项目（整体保存）
      tags: [反馈社区-后台]
      description: 权限点 fb_projects.edit。
      security: [{ AdminSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PathID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbProjectInput" }
      responses:
        "200": { $ref: "#/components/responses/FbProjectOK" }
    delete:
      summary: 删除内测项目
      tags: [反馈社区-后台]
      description: 权限点 fb_projects.edit。只允许删除还没有任何反馈的项目，否则 409（改为「已归档」）。
      security: [{ AdminSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PathID" }
      responses:
        "200": { $ref: "#/components/responses/FbEmptyOK" }
        "409": { description: 项目下已有反馈 }
  /api/admin/feedback/projects/{id}/members:
    get:
      summary: 项目成员列表
      tags: [反馈社区-后台]
      description: 权限点 fb_projects.view。
      security: [{ AdminSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PathID" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FbMember" } }
                          total: { type: integer, format: int64 }
                          page: { type: integer }
                          page_size: { type: integer }
  /api/admin/feedback/projects/{id}/members/{user_id}:
    patch:
      summary: 添加成员、调整成员角色或移除成员
      tags: [反馈社区-后台]
      description: |
        权限点 fb_projects.edit。改成员角色，或把成员移出项目（remove=true）。

        **成员行不存在时这次调用是「添加成员」**：邀请码只在注册时核销，
        所以这是运营把已注册账号拉进「仅邀请」项目的唯一入口。
        账号本身不存在时返回 404；移除一个本来就不是成员的人也返回 404。
        不能移除项目所有者（先转移所有权）。
      security: [{ AdminSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PathID" }
        - { name: user_id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/FbMemberRole" }
                remove: { type: boolean, description: true 表示移除成员 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbMember" } }
        "409": { description: 不能移除项目所有者 }
  /api/admin/feedback/issues:
    get:
      summary: 反馈分诊队列
      tags: [反馈社区-后台]
      description: 权限点 fb_issues.view。sort 另支持 oldest（最久未处理优先）。
      security: [{ AdminSession: [] }]
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FbStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/FbKind" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/FbPriority" } }
        - { name: visibility, in: query, schema: { $ref: "#/components/schemas/FbVisibility" } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/FbSource" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, newest, votes, oldest] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/FbFeedbackPageOK" }
  /api/admin/feedback/issues/overview:
    get:
      summary: 按状态的反馈数量
      tags: [反馈社区-后台]
      description: 权限点 fb_issues.view。
      security: [{ AdminSession: [] }]
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                status: { $ref: "#/components/schemas/FbStatus" }
                                total: { type: integer, format: int64 }
  /api/admin/feedback/issues/{id}:
    get:
      summary: 反馈详情（含内部备注）
      tags: [反馈社区-后台]
      description: 权限点 fb_issues.view。events 含 internal_note，不可下发到前台。
      security: [{ AdminSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PathID" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbFeedbackDetail" } }
  /api/admin/feedback/issues/{id}/triage:
    post:
      summary: 分诊并流转状态
      tags: [反馈社区-后台]
      description: |
        权限点 fb_issues.edit。带乐观锁：version 必须与当前一致，否则 409。
        状态流转受状态机约束（adr/0004），非法流转返回 400。
        status=duplicate 必须给同项目的 duplicate_of；status=declined 必须写公开原因 note。
        submitted→triaged 记作者 +1 分，进入 shipped 记 +4 分，同一来源只记一次。
      security: [{ AdminSession: [] }]
      parameters:
