openapi: 3.1.0
info:
  title: x-site API
  version: 0.73.0
  description: |
    三端共用的接口契约（docs/07）。改接口必须先改本文件。
    路径前缀（docs/07 第 0.5 节）：前台（Web、APP）接口一律 /api/v1/*，运营后台接口一律 /api/admin/*，
    开放平台 /open-api/*；/api/ 下不允许其他命名空间。
    成功响应：{ code: "OK", message: "ok", data }；失败响应：{ code: <业务码>, message, request_id }。
    JSON 请求体出现未知字段时返回 400 BAD_REQUEST。

    报文加密（docs/10 第 5.3 节）：浏览器与 APP 发往 /api/v1/* 的请求一律带 X-Enc 头，请求体与响应体为
    application/vnd.xsite.enc 密文（HPKE：DHKEM(X25519, HKDF-SHA256) + HKDF-SHA256 + AES-256-GCM）。
    下文各接口的 schema 描述的是解密后的明文。豁免：/api/v1/health、/api/v1/crypto/keys；
    SSR 阶段 BFF 内网直连允许明文。/api/admin/*、/open-api/* 不加密。

    运营后台 /api/admin/*（docs/03 第 2.3 节）：会话放在 HttpOnly Cookie（见 securitySchemes.AdminSession）；
    写请求带 Origin 时必须在服务端 ADMIN_ORIGINS 白名单中，登录后的写请求还必须带 X-CSRF-Token（取自登录或 /api/admin/me 的
    csrf_token），否则 403 FORBIDDEN。每个接口按权限点判定（docs/03 第 2.5 节、docs/adr/0006），无权限返回 403；
    下文各接口在 description 中注明所需权限点。

    0.4.0（破坏性变更）：/admin-api/me 与登录响应的 permissions 由权限分组改为权限点编码；user.role 由固定的四种角色改为角色编码，
    并增加 role_name、is_super。新增管理员、角色、角色权限、后台菜单接口。
    0.5.0（破坏性变更）：后台菜单改为一级 / 二级，一级菜单可以是目录、页面或外链。/admin-api/me/menus 改为两级节点
    （AdminNavNode，原 items 改为 children），/admin-api/permissions 改为权限树（AdminPermissionNode，原 pages 改为 children）；
    外链可以不选上级目录。内置角色只保留超级管理员。/admin-api/* 唯一的调用方 admin 已同步修改。
    0.6.0（破坏性变更，docs/adr/0007）：路径前缀调整，请求与响应不变。用户端 /api/<路径> 改为 /api/v1/<路径>
    （含 /api/v1/health、/api/v1/crypto/keys），运营后台 /admin-api/<路径> 改为 /api/admin/<路径>；旧路径返回 404。
    apps、admin、mobile 已同步修改（尚未上线，没有保留旧路径）。
    0.7.0（新增，S1-3）：后台内容管理接口：剧集（含批量）、分集、演员、标签（合并）、筛选维度与取值、专题。
    后台列表用页码分页（?page=&page_size=，返回 list、total、page、page_size），数量少的分集与维度一次返回全部。
    保存接口（PATCH）是整体保存：未传的可选字段按新建时的默认值保存。
    0.8.0（新增，S1-6）：后台资源机接口：资源机增删改查、测连、打开目录（/api/admin/ftp）。测连与打开目录由 worker 执行，
    API 最多等 25 秒，超时 503 UNAVAILABLE。
    0.9.0（新增，S1-5）：后台转封装接口：提交分集的转封装任务（POST /api/admin/episodes/{id}/transcode）、查询任务
    （/api/admin/transcode-jobs）。AdminEpisode.video_object_id 在转封装完成后指向产物。
    0.10.0（新增，S1-6a）：后台存储源接口：存储源增删改查、连通性测试（/api/admin/storage/providers）。
    支持 S3 / Cloudflare R2 / 自定义（S3 兼容、HTTP 源）；凭据信封加密、只写不读；连通性测试在 API 进程执行，自定义端点经出站地址校验（SSRF）。
    0.11.0（破坏性变更，S1-3a）：删除演员模块。删除 /api/admin/actors、/api/admin/actors/{id}、PUT /api/admin/dramas/{id}/actors
    （均返回 404），剧集详情 AdminDramaDetail 去掉 actors；权限点 actors.view / actors.edit 与「演员」菜单一并删除。
    唯一的调用方 admin 已同步修改（尚未上线，没有保留旧接口）。
    0.12.0（新增，S1-6b/d）：后台存储线路、全局设置与选线预览接口。线路增删改查、地区规则整体替换、HTTP 连通性测试
    （/api/admin/storage/lines）；存储全局设置读取与保存（/api/admin/storage/settings，候选数量、默认有效期、主存储、上传即复制）；
    选线预览（/api/admin/storage/preview）按匹配精度 + 加分 + 优先级 + 健康分 − 观察惩罚打分排序，支持直接输入地区测试算法。
    0.13.0（新增，S1-4）：前台内容读接口：剧详情（/api/v1/dramas/{id}）、频道（/api/v1/channels/{slug}）、
    标签（/api/v1/tags/{slug}）、探索（/api/v1/explore）、专题列表与详情（/api/v1/topics[/{slug}]）。
    前台列表用游标分页（返回 list、next_cursor、total，cursor 不透明、limit ≤ 60），只有频道页用页码分页（page ≤ 100）。
    响应只含前台可见的内容（已上架且定时已到点、不在回收站），不含 status、view_base、hot_score、media_status 等后台字段；
    每个接口带 ETag 与 Cache-Control（加密响应被强制改为 no-store，s-maxage 只对 BFF 明文直连生效）。
    0.14.0（新增，S1-6d）：后台线路健康看板接口（GET /api/admin/storage/health）。返回每条线路的生效健康分与
    最近一次服务端探测明细；健康分由 worker 周期性探测 probe_path 得出（成功率与耗时，EMA 平滑，存 Valkey），
    无数据时按缺省满分、不过滤线路。选线预览据此替换了此前的占位健康分。客户端质量上报与地区维度待用户端接入。
    0.15.0（新增，S1-6d）：用户端选线接口：当前地区的线路列表（GET /api/v1/lines，用于线路菜单与测速，不含对象地址与签名）、
    客户端质量上报（POST /api/v1/lines/report，批量，按设备每分钟 30 条，超出静默丢弃）。两者都走报文加密。
    选线复用后台同一套打分，同分按 weight 加权随机打散（种子取 X-Device-Id + 当前 10 分钟片，同设备短期内结果稳定）。
    地区由客户端 IP 经 GeoIP 解析；GeoIP 数据未接入前解析为未知地区 XX（只匹配全局兜底线路），
    development 环境可用 X-Debug-Geo: CN/广东/电信 模拟地区。选源（/api/v1/episodes/{id}/sources）仍属 S1-6e/S1-7。
    0.16.0（变更，S1-6d）：客户端质量上报并入健康分。健康分改为「服务端探测 × 40% + 客户端上报 × 60%」
    （缺一边时只用另一边，都无数据时按缺省满分），客户端分由最近 15 分钟上报的失败率（60%）与平均首帧（40%）算出，
    样本不足 5 条时不计分。按「线路 × 国家 × 运营商」计算，本地区样本不足时回退到全部地区的汇总。
    健康看板（/api/admin/storage/health）因此新增 probe_score、has_probe、client、window_min、probe_weight、client_weight；
    选线预览（/api/admin/storage/preview）的每条线路新增 health（健康分来源分解）。用户端 /api/v1/lines 的响应形状不变。
    0.17.0（新增，反馈社区）：接入独立于短剧业务的反馈社区（表前缀 fb_，迁移 00012，feedback/docs/adr/0008）。
     前台 /api/v1/feedback/*（邀请码注册、用户名登录、项目目录、动态流、反馈提交与投票、贡献榜；
     0.41.0 起没有任何账号找回途径），
     后台 /api/admin/feedback/*（项目、分诊、动态、邀请码、社区成员，权限点 fb_projects/fb_issues/fb_posts/fb_invites/fb_users）。
     社区会话走 Authorization: Bearer（不用 Cookie，故无 CSRF）；H5 前台经自身服务端带服务令牌转发，命中 isInternalSSR 豁免。
     反馈状态机见 adr/0004，分诊带乐观锁 version；内部备注 internal_note 只出现在后台响应。
    0.18.0（新增，S3-2 / A3-2 公告，docs/specs/A3-4.md）：后台公告增删改查（/api/admin/announcements，权限点 announcements.*），
    前台当前显示中的公告（GET /api/v1/announcements?locale=）。公告按「投放语言」locales 定向（空 = 全部语言）。
    0.19.0（新增，S1-6e）：线路签名器。线路的 sign_type 开始真正生效：s3_presign（用存储源只读凭据生成 SigV4 预签名）、
    hmac_token（目录前缀签名，一个令牌覆盖整集切片，查询串带 p/exp/s）、cdn_vendor（厂商 URL 鉴权，适配器框架，
    当前内置 timestamp_md5）、none（公开读）。签名密钥由 LINE_SIGN_KEYS 注入、不入库，sign_key_ref 指向其中一项并在保存时校验格式
    （hmac_token 填密钥引用，cdn_vendor 填 厂商名/密钥引用，s3_presign 与 none 清空）。
    线路测试（POST /api/admin/storage/lines/{id}/test）新增 sign 字段做签名自检。清单重写接入见 S1-8。
    0.20.0（新增，S1-7，docs/specs/S1-7.md）：选源 GET /api/v1/episodes/{id}/sources。按分集 access 判定：free 直接看；
    login 未登录时有 trial_sec 则试看、否则 401 NEED_LOGIN；vip 非会员（游客一律视为非会员）有 trial_sec 则试看、否则
    402 NEED_VIP（新增业务码）。返回地区、候选视频线路（与 /api/v1/lines 同一套打分，手选 line_id 在候选中且健康时置顶并标 manual）
    与每条线路的清单地址 /api/v1/hls/{令牌}/index.m3u8（S1-8），令牌 10 分钟有效，绑定分集、线路、设备哈希与试看秒数。
    按设备每分钟 60 次（超出 429 + Retry-After）；Cache-Control: private, no-store。登录与会员判定在 S1-10 / S2-1 / S3-10 接入，
    在此之前所有观看者都是游客。
    0.21.0（新增，S1-6f）：媒体副本与存储源运维。转封装产物写 role=primary 存储源并在同一事务登记主副本、入队 River 复制任务，
    复制到全部 role=mirror；选源只返回已有 ready 副本的存储源上的线路（镜像复制完成前不下发该线路）。
    新增手动触发复制（POST /api/admin/storage/replicate，范围 all / drama / provider）与存储源迁移
    （POST /api/admin/storage/migrate，先复制到迁入源、就绪后撤迁出副本记录，不删物理文件因此可逆），两者都要 storage_settings.edit；
    删除存储源在仍有媒体副本时返回 400（需先设为 draining 并迁移）。
    0.22.0（新增，S3-6 / A3-4 广告，docs/specs/A3-4.md）：后台广告增删改查（/api/admin/ads，权限点 ads.view / ads.edit；
    新建或修改 HTML 素材另要 ads.custom_html，否则 403，HTML 保存时按白名单清洗）。前台 GET /api/v1/ads?slots=&n=&device=&locale=
    按位置加权随机投放（端定向、投放语言、结束时间、按设备按天频控），POST /api/v1/ads/event 上报曝光 / 点击（204，同设备同广告
    同事件 1 秒内只计一次）。设备标识用请求头 X-Device-Id（UUID），没有时按 IP 网段 + UA 摘要。
    0.23.0（新增，S1-6f）：接管历史产物 POST /api/admin/storage/adopt（需 storage_settings.edit）。
    给 S1-6f 之前写入默认桶、没有 media_replica 记录的对象补登记副本：扫描无副本的对象并入队，
    worker 先校验对象在指定存储源上真实存在（HLS 目录要求目录下有文件且含 master.m3u8，单文件用 HEAD）再登记 ready 副本；
    校验不通过的跳过、不写副本（否则选源会把线路下发到实际没有文件的存储源）。已有副本的对象跳过，幂等可重复触发。
    0.25.0（新增，S1-6f）：清理孤立产物。GET /api/admin/storage/orphans（统计，需 storage_settings.view）与
    POST /api/admin/storage/cleanup（清理 / 预览，需 storage_settings.edit）。分集删除后、重新转封装后产物不再被
    episode.video_object_id 引用，worker 每天先标记（media_object.orphaned_at，迁移 00019）再删除已过保留期的对象
    与各存储源上的物理文件；保留期由 MEDIA_ORPHAN_RETENTION 控制（默认 720h，production 不应短于 168h）。
    删除不可逆：删文件前再查一次引用、文件删不掉就保留记录下轮再试，dry_run=true 只预览不改数据也不记审计。
    0.26.0（新增，S1-8，docs/specs/S1-8.md）：播放清单 GET /api/v1/hls/{token}/{file}（index.m3u8 主清单、v{短边}.m3u8 各档清单）
    与内容密钥 GET /api/v1/hls/key/{episode_id}/{key_ver}?t={token}。只收加密请求：明文一律 400 ENC_REQUIRED（不受
    API_ENCRYPTION_REQUIRED 影响，SSR 内网直连也不放行）。令牌过期 401 TOKEN_EXPIRED，格式错误、签名不对或不是签给本设备的
    403 FORBIDDEN，客户端两者都重新选源。各档清单的对象（新 MPEG-TS 切片与历史 fMP4 init 段）改写为令牌所指线路上的签名地址（有效期为线路 token_ttl），
    密钥地址带令牌；试看令牌只返回结束时间不超过 trial_sec 的切片。线路不可用 503；密钥按设备每集每分钟 20 次（429）。
    0.27.0（新增，S3-4 / A3-4 热搜词，docs/specs/A3-4.md）：后台热搜词（/api/admin/hotsearch，权限点 hotsearch.view / hotsearch.edit）：
    列表（搜词，按显示、置顶、片库没有筛选）、手动加词（规范化后保存，默认显示，已有的词 409）、改显示与置顶（置顶时自动显示，
    最多置顶 10 个）、置顶排序（POST /api/admin/hotsearch/reorder，必须恰好是当前全部置顶词，否则 409）、删除（连搜索次数）。
    前台热搜榜 GET /api/v1/search/hot：置顶的按顺序在前，其余显示中的词按搜索次数倒序，共 10 个。搜索次数由搜索接口（S3-4）
    计入 Valkey、worker 每小时落库，自动收录的词默认不显示。
    0.28.0（新增，S3-5 / A3-4 排行干预，docs/specs/A3-4.md）：后台 GET/PUT /api/admin/ranks/{board}（人工调整：置顶、不让上榜、加分，
    整体保存；返回调整、线上榜单与按当前设置的预览）、POST /api/admin/ranks/recompute（马上重新排名，最多等 5 秒）、
    GET/PUT /api/admin/ranking-config（计分系数 play / follow / like / finish，存 site_config.ranking），权限点 ranks.view / ranks.edit。
    前台 GET /api/v1/rank?board=drama_week|drama_month：前 20 名（名次、热度值、剧卡片），features.ranks 关闭时 404。
    worker 每 5 分钟重新排名，结果写进新的 Valkey 有序集合后原子替换，读的一方没有空窗。
    0.29.0（新增，S4-4 / A4-2 缓存管理，docs/06 第 28 节）：GET /api/admin/cache（概览：站点版本、键总数与内存占用、
    清理范围、各前缀键数）与 POST /api/admin/cache/purge（按范围清缓存），权限点 cache.view / cache.edit。
    范围：site_config、home、list、drama、play、topic、rank、ops、all；drama 与 play 要带 drama_id。
    只清白名单内的读穿缓存前缀，不动会话、限流计数、尚未落库的统计与榜单本体（概览里把这些标为 purgeable=false 并说明原因）。
    清 site_config 与 all 会令站点配置版本 +1 并广播失效（S1-9），响应返回新版本。
    0.31.0（新增，S1-10，docs/specs/S1-10.md）：用户端身份。POST /api/v1/auth/guest 签发游客身份，返回 Access Token
    （无状态 JWT，EdDSA/Ed25519，头部带 kid，载荷 sub/sid/role/iat/exp，15 分钟，固定只接受 alg=EdDSA）与 Refresh Token
    （256 bit 随机串，服务端只存 SHA-256，游客有效期 180 天）。POST /api/v1/auth/refresh 轮换：每次新建会话行、吊销旧行并保持同族，
    旧令牌再被使用即判定泄露、吊销整族（此后新旧令牌都失效）；不存在 / 过期 / 复用一律 401 TOKEN_EXPIRED，不区分原因。
    POST /api/v1/auth/logout 吊销当前会话族（幂等 204）。游客签发按客户端 IP 前缀每分钟 30 次。签名密钥由 JWT_SIGNING_KEYS 注入、
    只有 API 进程签发与校验；会话落 user_session（迁移 00023，docs/02 第 5.1.1 节）。Access Token 的跨接口消费（身份中间件）随 S2-1。
    0.32.0（新增，S4-4 / A4-2 配置导出导入，docs/06 第 29 节）：GET /api/admin/config/export（导出筛选维度与广告，
    带 HMAC 签名）、POST /api/admin/config/import（导入覆盖，8 MiB 上限）、GET /api/admin/config/backups[/{id}]
    （备份存档列表与取回）、POST /api/admin/config/backups/{id}/restore（从存档回滚）。
    权限点 config.view / config.edit（后者为高敏）；新增环境变量 CONFIG_BACKUP_KEYS（备份签名密钥，留空则不签不验）；
    新增表 config_backup（迁移 00022）。
    写入策略：筛选维度按 slug 合并更新、备份里没有的保留不删（taxonomy_term 被 drama_term 以 ON DELETE CASCADE 引用，
    删取值会静默清掉剧集的维度归属），保留项在 kept_names 里返回；广告整表替换、曝光点击计数归零。
    导入与回滚前都会自动存一份当前配置的存档。从存档回滚不验签（数据没离开过系统），下载后再上传仍然验签。
    0.33.0（新增，S3-2 / A3-2 静态页，docs/specs/A3-1.md，迁移 00024）：后台静态页 GET/POST /api/admin/pages、
    PATCH/DELETE /api/admin/pages/{id}（权限点 pages.view / pages.edit）：标题、slug、正文（rich 富文本或 html，两种格式都按
    白名单清洗后入库，与广告的自定义 HTML 同一策略）、SEO 标题与简介、是否页脚页、草稿 / 已发布。slug 全站唯一（重复 409）。
    前台 GET /api/v1/pages/{slug}：已发布的静态页正文（草稿与不存在都是 404），ETag + 共享缓存 300 秒。
