    POST /api/admin/resource-warm/start（开一轮）、POST /api/admin/resource-warm/stop（停止）、
    GET /api/admin/resource-warm/progress（进度，带 ?stream=1 时走 SSE）、GET /api/admin/resource-warm/history（最近 20 轮）。
    权限点 resource_warm.view / resource_warm.edit。
    **预热拉的是播放器真正会请求的那些地址**：worker 里复用播放链路（play.HLSService.Playlist）、自签一个
    TrialSec=0、不绑设备的播放令牌，拿到的清单与观众拿到的是同一套签名地址。自己拼地址一旦签名方式或路径有偏差，
    边缘缓存的就是另一个 key，预热白做。自签令牌仍过同一个密钥环校验（不是绕过）：产物不可播时预热也会如实失败。
    用 pg.WarmPlayRepo 而不是 PlayRepo —— 它放宽了「剧必须已上架」，让运营能提前热明天要上的剧；
    选源那条路径仍严格按前台可见性来，没上架的剧观众播不到。
    两层缓存被热到的东西不一样：**切片**走边缘长缓存（public, max-age=31536000, immutable、地址按内容哈希，
    docs/08 第 46 行），这是预热的正主；**清单**是加密接口、Cache-Control private, no-store，不进边缘缓存，
    预热它热的是服务端 Valkey 里的清单原文读穿缓存（xsite:play:manifest:），省掉回源读清单那一跳。
    页面上用 note 字段把这件事说清楚，免得运营误以为清单也进了 CDN。
    模式 playlist_only（只拉清单，流量极小）/ with_segments（连每档前 N 片一起拉，N 默认 3 ≈ 6 秒起播）；
    并发集数 1–16（默认 4）、片数 1–20。init 段不占片数（它是每档必须的一个小文件）。
    同一时间仅一轮（docs/02 第 4.4 节）：靠 resource_warm_job 上的部分唯一索引
    `((status = 'running')) WHERE status = 'running'` 保证，不靠应用层检查（多实例下那是会漏的），冲突返回 409。
    没有用 River 的 UniqueOpts —— 库内部分唯一索引与 transcode_job_active_key（00007）是同一个套路，项目里已有先例。
    进度存在库里而不是 Valkey（docs/03 第 9.5 节原写的是 Valkey）：运营要能关掉页面回来继续看，库表天然持久；
    更新频率是每集一次而不是每片一次，不构成高频写。进度写入兼心跳，心跳停 5 分钟判定为 interrupted
    （worker 崩了之后没人改状态，一直挂在 running 会挡住下一轮；开始与看进度时都会顺手清一遍）。
    停止只设 stop_requested 列的信号，worker 处理完手上这一集就收尾、已经热好的算数；用列而不是 Valkey 通道，
    worker 重启后信号还在。ctx 被取消（worker 被掐断）时记 interrupted 而不是 done —— 整轮没跑完，
    记成已完成是在骗人。拿不到的地址写进**资源体检**的结果表（S4-5 前半），运营在那边逐条排查：
    对运营来说「这个地址拿不到」就是一件事，不该因为是预热发现的还是体检发现的就跑两个页面。
