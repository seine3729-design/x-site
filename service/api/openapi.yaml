    POST /api/admin/domain-certificates（标准库签出 EC/RSA，私钥仅返回一次、不落库，用于源站 mTLS / 本地 HTTPS / 应急占位）、
    解析预览 /inspect、上传回填到期日 POST /api/admin/domains/{id}/certificate；公网入口证书仍由部署层 certbot 自动签发。
    签名清单 /api/admin/domain-releases（历史 + current）、/preview（按域名池或历史版本生成待签正文，v = 下一个版本号）、
    发布（上传离线签名的 payload + signature 并校验版本号，后台不保存签名私钥）。健康看板 GET /api/admin/domain-health
    （按域名 + 地区聚合，上报源接入前为空）。安全中心（只读，security.view）：GET /api/admin/security/login-logs
    （登录记录，失败类标 suspicious）、/key-rotations（各密钥当前版本 kid，不含密钥内容）、/risk（风控概览，计数源待接入）。

    0.70.0（新增，A1-2 剩余的后台试播，docs/06 第 37 节，无迁移）：`POST /api/admin/episodes/{id}/preview`
    签发分集试播地址，配套 `GET /api/admin/preview/{token}/{file}`（清单）与
    `GET /api/admin/preview/key/{episode_id}/{key_ver}`（内容密钥）。三条都走后台会话、**不加密**，
    权限点沿用 `dramas.view`。清单改写、线路签名与内容密钥与前台 `/api/v1/hls/*` 复用同一条链路，
    刻意不同的是：不判观看权限、不按 `trial_sec` 裁剪、允许未上架的剧；预览令牌由 `PLAY_TOKEN_KEYS`
    按另一个用途派生，与前台播放令牌互不通用（没有新增环境变量）。前台接口形状不变。

    0.71.0（新增，S3-15 / A3-5，迁移 00050）：后台会员套餐配置。新增
    `GET /api/admin/vip/plans` 与 `PATCH /api/admin/vip/plans/{id}`，权限点为 `vip_plans.view/edit`。
    套餐 code 固定，后台只能保存时长、双币种整数价格、划线价、角标键、推荐、客户端、允许渠道、排序与上下架；
    保存成功写审计并失效所有客户端的套餐读缓存。支付渠道凭据、订单和模拟/真实到账均未在本版本开放。

    0.72.0（新增，S3-11 development 模拟订单）：新增加密且仅注册用户可用的订单创建、查询、取消与我的订单接口。
    development 环境额外注册 `mock-complete`，它走真实订单状态机、会员到期叠加和会员流水事务，但不调用第三方、
    不读取凭据、不写支付回调原文；production 不注册该路径且拒绝创建无真实适配器的订单。

    0.73.0（新增，S4-1 埋点采集，docs/03 第 8.1 节，迁移 00051）：POST /api/v1/events 批量上报埋点（≤ 50 条/次，
    Web 用 sendBeacon、APP 用本地队列）。服务端打 occurred_at 时间戳后 COPY 进 event_raw（按天 RANGE 分区）；
    未知事件类型与序列化后 > 4KB 的 props 单条静默丢弃，超过每设备每分钟配额整体静默丢弃，始终返回 204、不回传数据。
    走 /api/v1 报文加密（dev 可明文）。汇总（metric_*）、看板与剧集分析接口随 S4-2 / S4-3。
servers:
  - url: http://localhost:8080
    description: 本地开发（./dev.sh up）

paths:
  /api/v1/health:
    get:
      summary: 存活检查（明文，不加密）
      tags: [system]
      responses:
        "200":
          description: 进程可处理请求
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok, env]
                        properties:
                          ok: { type: boolean }
                          env: { type: string, enum: [development, test, production] }

  /api/v1/crypto/keys:
    get:
      summary: 报文加密公钥（明文，可缓存）
      description: |
        第一把为当前密钥，其余为轮换过渡期仍可用的旧密钥。客户端遇到 ENC_KEY_UNKNOWN 时重新获取；
        正式版 APP 使用构建期预置的公钥（--dart-define=API_ENC_KEYS），不依赖这个接口。
      tags: [system]
      responses:
        "200":
          description: 公钥列表
          headers:
            Cache-Control: { schema: { type: string }, description: "public, max-age=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [current, keys]
                        properties:
                          current: { type: string, example: k1 }
                          keys:
                            type: array
                            items: { $ref: "#/components/schemas/ApiEncPublicKey" }

  /api/v1/site-config:
    get:
      summary: 站点配置（白标、主题、布局、SEO、年龄门、功能开关、防丢地址）
      description: |
        支持 ETag 条件请求；版本不变时返回 304（加密请求同样适用，304 无响应体）。
        加密响应一律 Cache-Control: no-store；SSR 阶段 BFF 明文直连时可短缓存。
      tags: [platform]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string }, description: '形如 W/"site-<version>-<内容哈希>"；菜单的链接目标被别的模块改掉时版本不变但内容会变' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SiteConfig" }
        "304":
          description: 未变化
        "400": { $ref: "#/components/responses/EncError" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/dramas/{id}:
    get:
      summary: 剧详情（资料 + 分集 + 相关推荐）
      description: |
        只返回前台可见的剧（已上架且定时已到点、不在回收站），否则 404 NOT_FOUND「内容不存在或已下架」。
        分集返回全部，未转封装的分集 playable=false（前台显示「敬请期待」）；播放地址在 /api/v1/episodes/{id}/sources（S1-7）。
        缓存 120 秒，带 ETag；加密响应一律 no-store，s-maxage 只对 BFF 明文直连生效。
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PathID"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string }, description: 载荷摘要，内容不变时可用于条件请求 }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=120, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DramaDetail" }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/channels/{slug}:
    get:
      summary: 频道（维度取值落地页，页码分页）
      description: |
        频道是 is_channel=true 且启用的维度取值，slug 全站唯一；不存在或已停用时 404。
        前台只有频道页用页码分页（docs/07 第 0.1 节），要显示「共 N 部」并可跳页；page 上限 100，超出返回空列表。
        随机排序不适用于页码分页，sort 只接受 latest / hot / recommend。缓存 60 秒。
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PathSlug"
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [latest, hot, recommend], default: latest }
        - $ref: "#/components/parameters/PublicPage"
        - $ref: "#/components/parameters/PublicPageSize"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=60, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChannelPage" }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/tags/{slug}:
    get:
      summary: 标签聚合列表（游标分页）
      description: |
        标签已被合并时跟随到目标标签，响应里的 tag.canonical_slug 为目标标签的 slug（前台据此做规范链接）；
        标签不存在或 status=hidden 时 404。敏感标签（tag.is_sensitive=true）需要过年龄门并输出 noindex，
        也不会出现在探索分面里。缓存 60 秒。
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PathSlug"
        - $ref: "#/components/parameters/PublicSort"
        - $ref: "#/components/parameters/PublicCursor"
        - $ref: "#/components/parameters/PublicLimit"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=60, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TagPage" }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/explore:
    get:
      summary: 探索（分面筛选 + 排序 + 游标分页）
      description: |
        筛选条件写在查询串里（可分享、可缓存）。多个筛选项为「与」：terms 里的每个取值都要满足，
        再与 tag、finished、window 同时成立。facets（筛选条）只在第一页（没有 cursor）返回，无限滚动的后续页不再下发；
        页面上的「查看 N 部」用 total。缓存 30 秒（按校验后的参数生成键，与查询串的书写顺序无关）。
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: terms
          in: query
          required: false
          description: |
            取值筛选，形如 `<维度slug>:<取值slug>`，逗号分隔，最多 8 项，全部满足才命中。
            取值 slug 只在维度内唯一，所以必须带维度前缀。格式不对或项数超限返回 400；
            指向不存在或已停用的取值时结果为空列表。
          schema: { type: string, maxLength: 300, example: "genre:romance,region:cn" }
        - name: tag
          in: query
          required: false
          description: 标签 slug；敏感标签也可以传（结果照常返回，前台需过年龄门）
          schema: { type: string, maxLength: 64 }
        - name: finished
          in: query
          required: false
          description: 完结状态；不传为不限
          schema: { type: boolean }
        - $ref: "#/components/parameters/PublicWindow"
        - $ref: "#/components/parameters/PublicSort"
        - $ref: "#/components/parameters/PublicCursor"
        - $ref: "#/components/parameters/PublicLimit"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=30, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ExplorePage" }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/topics:
    get:
      summary: 专题列表（游标分页）
      description: |
        只含已发布且「列在专题列表页」（list_in_index）的专题，按编号倒序。未收录的专题仍可按 slug 直接打开。缓存 300 秒。
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PublicCursor"
        - $ref: "#/components/parameters/PublicLimit"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=300, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TopicListPage" }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/topics/{slug}:
    get:
      summary: 专题详情（剧列表 + FAQ）
      description: |
        未发布的专题 404。手选专题按后台保存的顺序返回（最多 200 部），自动专题按 rule_json 执行：
        同时满足全部取值编号与标签的可见剧，按规则的排序取前 limit 部（1–60，默认最新 / 不限 / 24）；
        规则引用的取值编号或标签已删除时结果为空列表，不报错。FAQ 为纯文本，前台输出 FAQPage 结构化数据。缓存 300 秒。
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PathSlug"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=300, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TopicDetail" }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 用户端选线（S1-6d，docs/12 第 4.4、6.2 节）----------

  /api/v1/lines:
    get:
      summary: 当前地区的线路列表（线路菜单与测速用）
      description: |
        按客户端地区返回该类型可用的候选线路，**不含对象地址与签名**（播放地址在 /api/v1/episodes/{id}/sources，S1-6e/S1-7）。
        地区由客户端 IP 经 GeoIP 解析：GeoIP 数据未接入前解析为未知地区 XX，此时只匹配全局兜底线路；
        development 环境可用 X-Debug-Geo 模拟地区。排序复用后台同一套打分（匹配精度 + 加分 + 优先级 + 健康分 − 观察惩罚），
        同分按 weight 加权随机打散，种子取 X-Device-Id 与当前 10 分钟片，因此同设备在 10 分钟内结果稳定。
        返回条数为后台设置的候选数量（storage_settings.candidate_count，1–5，默认 3）；停用与被地区规则排除的线路不返回。
        客户端按 ttl（秒）缓存结果，并对 probe_url 发 Range 请求测速（docs/12 第 6.1 节）。
      tags: [lines]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - { name: kind, in: query, required: true, schema: { type: string, enum: [video, image] }, description: 线路类型 }
        - name: X-Device-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: 客户端自生成的设备标识，用作同分加权随机的种子；缺失时退化为按线路编号的确定性排序
        - name: X-Debug-Geo
          in: header
          required: false
          schema: { type: string }
          description: "仅 development 生效：模拟地区，形如 CN/广东/电信（省份与运营商可省略）"
      responses:
        "200": { $ref: "#/components/responses/LineListResult" }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/lines/report:
    post:
      summary: 客户端上报线路质量（批量）
      description: |
        客户端批量上报测速、首帧、卡顿、失败与切换事件。服务端按「线路 × 国家 × 运营商」聚合到 Valkey 的分钟桶
        （15 分钟滑动窗口），供健康分计算使用（设计上客户端上报占 60%、服务端探测占 40%；融合进健康分是后续增量）。
        按设备限流：每设备（X-Device-Id，缺失时退化为客户端 IP）每分钟最多 30 条，**超出的部分静默丢弃而不报错**，
        响应的 accepted 为实际接受的条数；单次请求最多处理 100 条。line_id 非法或 event 未知的条目被跳过，也不计入 accepted。
        隐私：只聚合解析后的国家与运营商，不记录完整 IP、不入库（docs/12 第 4.2 节）。
      tags: [lines]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: X-Device-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: 限流维度；缺失时按客户端 IP 限流
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineReportRequest" }
      responses:
        "200": { $ref: "#/components/responses/LineReportResult" }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/episodes/{id}/sources:
    get:
      summary: 选源：观看权限判定 + 候选视频线路与清单地址
      description: |
        公开接口（游客可调用）。按顺序判定（docs/03 第 4.1 节、docs/specs/S1-7.md）：
        1. 分集可播放：剧前台可见（不在回收站、已上架、定时已到点）且分集已转封装，否则 404 NOT_FOUND。
        2. 观看权限：free 完整播放；login 已登录完整播放，游客有 trial_sec 时试看、否则 401 NEED_LOGIN；
           vip 会员完整播放，非会员（游客一律视为非会员）有 trial_sec 时试看、否则 402 NEED_VIP。
           S1-10 / S2-1 / S3-10 接入登录与会员前，所有观看者都是游客。
        3. 候选线路：该集产物有就绪副本的存储源上的视频线路（S1-6f；还没有就绪副本的老产物不按副本过滤），
           与 GET /api/v1/lines（kind=video）同一套打分与加权随机，取前 N 条（存储设置的候选数量）。
           line_id 为手选线路：在候选中（含超出 N 条的）且健康分 ≥ 30 时放到第一位并标 manual，否则忽略。
           没有可用视频线路时 503 UNAVAILABLE。

        每条线路的 url 是同源加密接口 /api/v1/hls/{令牌}/index.m3u8（S1-8），令牌 10 分钟有效（expires_at），绑定分集、线路、
        设备哈希（X-Device-Id）与试看秒数；客户端在过期前 60 秒重新选源。按设备（没有 X-Device-Id 时按 IP）每分钟 60 次。
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PathID"
        - name: line_id
          in: query
          required: false
          description: 用户手选的线路（本机记录的 line_pref）；不在候选中或不健康时忽略
          schema: { type: integer, format: int64, minimum: 1 }
        - name: X-Device-Id
          in: header
          required: false
          description: 设备标识：令牌绑定它的哈希，也是限流维度与同分加权随机的种子。1–64 位字母、数字、- 或 _，格式不对时 400
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        - name: X-Debug-Geo
          in: header
          required: false
          schema: { type: string }
          description: "仅 development 生效：模拟地区，形如 CN/广东/电信（省份与运营商可省略）"
      responses:
        "200":
          description: 可以播放（完整或试看）
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store（加密响应同样 no-store）" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PlaybackSources" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/hls/{token}/{file}:
    get:
      summary: 播放清单（主清单与各档清单）
      description: |
        选源返回的 url 指向本接口的 index.m3u8（docs/03 第 4.2 节、docs/specs/S1-8.md）。播放器经加密客户端获取
        （docs/10 第 5.3 节）：明文请求一律 400 ENC_REQUIRED，不受 API_ENCRYPTION_REQUIRED 影响，SSR 内网直连也不放行。
        - index.m3u8：主清单。各档清单是相对地址 v{短边}.m3u8，按本地址解析后同样经本接口获取。
        - v{短边}.m3u8：该档的媒体清单，只能取主清单中列出的档位（其他文件名 404）。新上传是 H.264 + AAC-LC 的
          MPEG-TS HLS，包含固定 4 秒的 `.ts` 切片（360p/480p/720p）；历史 fMP4 的 `EXT-X-MAP` 和 `.m4s` 继续支持。
          所有需访问的对象按线路的签名方式改写为 CDN / 存储源地址（有效期为线路的 token_ttl），播放器直接获取、
          不经过本服务；每个切片前的 EXT-X-KEY（METHOD=AES-128，IV 写在清单里）指向
          /api/v1/hls/key/{episode_id}/{key_ver}?t={token}。试看令牌只返回结束时间不超过试看秒数的切片（至少一个），
          以 EXT-X-ENDLIST 结尾，后面的切片地址不出现在清单里。

        令牌校验：过期 401 TOKEN_EXPIRED；格式错误、签名不对或不是签给本设备（X-Device-Id）的 403 FORBIDDEN，不区分原因。
        客户端对这两类错误都重新选源（不走登录态刷新）。每次请求都重新确认分集仍可播放（剧下架、分集无产物时 404）；
        观看权限以令牌为准，不重新判定。线路已停用、不是视频线路，或该集产物不在这条线路的存储源上时 503 UNAVAILABLE，
        播放器换下一条线路；读不到产物清单时同样 503。
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: token
          in: path
          required: true
          description: 播放令牌（选源返回的 url 中的一段），不透明，不要解析或拼接
          schema: { type: string, maxLength: 512 }
        - name: file
          in: path
          required: true
          description: index.m3u8（主清单）或主清单中列出的一档 v{短边}.m3u8
          schema: { type: string, pattern: '^(index|v[0-9]{1,5})\.m3u8$', example: index.m3u8 }
        - name: X-Device-Id
          in: header
          required: false
          description: 与选源时相同的设备标识；令牌绑定了它的哈希，不一致时 403。格式不对时 400
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        "200":
          description: HLS 清单（RFC 8216）。加密请求的响应体为密文，原始类型 application/vnd.apple.mpegurl 放在 X-Enc-Type
          headers:
            Cache-Control: { schema: { type: string }, description: "no-store（含签名与令牌，任何缓存都不能复用）" }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
              examples:
                master:
                  summary: index.m3u8
                  value: |
                    #EXTM3U
                    #EXT-X-VERSION:4
                    #EXT-X-STREAM-INF:BANDWIDTH=520000,AVERAGE-BANDWIDTH=410000,CODECS="avc1.64001e,mp4a.40.2",RESOLUTION=360x640
                    v360.m3u8
                media:
                  summary: v360.m3u8（MPEG-TS，hmac_token 线路）
                  value: |
                    #EXTM3U
                    #EXT-X-VERSION:4
                    #EXT-X-TARGETDURATION:4
                    #EXT-X-MEDIA-SEQUENCE:0
                    #EXT-X-PLAYLIST-TYPE:VOD
                    #EXT-X-KEY:METHOD=AES-128,URI="/api/v1/hls/key/42/3?t=k1.eyJl….Q2xh…",IV=0x00000000000000000000000000000001
                    #EXTINF:4.000000,
                    https://cdn.example.com/hls/42/j1/s/9b1c….ts?p=%2Fhls%2F42%2Fj1%2Fs%2F&exp=1793000000&s=…
                    #EXT-X-ENDLIST
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/hls/key/{episode_id}/{key_ver}:
    get:
      summary: 内容密钥（AES-128）
      description: |
        各档清单 EXT-X-KEY 的地址（docs/03 第 4.2 节、docs/specs/S1-8.md），播放器经加密客户端获取，明文请求一律 400 ENC_REQUIRED。
        令牌校验与清单接口相同（过期 401 TOKEN_EXPIRED，其余 403 FORBIDDEN），令牌里的分集必须与路径一致，否则 403。
        key_ver 可以是该集任何仍在库里的密钥版本（重新转封装前取到的旧清单仍可播放），没有时 404。
        限流：每设备（没有 X-Device-Id 时按 IP，IPv6 按 /64）每集每分钟 20 次，超出 429 + Retry-After；
        播放器同一个密钥地址只取一次，正常播放远低于这个数。
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: episode_id
          in: path
          required: true
          description: 分集 ID；不是正整数时 404
          schema: { type: integer, format: int64, minimum: 1 }
        - name: key_ver
          in: path
          required: true
          description: 密钥版本（清单里的地址自带）；不是正整数时 404
          schema: { type: integer, format: int32, minimum: 1 }
        - name: t
          in: query
          required: true
          description: 播放令牌（与清单地址中的相同）
          schema: { type: string, maxLength: 512 }
        - name: X-Device-Id
          in: header
          required: false
          description: 与选源时相同的设备标识；令牌绑定了它的哈希，不一致时 403。也是限流维度
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        "200":
          description: 16 字节内容密钥原文。加密请求的响应体为密文，原始类型 application/octet-stream 放在 X-Enc-Type
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/octet-stream:
              schema: { type: string, format: binary, minLength: 16, maxLength: 16 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 用户端身份（S1-10，docs/03 第 2 节、docs/10 第 4 节）----------

  /api/v1/auth/guest:
    post:
      summary: 游客身份签发（Access / Refresh 令牌）
      description: |
        首次进入 Web / APP 时领取游客身份（docs/03 第 2.1 节、docs/10 第 4 节）。新建游客设备与一个会话族并返回：
        - access_token：无状态 JWT（JWS 紧凑格式，EdDSA / Ed25519 签名，头部带 kid），载荷 sub=游客设备 ID、sid=会话 ID、
          role=guest、iat、exp；有效期 expires_in 秒（15 分钟）。校验只验签不查库，固定只接受 alg=EdDSA（拒绝 none 与算法混淆）。
        - refresh_token：256 bit 随机串，服务端只存 SHA-256；游客有效期 180 天，每次刷新轮换（见 /api/v1/auth/refresh）。
        - device_id：游客设备 ID（UUIDv7），客户端据此作为后续请求的设备标识。
        请求体可空；platform 不在枚举内时按 web。按客户端 IP 前缀（IPv4 /24、IPv6 /48）每分钟 30 次，超出 429 + Retry-After。
        注册用户登录（S2-1）复用同一套令牌结构，role 届时为 user、sub 为 user_id。
        响应 Cache-Control: private, no-store（含令牌，任何缓存都不能复用）。
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/XEnc"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestAuthRequest" }
      responses:
        "200":
          description: 已签发游客身份
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store（加密响应同样 no-store）" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/EncError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/auth/register:
    post:
      summary: 注册用户
      description: |
        用户名 + 密码注册（docs/03 第 2.2 节，S2-1）。用户名 3–32 位小写字母 / 数字 / 下划线（大小写不敏感、库中存小写），
        密码 8–128 位且不在常见弱口令表、非纯数字、不等于用户名。不收集邮箱 / 手机号，**不提供找回密码**（adr/0001），
        因此必须带 ack_no_recovery=true 表示已知悉，否则 400。用户名已占用返回 409 CONFLICT。
        成功即登录，返回用户概要与令牌（结构同登录；注册用户 role=user、Refresh 30 天滑动）。按客户端 IP 前缀每分钟 10 次。
        响应 Cache-Control: private, no-store。
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/XEnc"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: 注册成功并签发令牌
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthAccount" }
        "400": { $ref: "#/components/responses/EncError" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      summary: 登录
      description: |
        用户名 + 密码登录（docs/03 第 2.2 节，S2-1）。用户名不存在与密码错误返回相同的 401 NEED_LOGIN 且耗时相近（防枚举）；
        账号被封禁返回 403 FORBIDDEN。成功返回用户概要与令牌（role=user、Refresh 30 天滑动）。
        登录失败计数与人机验证挑战随 S2-2。响应 Cache-Control: private, no-store。
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/XEnc"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功并签发令牌
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthAccount" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/auth/challenge:
    get:
      summary: 获取人机验证挑战
      description: |
        登录失败过多（docs/03 第 2.2 节：同一用户名 / IP 连续失败到阈值）后，登录会返回 428 CHALLENGE_REQUIRED；
        客户端调本接口取一个挑战，本地求解后在下次登录请求里带上 challenge 再试。挑战是自建工作量证明（PoW）：
        求一个 solution 使 SHA-256(nonce + ":" + solution) 的二进制前 difficulty 个 bit 为 0（algorithm 字段标明算法）。
        nonce 一次性、有效期 expires_in 秒。未触发挑战时也可调用（无副作用）。响应 Cache-Control: private, no-store。
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/XEnc"
      responses:
        "200":
          description: 一个待求解的挑战
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthChallenge" }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      summary: 刷新令牌（轮换 Refresh Token）
      description: |
        用 refresh_token 换一对新的 access_token / refresh_token（docs/03 第 2.2 节、docs/02 第 5.1.1 节）。
        每次刷新轮换：新建会话行、吊销旧行并保持同一会话族；若旧 refresh_token 再次被使用（命中已吊销的行），
        判定为令牌泄露，**吊销整个会话族**——此后该族所有令牌（含刚轮换出的新令牌）都失效。
        令牌不存在、已过期、复用一律返回 401 TOKEN_EXPIRED，不区分原因（不向持有者泄露是否为复用）；
        客户端据此重新登录 / 领取游客身份。响应 Cache-Control: private, no-store。
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/XEnc"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 已轮换，返回新的一对令牌
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store（加密响应同样 no-store）" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      summary: 登出（吊销当前会话族）
      description: |
        吊销 refresh_token 所在的会话族（docs/03 第 2.2 节）。幂等：令牌缺失或已失效同样返回 204。
        登出只影响该会话族，不影响同一用户 / 设备的其他会话族（其他设备不下线）。响应 Cache-Control: private, no-store。
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/XEnc"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: 已登出（幂等；令牌缺失或已失效也返回此码） }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- development 模拟订单（S3-11）：所有常规订单接口均需注册用户；模拟完成仅开发环境注册 ----------
  /api/v1/pay/orders:
    post:
      summary: 创建会员订单
      description: |
        仅注册用户。请求带 Idempotency-Key；同一用户同一键返回原订单。订单快照在事务中锁定套餐/渠道后写入，
        每人最多三笔未过期 pending 订单。当前没有真实渠道适配器：仅 development 模拟模式可成功创建，production 返回 503 UNAVAILABLE。
      tags: [payment]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayOrderRequest" }
      responses:
        "200":
          description: 已创建或命中幂等订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order: { $ref: "#/components/schemas/PayOrder" }
                          pay_action: { $ref: "#/components/schemas/MockPayAction" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/pay/orders/{order_no}:
    get:
      summary: 查询我的订单
      description: |
        仅能读取当前注册用户自己的订单。响应 Cache-Control: private, no-store。
      tags: [payment]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: order_no
          in: path
          required: true
          schema: { type: string, minLength: 20, maxLength: 64 }
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PayOrder" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/pay/orders/{order_no}/cancel:
    post:
      summary: 取消待支付订单
      description: 仅能关闭当前用户尚未过期的 pending 订单；已关闭或已支付返回 409。
      tags: [payment]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: order_no
          in: path
          required: true
          schema: { type: string, minLength: 20, maxLength: 64 }
      responses:
        "200":
          description: 已关闭的订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PayOrder" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/pay/orders/{order_no}/mock-complete:
    post:
      summary: 完成 development 模拟支付
      description: |
        仅 development 注册；production 返回 404。模拟完成不调用支付渠道、不能携带金额或交易号，
        但会走真实订单状态机、会员到期叠加与流水事务。仅用于本地开发验收，不能用于生产收款。
      tags: [payment]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: order_no
          in: path
          required: true
          schema: { type: string, minLength: 20, maxLength: 64 }
      responses:
        "200":
          description: 已完成模拟支付的订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PayOrder" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/me/orders:
    get:
      summary: 我的订单列表
      description: |
        仅注册用户，按内部订单编号倒序游标分页。响应 Cache-Control: private, no-store。
      tags: [me, payment]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: 订单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list, next_cursor]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/PayOrder" } }
                          next_cursor: { type: string }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }

  # ---------- 会员核心（S3-10，docs/03 第 12.1 节）：套餐公开读；会员状态仅注册用户可读 ----------

  /api/v1/vip/plans:
    get:
      summary: 当前客户端可购买的会员套餐
      description: |
        返回已上架且允许当前客户端购买的会员套餐，按 sort、id 升序。名称由客户端按 code 映射多语言文案；金额均为整数最小单位。
        S3-10 采用策略 A：当前仅按套餐 clients 过滤，地区与 payment_channel 的实时开关在 S3-11 / S3-15 接入后再做交集。
        X-Platform 为 web 时按 User-Agent 区分 web_pc 与 web_mobile；ios / android 当前映射 app_official；商店包可显式传 app_store。
        服务端套餐缓存 60 秒；加密响应仍为 Cache-Control: private, no-store。
      tags: [vip]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: X-Platform
          in: header
          required: false
          description: 当前端平台或分发渠道；不传时按 User-Agent 推断 Web 桌面或手机
          schema: { type: string, enum: [web, ios, android, web_pc, web_mobile, app_official, app_store] }
      responses:
        "200":
          description: 套餐列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [client, plans, mock_enabled]
                        properties:
                          client: { type: string, enum: [web_pc, web_mobile, app_official, app_store] }
                          plans: { type: array, items: { $ref: "#/components/schemas/VIPPlan" } }
                          mock_enabled: { type: boolean, description: 仅 development 为 true；production 不注册模拟支付完成路径 }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/vip:
    get:
      summary: 我的会员状态
      description: |
        返回当前注册用户是否仍在会员有效期内及实际到期时间；从未开通过会员时 expire_at 为 null。
        游客与未登录返回 401 NEED_LOGIN。响应 Cache-Control: private, no-store。
      tags: [me, vip]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: 当前会员状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VIPStatus" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 「我的」（S2-1，docs/03 第 2 节）：注册用户专属，经身份中间件要求 role=user ----------

  /api/v1/me/password:
    post:
      summary: 修改密码
      description: |
        用当前密码改密（docs/03 第 2.2 节，S2-1）。仅注册用户（身份中间件校验 Authorization: Bearer 的 Access Token，role=user）；
        游客与未登录 401。新密码规则同注册。成功后**吊销该用户全部会话**（含当前）：Refresh 令牌立即作废、客户端需重新登录，
        已签发的 Access Token 无状态、最多再活 15 分钟。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: 改密成功，全部会话已吊销 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/sessions:
    get:
      summary: 我的设备（会话）列表
      description: |
        列出当前注册用户所有未吊销且未过期的会话，按最近活跃倒序，标出当前会话 current（docs/03 第 2.2 节，S2-1）。
        只含摘要（平台、UA 摘要、IP 前缀、时间），不含令牌。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sessions]
                        properties:
                          sessions: { type: array, items: { $ref: "#/components/schemas/MeSession" } }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/sessions/{id}:
    delete:
      summary: 下线设备（吊销会话）
      description: |
        吊销当前用户名下的指定会话（docs/03 第 2.2 节，S2-1）。会话 ID 来自我的设备列表；不存在或不属于本人返回 404
        （带 user_id 作用域，防越权）。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: id
          in: path
          required: true
          description: 会话 ID（UUID）；格式不对或不属于本人时 404
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 已下线 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/state:
    get:
      summary: 登录态 + 身份 + 未读数
      description: |
        SPA / APP 加载时的轻量端点（docs/07 第 2 节，S2-3）：返回当前注册用户的身份（id、昵称、头像）与未读消息数。
        仅注册用户；游客与未登录 401，客户端据此判定为未登录。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: 当前登录态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MeState" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/profile:
    get:
      summary: 读取我的资料
      description: |
        返回可编辑资料：头像、昵称、简介及各自审核状态（docs/13 第 2.5 节，S2-3）。仅注册用户；游客与未登录 401。
        响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: 我的资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MeProfile" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      summary: 修改我的资料
      description: |
        改头像 / 昵称 / 简介（docs/13 第 2.5 节，S2-3）；只改请求体中出现的字段（PATCH 语义，缺省不动，传空串表示清空）。
        S2-3 只做基本校验：去控制字符、折叠空白、昵称 ≤ 40 字、简介 ≤ 80 字且最多 2 个换行、头像引用 ≤ 500 字。
        昵称保留词、30 天改名频率、简介屏蔽词与引流识别、资料审核队列（NICKNAME_LIMITED / CONTENT_REJECTED）归 S2-9。
        返回更新后的完整资料。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatchRequest" }
      responses:
        "200":
          description: 修改后的资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MeProfile" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/history:
    get:
      summary: 观看历史（续播列表）
      description: |
        最近观看在前（docs/13 第 2.2 节，S2-3），每项含剧卡片字段与续播断点。只存注册用户；回收站中的剧不展示。
        上限 500 条（超出由清理任务淘汰）。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: 续播列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/HistoryItem" } }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 续播断点上报（支持批量）
      description: |
        客户端每 15 秒 / 暂停 / 切集时上报续播断点（docs/03 第 6 节，S2-3），支持批量。服务端先写 Valkey 合并缓冲
        （同一剧的重复上报覆盖为最新），worker 每分钟批量 UPSERT 落库。开了「暂停记录」的用户静默忽略（返回 204）。
        单次最多 100 条，非法条目（剧 / 分集 ID ≤ 0 或进度 < 0）跳过不报错。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoryReportRequest" }
      responses:
        "204": { description: 已接收（暂停记录时也 204） }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除或清空观看历史
      description: |
        删除指定剧的历史（?drama_ids=1,2,3）或清空全部（?all=1）（docs/13 第 2.2 节，S2-3）。
        同步清掉 Valkey 里尚未落库的断点，避免又被 worker 落库重现。两个参数都没给时 400。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: drama_ids
          in: query
          required: false
          description: 逗号分隔的剧 ID；与 all 二选一
          schema: { type: string, example: "1,2,3" }
        - name: all
          in: query
          required: false
          description: all=1 清空全部观看历史
          schema: { type: string, enum: ["1"] }
      responses:
        "204": { description: 已删除 / 已清空 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/follow:
    post:
      summary: 收藏（追剧）
      description: |
        收藏一部剧（docs/13 第 2.3 节，S2-3），幂等（已收藏再调也 204）。收藏即追剧，上新集时发站内信 / 推送（来源后续接入）。
        剧不存在时外键失败映射为 400。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowRequest" }
      responses:
        "204": { description: 已收藏 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 取消收藏
      description: |
        取消收藏指定剧（docs/13 第 2.3 节，S2-3），幂等（未收藏也 204）。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: drama_id
          in: query
          required: true
          description: 要取消收藏的剧 ID
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: 已取消收藏 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/follows:
    get:
      summary: 追剧列表
      description: |
        我收藏（追剧）的剧（docs/13 第 2.3 节，W2-5），最近收藏在前。每项是剧卡片字段外加
        `watched_episode`（这个用户看到第几集，没看过为 0；前台据此显示「还有 N 集未看」）与 `followed_at`。
        可见性与前台列表一致：未发布、未到发布时间、回收站中的剧不返回。上限 500 条、不分页。
        响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "200":
          description: 追剧列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/FollowItem" } }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/me/like:
    post:
      summary: 点赞（剧 / 分集）
      description: |
        点赞剧或分集（docs/13 第 2.4 节，S2-3），幂等。target_type 为 drama 或 episode。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LikeRequest" }
      responses:
        "204": { description: 已点赞 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 取消点赞
      description: |
        取消点赞指定对象（docs/13 第 2.4 节，S2-3），幂等。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: type
          in: query
          required: true
          description: 点赞对象类型
          schema: { type: string, enum: [drama, episode] }
        - name: id
          in: query
          required: true
          description: 点赞对象 ID
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: 已取消点赞 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/me/notifications:
    get:
      summary: 消息列表
      description: |
        站内信列表（docs/13 第 2 节，S2-3），倒序游标分页。来源 reply（评论被回复）/ like（被点赞）/ update（追更）由后续里程碑产出，
        S2-3 只提供读端点。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - name: before
          in: query
          required: false
          description: 游标：取 id 比它更小（更旧）的；缺省或 0 从最新开始
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          description: 单页条数，1–50，缺省 50
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 全部标记已读
      description: |
        把当前用户的未读消息全部标记为已读（docs/13 第 2 节，S2-3）。无请求体。响应 Cache-Control: private, no-store。
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      responses:
        "204": { description: 已全部标记已读 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/episodes/{id}/comments:
    get:
      summary: 评论列表（游标分页）
      description: |
        某集的评论，只含显示中、未删的（docs/03 第 5.1 节，S2-5）。sort=latest（默认，按时间倒序）或 hot（按点赞数倒序）。
        公开读，无需登录。cursor 为上一页返回的 next_cursor；limit 1–50（缺省 50）。游客评论的作者展示「游客」，不暴露用户名。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - { name: id, in: path, required: true, description: 分集 ID, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, hot] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: 评论列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 发表评论（注册用户或游客）
      description: |
        发表一条评论（docs/03 第 5.1 节，S2-5）。需身份（注册用户或游客的 Access Token），匿名 401。
        规则：过屏蔽词（命中 block 拒绝返回 400、mask 替换为 ***、review 先送审）；站点或命中 review 时先审后显（返回 status=pending「审核中」）；
        禁言用户 403；同作者 10 秒内相同内容去重返回 409；内容 1–500 字、富文本按纯文本处理（只保留表情码）；
        游客受 guest_interaction 开关约束（关闭时 401 引导登录）、评论总开关关闭时 403。parent_id 为回复目标，可空。
        响应 Cache-Control: private, no-store。带图评论（image_ids）依赖图片管线 S6-13，本版本不收图。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - { name: id, in: path, required: true, description: 分集 ID, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              additionalProperties: false
              properties:
                content: { type: string, maxLength: 500 }
                parent_id: { type: integer, format: int64, description: 回复的评论 ID，顶层评论不传 }
      responses:
        "200":
          description: 发表成功（status=visible 立即可见 / pending 审核中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/comments/{id}:
    delete:
      summary: 删除本人评论
      description: |
        软删除本人发表的评论（docs/03 第 5.1 节，S2-5）。不是本人（作者不匹配）返回 404，不暴露他人评论的存在。
        响应 Cache-Control: private, no-store。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/comments/{id}/like:
    post:
      summary: 点赞评论
      description: |
        给评论点赞（docs/03 第 5.1 节，S2-5），幂等（重复点赞不叠加）。仅注册用户；游客 401。响应 Cache-Control: private, no-store。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已点赞 }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/episodes/{id}/danmaku:
    get:
      summary: 拉取弹幕（按时间窗口）
      description: |
        按时间窗口拉取某集显示中的弹幕（docs/03 第 5.2 节，S2-5）。公开读，无需登录。
        窗口 [from_ms, to_ms)：服务端自动夹到 60 秒内、单窗口最多返回 300 条，按出现时间升序。
        结果可被 CDN 缓存 30 秒（Cache-Control: public, max-age=30，键含窗口参数）。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - { name: id, in: path, required: true, description: 分集 ID, schema: { type: integer, format: int64 } }
        - { name: from_ms, in: query, description: 窗口起点（毫秒，含）, schema: { type: integer, minimum: 0 } }
        - { name: to_ms, in: query, description: 窗口终点（毫秒，不含）, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: 弹幕列表
          headers:
            Cache-Control: { schema: { type: string }, description: "public, max-age=30" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/DanmakuView" } }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 发送弹幕（注册用户或游客）
      description: |
        发送一条弹幕（docs/03 第 5.2 节，S2-5）。需身份（注册用户或游客的 Access Token），匿名 401。
        规则：内容 1–40 字（换行折成空格、富文本按纯文本）；颜色须在白名单内（RRGGBB，大小写与前导 # 自动归一，缺省白 FFFFFF），超出返回 400；
        过屏蔽词（命中 block 拒绝 400、mask 替换 ***、review 先送审返回 status=pending）；禁言用户 403；
        游客受 guest_interaction 开关约束（关闭时 401）、弹幕总开关关闭时 403。弹幕不做重复内容去重。响应 Cache-Control: private, no-store。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
        - { name: id, in: path, required: true, description: 分集 ID, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              additionalProperties: false
              properties:
                time_ms: { type: integer, minimum: 0, description: 出现时间（毫秒） }
                content: { type: string, maxLength: 40 }
                color: { type: string, description: RRGGBB，须在白名单内；缺省白 FFFFFF }
      responses:
        "200":
          description: 发送成功（status=visible 立即可见 / pending 审核中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Danmaku" }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/reports:
    post:
      summary: 举报（评论 / 弹幕 / 剧 / 评论图片）
      description: |
        提交一条举报（docs/03 第 5.3 节，S2-5）。需身份（注册用户或游客的 Access Token），匿名 401。
        target_type 为被举报对象类型、target_id 为其 ID；reason 为原因枚举；detail 为选填补充说明（≤500 字）。
        同一举报人对同一对象 24 小时内只计一次：重复举报幂等放行，一律返回 204（不提示「已举报过」）。
        举报的后续处理（通过 / 驳回 + 处理备注）在运营后台的举报队列（docs/06 第 25 节）。响应 Cache-Control: private, no-store。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/BearerAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              additionalProperties: false
              properties:
                target_type: { type: string, enum: [comment, danmaku, drama, comment_image] }
                target_id: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, enum: [attack, vulgar, illegal, minor, ad, spoiler, other], description: 人身攻击 / 低俗色情 / 违法违规 / 涉未成年 / 广告引流 / 剧透 / 其他 }
                detail: { type: string, maxLength: 500, description: 选填补充说明 }
      responses:
        "204": { description: 已受理（含 24 小时内重复举报的幂等放行） }
        "400": { $ref: "#/components/responses/EncError" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/emojis:
    get:
      summary: 下发表情包
      description: |
        返回全部表情包及其表情，供评论 / 弹幕输入框渲染（docs/03 第 5.4 节，S2-5）。公开读，无需登录。
        按内容派生弱 ETag、强缓存 1 天（表情变更后内容哈希变化即失效）。表情码（code）形如 [微笑]，评论文本里原样保留、前台替换为图片。
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 表情包列表
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=86400, stale-while-revalidate=60" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [packs]
                        properties:
                          packs: { type: array, items: { $ref: "#/components/schemas/EmojiPackView" } }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/announcements:
    get:
      summary: 当前显示中的公告（顶部滚动条与弹窗）
      description: |
        返回启用、已到开始时间、未到结束时间且投给该语言的公告，新的在前（docs/specs/A3-4.md）。
        出现页面（pages，空 = 全部页面）与频率（once 每人一次、daily 每人每天一次，记录存在客户端本机）由前台判断；
        同一页面有多条弹窗时只弹第一条。后台修改后立即生效，共享缓存最多 30 秒。
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/PublicLocale"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=30, stale-while-revalidate=60" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/PublicAnnouncement" } }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/ads:
    get:
      summary: 按位置拉广告
      description: |
        每个位置只取投放中、未过结束时间、投给该端与该语言的广告，按权重不放回地随机取 n 条；设置了每天次数上限（freq_cap）的广告，
        该设备当天（北京时间）曝光达到上限后不再下发（曝光以 POST /api/v1/ads/event 上报为准）。结果按 slots 中位置的顺序排列，
        没有广告的位置不出现。按设备频控且每次随机，响应不可缓存（Cache-Control: private, no-store）。
        自定义 HTML 素材（creative_type=html）已在保存时清洗，前台仍须只在沙箱 iframe 中渲染。docs/specs/A3-4.md。
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/DeviceID"
        - name: slots
          in: query
          required: true
          description: 广告位置，多个用半角逗号分隔（去重后按出现顺序返回），整串不超过 300 个字符
          schema: { type: string, example: "home_top,list_feed" }
        - name: n
          in: query
          required: false
          description: 每个位置最多几条
          schema: { type: integer, minimum: 1, maximum: 5, default: 1 }
        - name: device
          in: query
          required: false
          description: 当前端。不传时只返回「都投」（device=all）的广告
          schema: { type: string, enum: [mobile, desktop] }
        - $ref: "#/components/parameters/PublicLocale"
      responses:
        "200":
          description: 成功（没有广告时 list 为空数组）
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/PublicAd" } }
        "400": { description: "BAD_REQUEST（slots 缺失或有不认识的位置、n 超出 1–5、device 不是 mobile / desktop），或报文加密协议错误" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/ads/event:
    post:
      summary: 上报广告曝光或点击
      description: |
        同一设备、同一广告、同一种事件 1 秒内只计一次；不在投放中的广告不计数。这两种情况同样返回 204。
        计数先在 Valkey 累加，worker 每分钟落库，后台显示的数字最多晚 1 分钟；有频控的广告的曝光同时计入该设备当天的次数。
        曝光的判定（可见 50% 且 1 秒）由前台负责。
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ad_id, kind]
              additionalProperties: false
              properties:
                ad_id: { type: integer, format: int64, minimum: 1 }
                kind: { type: string, enum: [impression, click] }
      responses:
        "204": { description: 已收到 }
        "400": { description: "BAD_REQUEST（请求体格式错误、ad_id 无效、kind 不是 impression / click），或报文加密协议错误" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/search:
    get:
      summary: 搜索（只有剧集）
      description: |
        按剧名或别名搜索已上架的剧（docs/03 第 3.3 节、docs/specs/S3-4.md）。
        q 先规范化（全角转半角、转小写、去控制字符、合并空白），规范化后为空或超过 50 字返回 400；
        匹配大小写不敏感，`%` 与 `_` 按字面处理（不是通配符）。响应只含前台可见的剧（已上架、定时已到点、不在回收站）。
        排序默认 hot（MVP 没有相关性打分，热度是最合理的代理）；不支持 random。
        每次搜索（只在第一页）会计入热搜榜的搜索次数，没有结果的词也记。
      tags: [site]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 }, description: 搜索词，规范化后 1–50 字 }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [latest, hot, recommend], default: hot } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 上一页返回的 next_cursor；与本次 sort 不一致时 400 }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 60, default: 24 } }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功（没有命中时 list 为空数组、total 为 0）
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=60, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublicSearchPage" }
        "304": { description: 未变化 }
        "400": { description: BAD_REQUEST（搜索词为空或超长、分页参数错误、游标与排序不一致）或报文加密协议错误 }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/search/suggest:
    get:
      summary: 搜索联想（可关）
      description: |
        输入时的剧名联想（docs/04 第 9 节）：剧名以搜索词开头的排在前面，其余按热度，最多 10 条，只含前台可见的剧。
        别名命中也会出现（排在剧名前缀命中之后）。联想**不计入**热搜榜——输入过程中的半截词会污染选品依据。
        `features.search_suggest` 关闭时整个接口返回 404，前台据此隐藏实时联想。
        按设备（X-Device-Id，缺失时按客户端 IP）每分钟 60 次，超出返回 429 与 Retry-After。
      tags: [site]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 }, description: 搜索词，规范化后 1–50 字 }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 10 } }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功（没有命中时 list 为空数组）
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=300, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublicSuggestPage" }
        "304": { description: 未变化 }
        "400": { description: BAD_REQUEST（搜索词为空或超长、条数越界）或报文加密协议错误 }
        "404": { description: NOT_FOUND（features.search_suggest 已关闭） }
        "429": { description: RATE_LIMITED（带 Retry-After，单位秒） }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/search/hot:
    get:
      summary: 热搜榜
      description: |
        最多 10 个词：置顶的按后台拖拽顺序在前，其余显示中的词按搜索次数倒序。词是规范化后的形式（全角转半角、小写、合并空白）。
        搜索次数每小时更新；后台修改后立即生效，共享缓存最多 60 秒。docs/specs/A3-4.md。
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功（没有热搜词时 list 为空数组）
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=60, stale-while-revalidate=60" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/PublicHotWord" } }
        "304": { description: 未变化 }
        "400": { $ref: "#/components/responses/EncError" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/rank:
    get:
      summary: 榜单前 20 名
      description: |
        剧集周榜 / 月榜（docs/04 第 8 节）。worker 每 5 分钟重新排名，结果原子替换，读的一方没有空窗；上次排名后下架的剧在读时去掉，
        名次重新连续编号。heat 是热度值：播放 × 系数 + 追剧 × 系数 + 点赞 × 系数 + 看完 × 系数 + 运营加分（追剧、点赞、看完的数据
        接入前按 0 计，周榜与月榜暂时相同）。运营置顶的剧排在最前，前台不标出。site_config.features.ranks 为 false 时返回 404。
        docs/specs/A3-4.md。
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: board
          in: query
          required: true
          schema: { $ref: "#/components/schemas/RankBoard" }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功（没有可上榜的剧时 list 为空数组）
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=60, stale-while-revalidate=60" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublicRankBoard" }
        "304": { description: 未变化 }
        "400": { description: "BAD_REQUEST（board 缺失或不是 drama_week / drama_month），或报文加密协议错误" }
        "404": { description: NOT_FOUND（榜单功能已关闭） }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/pages/{slug}:
    get:
      summary: 静态页正文
      description: |
        条款、隐私、FAQ 等静态页（docs/06 第 13 节）。只返回已发布的页：草稿与不存在的 slug 都是 404。
        body 是后台保存时已按白名单清洗的 HTML（脚本、样式表、iframe、表单与事件属性已去掉），前台可直接渲染。
        页脚「帮助与条款」的页面清单随 /api/v1/site-config 的 footer_pages 段下发。docs/specs/A3-1.md。
      tags: [site]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
          description: 小写字母、数字与连字符
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=300, stale-while-revalidate=60" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublicStaticPage" }
        "304": { description: 未变化 }
        "400": { description: 报文加密协议错误 }
        "404": { description: NOT_FOUND（草稿或不存在） }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/home:
    get:
      summary: 页面区块编排（首页 / 频道页）
      description: |
        该页面全部启用区块及其数据，一次返回（docs/02 第 3.1 节、docs/06 第 15 节、docs/specs/A3-1.md）。
        只含启用且当次取到内容的区块，顺序即后台编排的顺序；device 字段交给前台按设备过滤（电脑与手机共享一份缓存）。
        广告位与公告条区块只给 ad_slot / announce_kind，素材与内容前台另调 /api/v1/ads、/api/v1/announcements
        （按设备频控，不能进共享缓存）。自定义 HTML 区块的 html 已按白名单清洗，前台在沙箱 iframe 中渲染。
        单个区块取数失败时后端记日志并跳过该区块，整页仍然返回 200。
      tags: [site]
      parameters:
        - $ref: "#/components/parameters/XEnc"
        - name: page
          in: query
          required: false
          schema: { type: string, maxLength: 72 }
          description: "home（默认）或 channel:{频道 slug}；未知页面 404"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "public, max-age=0, s-maxage=60, stale-while-revalidate=60" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PublicHome" }
        "304": { description: 未变化 }
        "400": { description: 报文加密协议错误 }
        "404": { description: NOT_FOUND（页面不存在或频道已停用） }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/login:
    post:
      summary: 后台登录（账号 + 密码）
      description: |
        成功后下发会话 Cookie（见 securitySchemes.AdminSession），令牌不出现在响应体中。会话空闲 2 小时过期、绝对时长 7 天，
        绑定 User-Agent 摘要（换浏览器即失效）。二次验证在 S2-6 接入：届时需要二次验证的账号返回 mfa_required=true 与 mfa_ticket，
        当前恒为 false。

        - 用户名不区分大小写。用户名不存在与密码错误返回相同的 401 NEED_LOGIN「用户名或密码错误」，耗时相近。
        - 同一用户名连续失败 5 次、或同一 IP（IPv6 按 /64）累计失败 20 次后锁定，直到最后一次失败起 15 分钟：返回 429 RATE_LIMITED 与
          Retry-After（秒）；锁定期间即使密码正确也不能登录。登录成功清除该用户名的失败计数。
        - 账号已停用时（密码正确）返回 403 FORBIDDEN「账号已停用」。
      tags: [admin-auth]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 开发环境 `xs_admin=<令牌>; Path=/; HttpOnly; SameSite=Strict`；其余环境名为 `__Host-xs_admin` 并带 Secure
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminLoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/login/mfa:
    post:
      summary: 后台登录第二步：二次验证
      description: |
        账号密码正确但账号已启用二次验证时，POST /api/admin/login 返回 mfa_required=true 与一次性 mfa_ticket，
        不下发会话；用该票据 + 认证器验证码换会话。票据 5 分钟内有效、通过后作废；验证码错误累计计入登录失败锁定
        （与账号密码登录共用计数，连续失败会 429）。本期只支持 method=totp（Passkey 随 S2-6 后续切片）。
      tags: [admin-auth]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginMFARequest" }
      responses:
        "200":
          description: 二次验证通过，下发会话 Cookie（同 POST /api/admin/login 成功）
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 同 POST /api/admin/login
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/admin/me:
    get:
      summary: 当前管理员、CSRF 令牌与已授予的权限点
      description: |
        页面刷新后前端靠它恢复会话状态；CSRF 令牌只存内存。会话失效时返回 401 并清除 Cookie。
        权限每个请求实时读取：角色权限被修改后，下一个请求即按新权限判定；账号或所属角色被停用、密码被重置、被强制下线后返回 401。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/logout:
    post:
      summary: 退出登录（吊销当前会话并清除 Cookie）
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已退出；记一条审计 admin.logout
          headers:
            Set-Cookie: { schema: { type: string }, description: 以 Max-Age=0 清除会话 Cookie }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/me/menus:
    get:
      summary: 当前管理员的侧栏菜单
      description: |
        两级侧栏：一级菜单是目录、页面或外链，目录的 children 是它下面的二级菜单。按后台菜单配置（/api/admin/admin-menus）
        与当前权限过滤：隐藏的菜单不返回；页面需要 `<页面>.view`；外链对所有管理员返回；没有可见二级菜单的目录不返回。
        同级按排序值排列。只用于显示，后端仍按权限点校验每个接口。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminNavNode" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/mfa/totp/setup:
    post:
      summary: 开始绑定 TOTP（生成待确认的种子）
      description: |
        为当前登录管理员生成一个新的 TOTP 种子并暂存（10 分钟内有效），返回 otpauth URL（供认证器扫码）与 secret（供手动输入）。
        此时尚未启用：必须再调用 /api/admin/mfa/totp/verify 用一次性验证码确认后才生效。重复调用会覆盖上一次待确认的种子。
        任何登录管理员都能管理自己的二次验证，无需额外权限点。后台未配置 TOTP 种子包装密钥（ADMIN_TOTP_KEKS）时返回 503 UNAVAILABLE。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已生成待确认的种子
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminTOTPSetup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/admin/mfa/totp/verify:
    post:
      summary: 确认绑定 TOTP（校验一次性验证码后启用）
      description: |
        用认证器当前显示的 6 位验证码确认 /api/admin/mfa/totp/setup 暂存的种子。通过后把种子信封加密落库、启用二次验证，
        记一条审计 admin.mfa_totp_enable。验证码错误或暂存已过期返回 400 BAD_REQUEST；未配置密钥返回 503 UNAVAILABLE。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTOTPVerifyRequest" }
      responses:
        "200":
          description: 已启用二次验证
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/admin/mfa/passkey/register/begin:
    post:
      summary: 开始注册 Passkey（取创建选项）
      description: |
        为当前管理员生成 WebAuthn 凭据创建选项（PublicKeyCredentialCreationOptions）并暂存挑战（5 分钟）。
        前端用 @simplewebauthn/browser 的 startRegistration 调认证器，再调 finish 保存。每人最多 10 把，超出 409。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: WebAuthn 创建选项（原样交给浏览器）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/AdminWebAuthnOptions" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/mfa/passkey/register/finish:
    post:
      summary: 完成注册 Passkey（校验响应后保存）
      description: 校验 startRegistration 的响应并保存该 Passkey；记审计 admin.mfa_passkey_register。校验不过 400。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                name: { type: string, maxLength: 64, description: 给这把 Passkey 起的名字 }
                response: { type: object, additionalProperties: true, description: startRegistration 返回的注册响应 }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/mfa/passkeys:
    get:
      summary: 列出当前管理员的 Passkey
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AdminPasskeyInfo" } }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/mfa/passkeys/{id}:
    delete:
      summary: 删除当前管理员的一把 Passkey
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/login/passkey/begin:
    post:
      summary: 登录第二步用 Passkey：取断言选项
      description: |
        账号密码正确且账号已注册 Passkey 时，用登录第一步的 mfa_ticket 取 WebAuthn 断言选项（公开，尚无会话）。
        前端用 startAuthentication 调认证器，再带 method=passkey + response 调 /api/admin/login/mfa 换会话。
      tags: [admin-auth]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_ticket]
              additionalProperties: false
              properties: { mfa_ticket: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: WebAuthn 断言选项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/AdminWebAuthnOptions" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/reauth/passkey/begin:
    post:
      summary: 高敏重验用 Passkey：取断言选项
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: WebAuthn 断言选项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/AdminWebAuthnOptions" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/reauth:
    post:
      summary: 高敏操作重新验证二次因子
      description: |
        高敏操作（标 sensitive 的权限点：改线路 / 存储源 / FTP / 配置导入 / API Key / 域名 / 管理员 / 角色与权限、
        SEO 统计代码）要求 5 分钟内、且在同一 IP 网段重新验证过二次因子（docs/03 第 2.3 节、docs/10 第 6.3 节）。
        未满足时这些接口返回 412 REAUTH_REQUIRED，前端弹窗调用本接口：校验当前管理员的 TOTP 验证码，通过后本会话在
        5 分钟内（且不换网段）可执行高敏写操作，记一条审计 admin.reauth。IP 网段变化会使之前的重新验证失效、需再次验证。
        仅对已绑定二次验证的账号有意义（未绑定返回 400，提示先去账号安全绑定）。验证码错误计入登录失败锁定。本期只支持 method=totp。
      tags: [admin-auth]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReauthRequest" }
      responses:
        "200":
          description: 已重新验证，本会话 5 分钟内可执行高敏写操作
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admins:
    get:
      summary: 管理员列表
      description: 需要 admins.view。管理员数量很少，一次返回全部，不分页。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminAccountList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建管理员
      description: |
        需要 admins.edit。新账号状态为 unused，首次登录后变为 active。只有超级管理员可以授予超级管理员角色（否则 403）；
        不能选择已停用的角色（400）。用户名已存在返回 409。记审计 admin.create（不记录密码）。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateRequest" }
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admins/{id}:
    patch:
      summary: 修改管理员的角色与状态
      description: |
        需要 admins.edit。不能修改自己（403）；目标是超级管理员、或要换成超级管理员角色时只有超级管理员可以操作（403）；
        设为 active 时不能选择已停用的角色（400）；修改后没有可用的超级管理员时拒绝（409）。
        从未登录过的账号设为 active 时保持 unused。停用后该管理员的会话立即失效。记审计 admin.update。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateRequest" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admins/{id}/password:
    post:
      summary: 重置其他管理员的密码
      description: |
        需要 admins.edit。不能对自己操作；操作超级管理员账号需要超级管理员（均为 403）。新密码 8–128 位，不能与用户名相同（400）。
        该管理员的全部会话立即失效。记审计 admin.reset_password（不记录密码）。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPasswordRequest" }
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admins/{id}/sessions:
    delete:
      summary: 强制下线
      description: |
        需要 admins.edit。该管理员的全部会话立即失效（下一个请求返回 401）。不能对自己操作；操作超级管理员账号需要超级管理员（均为 403）。
        记审计 admin.revoke_sessions。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已下线
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admins/{id}/reset-mfa:
    post:
      summary: 重置某管理员的二次验证（S2-6）
      description: |
        需要 admins.edit（高敏，需 5 分钟内重新验证过）。清除该管理员已绑定的 TOTP 与全部 Passkey，并强制其下线，
        用于其丢失认证设备时由他人恢复——恢复后对方需重新开启二次验证（超管会被强制开启）。
        不能对自己操作；操作超级管理员账号需超级管理员（均 403）。记审计 admin.reset_mfa。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/roles:
    get:
      summary: 角色列表（含成员数与已授予的权限点）
      description: 需要 roles.view、admins.view、role_permissions.view 之一（管理员页选择角色、角色权限页也用它）。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 按排序值排列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminRoleList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建自定义角色
      description: |
        需要 roles.edit。新角色没有任何权限，在角色权限页（PUT /api/admin/roles/{id}/permissions）中授予。
        编码已存在返回 409。记审计 role.create。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleCreateRequest" }
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/roles/{id}:
    patch:
      summary: 修改角色的名称、说明、状态与排序
      description: |
        需要 roles.edit。编码不能改。超级管理员角色不能停用（409）。停用角色后其成员不能登录，现有会话立即失效。
        记审计 role.update。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleUpdateRequest" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除自定义角色
      description: 需要 roles.edit。内置角色（超级管理员）与有成员的角色不能删除（409），需先把成员换到其他角色。记审计 role.delete。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/roles/{id}/permissions:
    put:
      summary: 整体替换角色的权限点（角色权限页保存）
      description: |
        需要 role_permissions.edit。授予某页面的任一权限点时自动补上该页面的 `.view`；响应返回实际保存的权限点。
        - 权限点不存在返回 400。
        - 超级管理员角色拥有全部权限，不能修改（409）。
        - 非超级管理员不能修改自己所属的角色，且只能授予或收回自己拥有的权限点（403）。
        修改立即生效：该角色成员的下一个请求即按新权限判定。记审计 role.set_permissions（修改前后的权限点）。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRolePermissionsRequest" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [permissions]
                        properties:
                          permissions:
                            type: array
                            description: 实际保存的权限点（去重、排序）
                            items: { $ref: "#/components/schemas/AdminPermissionCode" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/permissions:
    get:
      summary: 权限树（角色权限页的勾选树）
      description: |
        需要 role_permissions.view 或 roles.view。按当前后台菜单结构组织：一级节点是目录（children 为其下的页面）
        或一级页面（permissions 为其权限点）；含已隐藏的菜单；外链与没有页面的目录不出现。
        权限点由数据库迁移定义，不能在后台新增（docs/adr/0006）。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminPermissionNode" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admin-menus:
    get:
      summary: 后台菜单（含隐藏的）
      description: 需要 admin_menus.view。按排序值排列；客户端按 parent_id 组成两级结构。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminMenuList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建目录或外链
      description: |
        需要 admin_menus.edit。只能新建目录（kind=group，只能是一级菜单）或外链（kind=link，parent_id 为空时是一级菜单，
        否则挂在该目录下；地址为 http:// 或 https:// 开头的完整地址）；页面由系统提供，不能新建。编码由服务端生成（c_ 开头）。
        记审计 admin_menu.create。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AdminMenuRequest"
                - type: object
                  required: [kind]
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/admin-menus/{id}:
    patch:
      summary: 修改菜单
      description: |
        需要 admin_menus.edit。可改名称、图标、排序、是否显示与上级目录（页面与外链可在一级与二级之间移动，目录只能是一级）；
        类型以现有记录为准（请求中的 kind 忽略），页面的路径不能改（请求中的 path 忽略）。隐藏菜单只影响侧栏显示，不收回权限。
        记审计 admin_menu.update。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMenuRequest" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除自定义菜单
      description: 需要 admin_menus.edit。只能删除自定义的外链与空目录；内置菜单只能隐藏（409）。记审计 admin_menu.delete。
      tags: [admin-access]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 内容管理（S1-3，docs/06 第 4–7、11、14 节）----------

  /api/admin/dramas:
    get:
      summary: 剧集列表（页码分页，不含回收站中的剧）
      description: |
        需要 dramas.view。q 匹配剧名或别名（两个字的词也能命中），#123 只按编号，纯数字同时按编号与剧名。
        排序默认按编号倒序；latest 为上架时间倒序（未上架的在最后）、updated 为修改时间倒序、hot 为热度、recommend 为排序值。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, scheduled, offline] }
          description: published 只含已经可见的；scheduled 为已上架但 publish_at 未到
        - { name: tag_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: term_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, updated, hot, recommend] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminDramaPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建剧集（草稿）
      description: |
        需要 dramas.edit。新剧一律为草稿（请求中不能带 status），热度分 = 初始播放量。slug 可留空，填写时全站唯一（冲突 409「slug 已被使用」）。
        记审计 drama.create。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDramaCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminDramaResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/dramas/bulk:
    post:
      summary: 剧集批量操作
      description: |
        需要 dramas.edit。一次最多 200 部；不存在或在回收站中的剧忽略，返回受影响的剧数。
        - publish / offline / draft：只改状态不同的剧；上架时没有上架时间的写入当前时间。
        - add_tags：追加标签（tag_ids 必填，不能是已合并的标签）。
        - add_to_topic：按 ids 顺序追加到手选专题末尾，已在专题中的不动（topic_id 必填；自动专题 400）。
        - set_terms：多选维度的取值追加，单选维度的取值替换（term_ids 必填，每个单选维度最多一个）。
        记审计 drama.bulk（动作、剧编号与受影响的剧数）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDramaBulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminBulkResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/dramas/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      summary: 剧集详情（剧资料、标签、维度取值）
      description: 需要 dramas.view。回收站中的剧返回 404。分集用 GET /api/admin/dramas/{id}/episodes 读取。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminDramaDetailResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      summary: 保存剧资料
      description: |
        需要 dramas.edit。整体保存（未传的可选字段按默认值保存）。状态为 published 且没有 publish_at 时写入当前时间，
        publish_at 在未来即定时上架；热度分同步为 view_base + view_count。回收站中的剧 404；slug 冲突 409。
        记审计 drama.update（修改前后）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDramaUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminDramaResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除剧集（放进回收站）
      description: |
        需要 dramas.edit。写入删除时间，分集与关联保留，30 天内可在回收站还原（S4-7）；之后不能查看或修改（404）。
        记审计 drama.delete。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/dramas/{id}/tags:
    put:
      summary: 整体替换剧的标签
      description: 需要 dramas.edit。重复的 ID 只保留一个；标签不存在或已并入其他标签返回 400。记审计 drama.set_tags。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTagIdsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminDramaTagsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/dramas/{id}/terms:
    put:
      summary: 整体替换剧的维度取值
      description: |
        需要 dramas.edit。单选维度最多一个取值，多选维度不限；取值不存在或单选维度选了多个返回 400。停用的取值可以选（前台不显示）。
        记审计 drama.set_terms。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTermIdsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminDramaTermsResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/dramas/{id}/episodes:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      summary: 一部剧的全部分集（按集号）
      description: 需要 dramas.view。不分页。剧在回收站中时 404。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminEpisodeListResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新增分集
      description: |
        需要 dramas.edit。集号在同一部剧内唯一（重复 409「第 N 集已存在」）；可试看秒数不能超过时长（时长为 0 表示未知，不限）。
        视频绑定随 S1-6a 提供，S1-3 中 video_object_id 保持为空。保存后刷新剧的「更新至 N 集」。记审计 episode.create。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEpisodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminEpisodeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/episodes/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AdminOrigin"
      - $ref: "#/components/parameters/CSRFToken"
    patch:
      summary: 保存分集
      description: |
        需要 dramas.edit。整体保存，规则同新增；所属的剧在回收站中时 404。保存后刷新剧的「更新至 N 集」。记审计 episode.update（修改前后）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEpisodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminEpisodeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除分集
      description: 需要 dramas.edit。直接删除，不进回收站；刷新剧的「更新至 N 集」。记审计 episode.delete。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 后台媒体上传 ----------

  /api/admin/uploads:
    post:
      summary: 创建后台媒体上传会话
      description: |
        按 purpose 动态要求 dramas.edit、announcements.edit、ads.edit、fb_projects.edit 或 pages.edit。
        服务端按媒体类型选择后台「存储设置」中的图片或视频主存储，固定 provider_id 及 endpoint、region、bucket、path style、path_prefix 快照；同一 provider 后续配置变更只影响新会话，CDN/线路只用于后续读取分发。
        图片只能申请 WebP / AVIF，浏览器先压缩编码再上传；视频只支持 MP4、MOV、WebM、MKV，最大 4 GiB。
        会话绑定当前管理员、服务端生成对象 key、15 分钟有效；图片目标为 img/<purpose>/，视频源目标为视频主存储的 video/source/，完成时服务端复制到私有 ingest/ 暂存桶转码。
        记审计 media_upload.create。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMediaUploadInitRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminMediaUploadResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/uploads/{id}:
    get:
      summary: 查询本人后台媒体上传会话
      description: 只返回当前管理员创建的会话；广告视频可用 queued / running / ready / failed 与 progress 轮询 HLS 转码状态。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200": { $ref: "#/components/responses/AdminMediaUploadResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/uploads/{id}/content:
    put:
      summary: 流式上传媒体文件内容
      description: |
        仅接受本人处于 created 状态、未过期的上传会话。必须使用创建会话时的 Content-Type 与精确 Content-Length；
        API 进程流式转发到服务器生成的对象 key 和会话固定的 provider endpoint/region/bucket/path style/path_prefix，不把存储凭据下发给浏览器。成功后状态变为 uploaded。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          image/webp: { schema: { type: string, format: binary } }
          image/avif: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/quicktime: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
          video/x-matroska: { schema: { type: string, format: binary } }
      responses:
        "200": { $ref: "#/components/responses/AdminMediaUploadContentResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/uploads/{id}/complete:
    post:
      summary: 完成后台媒体上传
      description: |
        再次检查对象大小、Content-Type；图片额外检查 WebP / AVIF 文件头后直接 ready。
        分集视频提交既有受保护 HLS 转封装任务；广告视频进入 media 队列，完成后 output_key 为 video/assets/<upload_id>/master.m3u8。
        记审计 media_upload.complete。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminMediaUploadResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 转封装（S1-5，docs/specs/S1-5.md）----------

  /api/admin/episodes/{id}/transcode:
    post:
      summary: 提交分集的转封装任务
      description: |
        需要 dramas.edit。把对象存储（MEDIA_SOURCE_BUCKET）中的源视频转为加密的 MPEG-TS HLS：H.264 + AAC-LC、固定 4 秒 `.ts` 切片、
        按源尺寸选 360 / 480 / 720 档（不放大）、首帧图、AES-128 加密。历史 fMP4 产物继续可播放；worker 异步执行，用
        GET /api/admin/transcode-jobs/{id} 轮询进度；失败自动重试，最多 4 次。
        请求体可以是 {}：source_key 留空时沿用该集上一个任务的源文件（重试）；该集从未提交过时 400。
        源文件与该集当前可播放的产物相同且 force=false 时任务结果为 skipped，不重新转码。
        分集还没有可播放的视频时 media_status 变为 transcoding；已是 ready 的分集在新产物完成前继续使用旧产物。
        同一集已有 queued / running 的任务时 409。分集或所属的剧不存在（含回收站）404。成功后刷新剧的「更新至 N 集」
        （只算 media_status = ready 的分集）。记审计 episode.transcode（job_id、source_key、force）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTranscodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminTranscodeJobResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 后台试播（S1-8 的后台部分，docs/06 第 37 节）----------

  /api/admin/episodes/{id}/preview:
    post:
      summary: 签发分集试播地址
      description: |
        需要 dramas.view。运营在后台直接播一集，确认转封装产物与线路真的通。
        与前台选源刻意不同的三处：不判观看权限、不按 trial_sec 裁剪（完整时长）、允许未上架的剧；
        令牌另派生一套，与前台播放令牌互不通用，且只有本组后台接口收它。
        返回的 url 是同源的后台清单地址（不加密、走后台会话），可直接交给 hls.js；有效期十分钟，过期重新签发。
        分集没有可播放的产物（media_status 不是 ready）或不存在时 404；没有可用的视频线路时 503
        （提示先到「存储 - 线路」为主存储配置并启用视频线路）。不记审计（只读操作）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminEpisodePreviewResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/preview/{token}/{file}:
    get:
      summary: 试播清单
      description: |
        需要 dramas.view。与前台 /api/v1/hls/{token}/{file} 同一套清单改写（切片换成线路签名地址、
        内容密钥地址换成下面那条后台路由），区别是不加密、授权来自后台会话 + 预览令牌，并且不裁剪试看。
        file 为 index.m3u8（主清单）或主清单中列出的一档 v{短边}.m3u8，其他值 404。
        令牌过期 401 TOKEN_EXPIRED；令牌无效或与分集不符 403；线路已不能提供这一集 503。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: token, in: path, required: true, description: 预览令牌（POST …/preview 返回的地址里已带）, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, example: index.m3u8 } }
      responses:
        "200":
          description: HLS 清单
          headers:
            Cache-Control: { schema: { type: string, example: private, no-store } }
          content:
            application/vnd.apple.mpegurl: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/preview/key/{episode_id}/{key_ver}:
    get:
      summary: 试播内容密钥
      description: |
        需要 dramas.view。返回 16 字节 AES-128 内容密钥，与前台同一份（同一把 MEDIA_KEKS、同一个 key_ver，
        产物不需要重新加密）。令牌里的分集必须与路径一致，否则 403。不限流：调用方在后台会话内，
        前台那条路才按设备限流。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: episode_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: key_ver, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: t, in: query, required: true, description: 预览令牌, schema: { type: string } }
      responses:
        "200":
          description: 16 字节内容密钥
          headers:
            Cache-Control: { schema: { type: string, example: private, no-store } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/transcode-jobs:
    get:
      summary: 转封装任务列表（页码分页，按创建时间倒序）
      description: 需要 dramas.view。所属的剧在回收站中的任务不返回。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: episode_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: drama_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, skipped, failed] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminTranscodeJobPageResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/transcode-jobs/{id}:
    get:
      summary: 单个转封装任务（轮询进度）
      description: 需要 dramas.view。编号格式不对、任务不存在或所属的剧在回收站中时 404。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, description: 任务编号（UUIDv7）, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/AdminTranscodeJobResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/tags:
    get:
      summary: 标签列表（页码分页，按编号倒序）
      description: 需要 tags.view。q 匹配名称或 slug；merged=true 只看已并入其他标签的，merged=false 只看未合并的。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Q"
        - { name: status, in: query, schema: { type: string, enum: [active, hidden] } }
        - { name: merged, in: query, schema: { type: string, enum: ["true", "false"] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { $ref: "#/components/responses/AdminTagPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建标签
      description: 需要 tags.edit。slug 留空时自动生成（t- 开头）；填写的 slug 冲突 409。记审计 tag.create。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTagRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminTagResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/tags/{id}:
    patch:
      summary: 保存标签
      description: 需要 tags.edit。整体保存；slug 留空时重新生成。标签不能删除，只能合并。记审计 tag.update（修改前后）。
      tags: [admin-content]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTagRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminTagResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/tags/{id}/merge:
    post:
      summary: 把标签并入另一个标签
      description: |
