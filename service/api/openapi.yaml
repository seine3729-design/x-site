  /open-api/feedback:
    post:
      summary: 外部网站提交反馈
      tags: [反馈社区-开放接口]
      description: |
        给站外网页直接调用的提交接口（feedback/docs/07 第 0.5 节）。与 /api/v1 的三点不同：
        不走报文加密、免回源鉴权（第三方拿不到 X-Edge-Secret / X-Service-Token）、
        身份只认 X-Api-Key 请求头，不读 Cookie。

        浏览器可跨域调用：响应回显请求的 Origin，但不输出 Access-Control-Allow-Credentials，
        所以不会带上任何会话，也就没有 CSRF 面。真正的来源限制由密钥上的 allowed_origins 判定——
        配了白名单时，不带 Origin 的请求（服务端直连）一律拒绝，否则白名单可以靠去掉 Origin 绕过。

        配额有两层：按密钥每分钟 60 条 + 每日 daily_limit 条，另有按来源 IP 每分钟 120 条的粗粒度限流。
        所属项目由密钥决定，提交方不能指定；落库的可见性取密钥的 default_visibility（默认 members，先进后台分诊）。
      parameters:
        - name: X-Api-Key
          in: header
          required: true
          description: 后台生成的密钥明文（fbk_ 开头）
          schema: { type: string }
        - name: Origin
          in: header
          required: false
          description: 浏览器自动带上；密钥配了 allowed_origins 时必须在白名单内
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FbIntakeRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/FbIntakeResult" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: SIGNATURE_INVALID，密钥无效、已停用或已作废（不区分，避免据此探测密钥是否存在） }
        "403": { description: FORBIDDEN，提交来源未登记 }
        "409": { description: CONFLICT，项目当前不接受新反馈 }
        "429": { $ref: "#/components/responses/RateLimited" }
  # ---------- 域名与证书（A4-4 / S4-8，docs/06 第 38 节，docs/09 第 2、4 节）----------

  /api/admin/domains:
    get:
      summary: 域名池（不分页）
      description: |
        需要 domains.view。入口域名池，按角色、权重排序，可按 status、role、q（匹配域名或备注）筛选。
        每条附派生字段：role_title / status_title（中文）、cert_state（ok/expiring/expired/unknown，到期前 21 天告警）、
        cert_days_left（距到期天数，已过期为负）。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, watch, disabled] } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [web_primary, web_backup, nav, api, media, admin] } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: 域名列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/DomainEntry" } }
                          total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 新建域名
      description: 需要 domains.edit（高敏，需 5 分钟内重新验证）。host 全站唯一（重复 409）。记审计 domain.create。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminDomainResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      summary: 整体保存域名
      description: 需要 domains.edit（高敏）。整体保存，未传字段按默认值。记审计 domain.update。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminDomainResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: 删除域名
      description: 需要 domains.edit（高敏）。设置类数据，不进回收站。记审计 domain.delete。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { $ref: "#/components/responses/AdminOK" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domains/{id}/certificate:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      summary: 上传证书回填到期日
      description: |
        需要 domains.edit（高敏）。解析上传的 PEM 证书，把 not_after 写入该域名的 cert_expires_at（便于到期告警）。
        证书是公开信息，记审计 domain.upload_cert（只记主题、指纹与到期，不涉及私钥）。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertPEMRequest" }
      responses:
        "200":
          description: 回填后的域名与证书信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          domain: { $ref: "#/components/schemas/DomainEntry" }
                          cert: { $ref: "#/components/schemas/CertInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domain-health:
    get:
      summary: 域名健康看板
      description: |
        需要 domains.view。按域名 + 地区聚合最近窗口（默认 30 天）的探测成功率与客户端切换次数、失败原因分布。
        服务端拨测与客户端（APP/Web）切换上报接入前没有写入源，list 为空、note 说明情况。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 健康看板
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/DomainHealthOverview" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domain-certificates:
    post:
      summary: 手动生成自签证书
      description: |
        需要 domains.edit（高敏）。用标准库现场签出一张自签服务器证书（EC P-256 或 RSA 2048）。
        响应里的 key_pem 是私钥，只返回这一次，服务端不保存、不记日志、不记审计；浏览器不信任自签证书，
        用于源站回源 mTLS、本地/测试 HTTPS、ACME 应急占位。面向用户的公网入口证书仍由部署层 certbot 自动签发。
        记审计 domain.generate_cert（只记主题、SAN、指纹与到期，不含私钥）。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenCertRequest" }
      responses:
        "200":
          description: 生成的证书与私钥（私钥仅此一次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/GeneratedCert" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domain-certificates/inspect:
    post:
      summary: 解析证书（上传前预览）
      description: 需要 domains.view。只解析一张 PEM 证书、不改数据，返回主题、颁发者、SAN、有效期与指纹。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertPEMRequest" }
      responses:
        "200":
          description: 证书信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/CertInfo" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domain-releases:
    get:
      summary: 签名清单发布历史 + 当前线上清单
      description: 需要 domains.view。页码分页倒序返回发布历史，current 是当前线上清单（没有则为 null）。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 发布历史
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/DomainRelease" } }
                          total: { type: integer }
                          page: { type: integer }
                          page_size: { type: integer }
                          current:
                            oneOf:
                              - { $ref: "#/components/schemas/DomainRelease" }
                              - { type: "null" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: 发布已离线签名的清单
      description: |
        需要 domains.edit（高敏）。上传离线签名工具（docs/09：service/cmd/keytool，后台不保存签名私钥）签出的
        清单正文 payload 与签名 signature。校验 payload.v 必须等于当前应发布的下一个版本号（否则 409，需重新生成预览），
        签名非空且为 base64。记审计 domain.publish_release。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminOrigin"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishReleaseRequest" }
      responses:
        "200":
          description: 发布后的清单记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/DomainRelease" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/domain-releases/preview:
    get:
      summary: 生成待离线签名的清单预览
      description: |
        需要 domains.view。按当前域名池生成待签清单正文（排除停用的域名），version 为当前应发布的下一个版本号。
        带 from_version 时用该历史版本的内容作为基础（回滚旧清单的内容到一个新版本），运营对预览离线签名后再调发布。
      tags: [admin-domains]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: from_version, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: 清单预览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/ReleasePreview" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 安全中心（A4-4 / S4-8，docs/06 第 39 节，只读）----------

  /api/admin/security/login-logs:
    get:
      summary: 管理员登录记录
      description: |
        需要 security.view。页码分页倒序返回管理员登录记录，可按 result、q（匹配尝试的用户名）、
        from/to（RFC3339 或 YYYY-MM-DD，裸日期按 UTC）筛选。失败类结果标 suspicious（异常登录告警）。
      tags: [admin-security]
      security: [{ AdminSession: [] }]
      parameters:
        - { name: result, in: query, required: false, schema: { type: string, enum: [success, bad_password, inactive, mfa_failed, locked] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 登录记录的一页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/DomainLoginLogPage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/security/key-rotations:
    get:
      summary: 密钥轮换记录
      description: |
        需要 security.view。返回当前启用的各密钥版本（只有用途与版本号 kid，不含密钥本身），primary 为当前签发/加密用的那把。
      tags: [admin-security]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 密钥版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: "#/components/schemas/DomainKeyVersion" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/security/risk:
    get:
      summary: 风控概览
      description: 需要 security.view。限流命中、异常设备、人机验证触发等指标；实时计数源接入前 value 为空、note 说明。
      tags: [admin-security]
      security: [{ AdminSession: [] }]
      responses:
        "200":
          description: 风控概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - { type: object, properties: { data: { $ref: "#/components/schemas/DomainRiskOverview" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------- 埋点采集（S4-1，docs/03 第 8.1 节）----------

  /api/v1/events:
    post:
      summary: 埋点采集（批量上报）
      description: |
        用户端 / APP 批量上报埋点事件（最多 50 条/次，Web 用 sendBeacon/keepalive，APP 用本地队列）。
        服务端校验后写入 event_raw 分区表：occurred_at 由服务端打时间戳（防客户端时钟作弊）；
        未知事件类型与序列化后超过 4KB 的 props 单条静默丢弃；超过每设备每分钟配额的请求整体静默丢弃。
        始终尽快返回 204、不回传数据。走 /api/v1 报文加密（dev 可明文联调）。
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                client: { type: string, enum: [web, app], description: 客户端；非白名单值归一为空 }
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        description: >
                          事件类型白名单：visitor / page_view / play_attempt / play_start / play_error /
                          play_stall / line_switch / watch / ad_impression / ad_click / register_wall /
                          register / domain_switch / push_received / push_clicked；未知类型静默丢弃。
                      drama_id: { type: ["integer", "null"], format: int64 }
                      episode_id: { type: ["integer", "null"], format: int64 }
                      props: { type: object, additionalProperties: true, description: 事件属性；序列化后 ≤ 4KB，超过则该条丢弃 }
      responses:
        "204": { description: 已接受（不回传数据；含超配额被静默丢弃的情况） }
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: xs_admin
      description: |
        运营后台会话 Cookie（HttpOnly、SameSite=Strict、Path=/，不设过期时间），由 POST /api/admin/login 下发。
        非开发环境名为 `__Host-xs_admin` 且带 Secure。前端只需 `credentials: 'include'`，不能也不需要读取它。
  parameters:
    XEnc:
      name: X-Enc
      in: header
      required: false
      description: |
        报文加密头 `1.<kid>.<unix秒>.<enc>.<tag>`（base64url 无填充）。浏览器与 APP 必带，SSR 内网直连可省略。
        tag 绑定方法、请求目标（路径 + 查询串）与时间戳（与服务器相差不超过 300 秒）。
        有请求体时 Content-Type 为 application/vnd.xsite.enc，原始类型放在 X-Enc-Type。
      schema:
        type: string
        pattern: '^1\.[A-Za-z0-9]{1,16}\.[0-9]+\.[A-Za-z0-9_-]{43}\.[A-Za-z0-9_-]{22}$'
    BearerAuth:
      name: Authorization
      in: header
      required: true
      description: "Bearer <access_token>（登录 / 注册返回的 access_token）；注册用户专属接口（/api/v1/me/*）用它鉴权。"
      schema: { type: string }
    PublicLocale:
      name: locale
      in: query
      required: false
      description: 当前界面语言，用于按「投放语言」筛选公告与广告；不传或不支持时按 zh-CN 处理
      schema: { type: string, enum: [zh-CN, en, es, vi, ja, ko, th, hi, ar], default: zh-CN }
    DeviceID:
      name: X-Device-Id
      in: header
      required: false
      description: |
        客户端首次启动时生成并存在本机的设备 UUID，用于广告频控与事件去重。没有或不是 UUID 时服务端按「IP 网段 + UA 摘要」区分设备
        （同网段、同浏览器会被当作同一台设备）。服务端只保存摘要。游客身份（S1-10）上线后改用游客令牌中的设备 ID。
      schema: { type: string, format: uuid }
    AdminOrigin:
      name: Origin
      in: header
      required: false
      description: 浏览器自动携带。存在时必须在服务端 ADMIN_ORIGINS 白名单中（如 https://admin.example.com），否则 403 FORBIDDEN。
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 登录或 /api/admin/me 返回的 csrf_token，后台所有登录后的写请求必带；缺失或不一致返回 403 FORBIDDEN。
      schema: { type: string }
    UploadID:
      name: id
      in: path
      required: true
      description: 上传会话 UUIDv7；格式不对、已过期或不属于当前管理员时不返回会话
      schema: { type: string, format: uuid }
    PathID:
      name: id
      in: path
      required: true
      description: 记录 ID；不是正整数时返回 404
      schema: { type: integer, format: int64, minimum: 1 }
    TermID:
      name: term_id
      in: path
      required: true
      description: 取值 ID；不是正整数或不属于该维度时返回 404
      schema: { type: integer, format: int64, minimum: 1 }
    PathSlug:
      name: slug
      in: path
      required: true
      description: 记录的 slug（小写字母、数字与连字符）；格式不对或查不到时返回 404
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9-]*$' }
    Q:
      name: q
      in: query
      required: false
      description: 搜索词（去掉控制字符与首尾空白后最多 50 个字）；% 与 _ 按字面匹配
      schema: { type: string, maxLength: 50 }
    PublicSort:
      name: sort
      in: query
      required: false
      description: |
        排序（docs/03 第 3.2 节）：latest 上架时间、hot 热度、recommend 运营排序值、random 随机。
        random 按 10 分钟稳定的种子打乱，同一轮翻页顺序不变、下一个窗口换一批；白名单外的值返回 400。
      schema: { type: string, enum: [latest, hot, recommend, random], default: latest }
    PublicWindow:
      name: window
      in: query
      required: false
      description: 上新窗口，按上架时间过滤
      schema: { type: string, enum: [all, 7d, 14d, 30d, 90d], default: all }
    PublicCursor:
      name: cursor
      in: query
      required: false
      description: |
        上一页返回的 next_cursor，不透明字符串，不要自己构造或当偏移量用。
        解不开、或与本次请求的 sort 不一致时返回 400 BAD_REQUEST。
      schema: { type: string, maxLength: 128 }
    PublicLimit:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
    PublicPage:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始；超过最大页数返回空列表
      schema: { type: integer, minimum: 1, maximum: 100, default: 1 }
    PublicPageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Envelope:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: ok }
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 业务码，见 docs/07 第 4 节。message 为中文兜底文案，前台按 code 显示当前语言。
          enum:
            [BAD_REQUEST, NEED_LOGIN, NEED_VIP, TOKEN_EXPIRED, SIGNATURE_INVALID, FORBIDDEN, NOT_FOUND, CONFLICT,
             REAUTH_REQUIRED, CHALLENGE_REQUIRED, RATE_LIMITED, UNAVAILABLE, INTERNAL,
             ENC_REQUIRED, ENC_INVALID, ENC_KEY_UNKNOWN, ENC_TIME_SKEW]
        message: { type: string }
        request_id: { type: string }
    ApiEncPublicKey:
      type: object
      required: [kid, kem, kdf, aead, public_key]
      properties:
        kid: { type: string, example: k1 }
        kem: { type: string, example: "DHKEM(X25519, HKDF-SHA256)" }
        kdf: { type: string, example: HKDF-SHA256 }
        aead: { type: string, example: AES-256-GCM }
        public_key: { type: string, description: 32 字节 X25519 公钥，base64url 无填充 }
    SiteConfig:
      type: object
      required: [version, site, theme, layout, seo, age_gate, features, addresses, menus, footer_pages, updated_at]
      properties:
        version: { type: integer, format: int64 }
        site: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }
        layout: { type: object, additionalProperties: true }
        seo: { type: object, additionalProperties: true }
        age_gate: { type: object, additionalProperties: true }
        features:
          type: object
          additionalProperties: { type: boolean }
        addresses: { $ref: "#/components/schemas/SiteAddresses" }
        menus:
          type: array
          description: 前台菜单（S3-2）：只含启用且链接目标当前可见的项，按位置与顺序；visible_to 与 device 由前台判断
          items: { $ref: "#/components/schemas/PublicMenu" }
        footer_pages:
          type: array
          description: 页脚「帮助与条款」的静态页（已发布且标记为页脚页的，按创建顺序，最多 20 个）
          items: { $ref: "#/components/schemas/SiteFooterPage" }
        updated_at: { type: string, format: date-time }
    SiteFooterPage:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string, description: "前台地址 /p/{slug}" }
        title: { type: string }
    SiteAddresses:
      type: object
      description: 防丢地址「回家的路」（docs/04 第 14 节）。全部可留空，留空表示前台不显示该项；地址只收 http(s) 完整地址
      required: [notice, latest_url, permanent_url, backup_urls, publish_page, support_url, telegram, socials]
      additionalProperties: false
      properties:
        notice: { type: string, maxLength: 200, description: 提醒文字，如「请收藏永久地址」 }
        latest_url: { type: string, maxLength: 500 }
        permanent_url: { type: string, maxLength: 500 }
        backup_urls: { type: array, maxItems: 3, items: { type: string, maxLength: 500 } }
        publish_page: { type: string, maxLength: 500 }
        support_url: { type: string, maxLength: 500, description: 客服链接 }
        telegram: { type: string, maxLength: 500 }
        socials:
          type: array
          maxItems: 10
          description: 其他社交账号；名称与链接都要填（整行留空的忽略）
          items:
            type: object
            required: [name, url]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 20 }
              url: { type: string, maxLength: 500 }
    MenuPosition:
      type: string
      enum: [top, mobile_tabbar, mobile_drawer, footer]
      description: 顶部导航 / 手机底栏（最多 5 项）/ 手机侧边抽屉 / 页脚
    MenuLinkType:
      type: string
      enum: [internal, page, channel, topic, tag, external]
      description: internal 站内页白名单（home/shua/explore/rank/topic/search/me/way_home）；page/channel/topic/tag 为对应记录的 slug；external 为 http(s) 地址
    PublicMenu:
      type: object
      required: [id, position, label, link_type, link_value, group_title, icon, tabbar_icon, badge, visible_to, device, new_tab]
      properties:
        id: { type: integer, format: int64 }
        position: { $ref: "#/components/schemas/MenuPosition" }
        label: { type: string }
        link_type: { $ref: "#/components/schemas/MenuLinkType" }
        link_value: { type: string }
        group_title: { type: string, description: 页脚分组标题 }
        icon: { type: string, description: lucide 图标名；填错时前台按默认图标兜底 }
        tabbar_icon: { type: string }
        badge: { type: string }
        visible_to: { type: string, enum: [all, auth, guest], description: 由前台按登录态判断 }
        device: { type: string, enum: [all, mobile, desktop], description: 由前台按设备判断 }
        new_tab: { type: boolean }
    AdminSiteMenu:
      allOf:
        - $ref: "#/components/schemas/PublicMenu"
        - type: object
          required: [status, sort, created_at, updated_at, target_issue]
          properties:
            status: { type: string, enum: [active, inactive] }
            sort: { type: integer, description: 位置内的顺序，由 reorder 维护 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            target_issue:
              type: string
              description: 为空表示链接目标正常；否则是不可用的原因（如「静态页 terms 已删除」），前台不下发这一项，记录保留
    AdminSiteMenuRequest:
      type: object
      required: [position, label, link_type, link_value]
      additionalProperties: false
      properties:
        position: { $ref: "#/components/schemas/MenuPosition" }
        label: { type: string, minLength: 1, maxLength: 20 }
        link_type: { $ref: "#/components/schemas/MenuLinkType" }
        link_value: { type: string, maxLength: 500, description: 按链接类型校验；slug 类保存时转小写并校验目标存在（可以指向草稿，发布后自动出现） }
        group_title: { type: string, maxLength: 20, description: 只有 footer 保存，其他位置忽略 }
        icon: { type: string, maxLength: 40, description: lucide 图标名（字母、数字与连字符） }
        tabbar_icon: { type: string, maxLength: 40, description: 只有 mobile_tabbar 保存，其他位置忽略 }
        badge: { type: string, maxLength: 6 }
        visible_to: { type: string, enum: [all, auth, guest], default: all }
        device: { type: string, enum: [all, mobile, desktop], default: all }
        new_tab: { type: boolean, default: false }
        status: { type: string, enum: [active, inactive], default: active }
    # ---------- 页面区块（S3-1 / A3-1，迁移 00028） ----------
    BlockType:
      type: string
      enum: [carousel, feature, poster_grid, h_scroll, rank, topic_group, tag_cloud, ad, announce, custom_html]
      description: |
        carousel 轮播大图、feature 精选大卡、poster_grid 海报网格、h_scroll 横滑列表（这四种是剧类，要配来源）、
        rank 排行榜、topic_group 专题组、tag_cloud 标签云、ad 广告位、announce 公告条、custom_html 自定义 HTML。
    BlockSourceType:
      type: string
      enum: [manual, topic, auto]
      description: 剧类区块的来源方式：manual 手选编号、topic 用某个专题、auto 按规则自动选。非剧类区块恒为 auto。
    BlockSource:
      type: object
      description: 区块的来源与类型参数。只有该类型用得到的字段会被保存，响应里其余字段是零值。
      additionalProperties: false
      properties:
        drama_ids:
          type: array
          maxItems: 60
          items: { type: integer, format: int64 }
          description: 剧类 + manual：按这个顺序显示；剧必须存在且不在回收站（可以是草稿，发布后自动出现）
        topic_id: { type: integer, format: int64, description: 剧类 + topic：专题编号；专题是自动专题时沿用它的规则（条数用区块的 item_limit） }
        term_codes:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 32 }
          description: 剧类 + auto：筛选维度取值编号（与自动专题同一套规则，多个取值取交集）
        tag_id: { type: [integer, "null"], format: int64, description: 剧类 + auto：限定标签 }
        sort: { type: string, enum: ["", latest, hot, recommend], description: 剧类 + auto：排序，默认 latest }
        window: { type: string, enum: ["", all, 7d, 14d, 30d, 90d], description: 剧类 + auto：上新时间窗口，默认 all }
        rank_board: { type: string, enum: ["", drama_week, drama_month], description: rank：榜单（与运营的排行榜一致） }
        ad_slot: { type: string, description: ad：广告位置编码（与运营的广告位一致，如 home_top） }
        announce_kind: { type: string, enum: ["", topbar, popup], description: announce：公告方式，默认 topbar }
        topic_ids:
          type: array
          maxItems: 20
          items: { type: integer, format: int64 }
          description: topic_group：按这个顺序显示；留空取「列在专题列表页」的已发布专题
        tag_ids:
          type: array
          maxItems: 50
          items: { type: integer, format: int64 }
          description: tag_cloud：按这个顺序显示；留空取热门标签
    AdminBlock:
      type: object
      required: [id, page, type, title, subtitle, item_limit, status, more_link, cols_desktop, device,
                 source_type, source, custom_html, sort, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        page: { type: string, description: "home 或 channel:{频道 slug}" }
        type: { $ref: "#/components/schemas/BlockType" }
        title: { type: string }
        subtitle: { type: string }
        item_limit: { type: integer, description: 最多显示几项 }
        status: { type: string, enum: [active, inactive] }
        more_link: { type: string, description: 「查看全部」链接，空表示不显示 }
        cols_desktop: { type: integer, description: 电脑端每行个数 }
        device: { type: string, enum: [all, mobile, desktop] }
        source_type: { $ref: "#/components/schemas/BlockSourceType" }
        source: { $ref: "#/components/schemas/BlockSource" }
        custom_html: { type: string, description: 只有 custom_html 类型有值，已按白名单清洗 }
        sort: { type: integer, description: 页面内的顺序，由 reorder 维护 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminBlockRequest:
      type: object
      required: [page, type]
      additionalProperties: false
      properties:
        page: { type: string, maxLength: 72, description: "home 或 channel:{启用的频道 slug}；其他值 400" }
        type: { $ref: "#/components/schemas/BlockType" }
        title: { type: string, maxLength: 50 }
        subtitle: { type: string, maxLength: 100 }
        item_limit: { type: integer, minimum: 1, maximum: 60, default: 24 }
        status: { type: string, enum: [active, inactive], default: active }
        more_link: { type: string, maxLength: 500, description: 站内路径或 http(s) 地址 }
        cols_desktop: { type: integer, minimum: 2, maximum: 8, default: 6 }
        device: { type: string, enum: [all, mobile, desktop], default: all }
        source_type: { $ref: "#/components/schemas/BlockSourceType" }
        source: { $ref: "#/components/schemas/BlockSource" }
        custom_html: { type: string, maxLength: 20000, description: 只有 custom_html 类型保存；要 blocks.custom_html 权限 }
    BlockPageRef:
      type: object
      required: [value, label]
      properties:
        value: { type: string, description: "home 或 channel:{频道 slug}" }
        label: { type: string, description: 首页 / 频道名 }
    PublicBlock:
      type: object
      description: 下发给前台的一个区块。按类型只带该类型的数据字段，其余字段不出现。
      required: [id, type, title, subtitle, more_link, cols_desktop, device]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/BlockType" }
        title: { type: string }
        subtitle: { type: string }
        more_link: { type: string }
        cols_desktop: { type: integer }
        device: { type: string, enum: [all, mobile, desktop], description: 由前台按设备判断（电脑与手机共享一份缓存） }
        dramas:
          type: array
          items: { $ref: "#/components/schemas/DramaCard" }
          description: 剧类与排行榜区块的剧卡片
        rank_board: { type: string, description: rank：榜单编码 }
        topics:
          type: array
          items: { $ref: "#/components/schemas/TopicCard" }
          description: topic_group 的专题
        tags:
          type: array
          description: tag_cloud 的标签
          items:
            type: object
            required: [id, name, slug]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              slug: { type: string }
        ad_slot: { type: string, description: "ad：广告位置编码，素材另调 /api/v1/ads" }
        announce_kind: { type: string, description: "announce：公告方式，内容另调 /api/v1/announcements" }
        html: { type: string, description: custom_html：已清洗的 HTML，前台在沙箱 iframe 中渲染 }
    PublicHome:
      type: object
      required: [page, blocks]
      properties:
        page: { type: string, description: "home 或 channel:{频道 slug}（回显规范化后的值）" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/PublicBlock" }
          description: 只含启用且当次取到内容的区块，顺序即后台编排的顺序；没有区块时是空数组
    IdResult:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
    # ---------- 前台内容读接口（S1-4） ----------
    DramaCard:
      type: object
      description: 列表与推荐位的剧卡片。只有前台可见的剧会出现在这里，所以不带状态字段。
      required: [id, title, slug, cover_portrait, cover_landscape, badge, score, year, is_finished,
                 latest_episode, play_count, publish_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string, description: 未填时为空字符串 }
        cover_portrait: { type: string, description: 竖图相对路径（经图片线路拼成完整地址，docs/12） }
        cover_landscape: { type: string }
        badge: { type: string, description: "角标：预设 id（hot、new、exclusive、trending、preview、free、finished、vip）或自定义文案，空表示没有" }
        score: { type: [number, "null"], description: 评分，一位小数；未填为 null }
        year: { type: [integer, "null"] }
        is_finished: { type: boolean, description: 配合 latest_episode 显示「全 N 集」或「更新至 N 集」 }
        latest_episode: { type: integer, description: 可播放的最大集号；0 表示还没有可播放的分集 }
        play_count: { type: integer, format: int64, description: 播放次数（初始播放量 + 真实播放量） }
        publish_at: { type: [string, "null"], format: date-time, description: 上架时间 }
    DramaTag:
      type: object
      required: [id, name, slug, is_sensitive]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        is_sensitive: { type: boolean, description: 敏感标签：过年龄门才显示，所在页面输出 noindex }
    DramaTerm:
      type: object
      required: [id, name, slug, code, is_channel, taxonomy_id, taxonomy_name, taxonomy_slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        code: { type: string, description: 取值编号，空表示未设置 }
        is_channel: { type: boolean, description: "true 时有独立频道页 /api/v1/channels/{slug}" }
        taxonomy_id: { type: integer, format: int64 }
        taxonomy_name: { type: string }
        taxonomy_slug: { type: string }
    DramaEpisode:
      type: object
      required: [id, number, title, cover, duration_sec, access, trial_sec, playable]
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer }
        title: { type: string }
        cover: { type: string, description: 分集封面，没有时为转封装生成的首帧图 }
        duration_sec: { type: integer, description: 0 表示未知 }
        access: { type: string, enum: [free, login, vip] }
        trial_sec: { type: integer, description: 非会员可试看的秒数，0 表示不可试看 }
        playable: { type: boolean, description: 转封装完成才可播放；false 时前台显示「敬请期待」 }
    DramaDetail:
      allOf:
        - $ref: "#/components/schemas/DramaCard"
        - type: object
          required: [aliases, summary, seo_title, seo_desc, episode_count, tags, terms, episodes, related]
          properties:
            aliases: { type: array, items: { type: string } }
            summary: { type: string }
            episode_count: { type: integer, description: 分集总数（含未转封装的） }
            seo_title: { type: string, description: 空表示用前台的标题模板 }
            seo_desc: { type: string }
            tags: { type: array, items: { $ref: "#/components/schemas/DramaTag" }, description: 不含已隐藏或已合并的标签 }
            terms: { type: array, items: { $ref: "#/components/schemas/DramaTerm" }, description: 按维度顺序，不含已停用的取值 }
            episodes: { type: array, items: { $ref: "#/components/schemas/DramaEpisode" }, description: 按集号升序 }
            related: { type: array, items: { $ref: "#/components/schemas/DramaCard" }, description: 同标签或同取值召回，按共同项数与热度排序，最多 12 部 }
    Channel:
      type: object
      required: [id, name, slug, code, taxonomy_id, taxonomy_name, taxonomy_slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        code: { type: string }
        taxonomy_id: { type: integer, format: int64 }
        taxonomy_name: { type: string }
        taxonomy_slug: { type: string }
    ChannelPage:
      type: object
      required: [channel, list, total, page, page_size]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        list: { type: array, items: { $ref: "#/components/schemas/DramaCard" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    TagInfo:
      type: object
      required: [id, name, slug, canonical_slug, is_sensitive]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string, description: 请求用的 slug }
        canonical_slug: { type: string, description: 标签已被合并时为目标标签的 slug，否则与 slug 相同 }
        is_sensitive: { type: boolean }
    TagPage:
      type: object
      required: [tag, list, next_cursor, total]
      properties:
        tag: { $ref: "#/components/schemas/TagInfo" }
        list: { type: array, items: { $ref: "#/components/schemas/DramaCard" } }
        next_cursor: { type: [string, "null"], description: null 表示没有下一页 }
        total: { type: integer, format: int64 }
    FacetTerm:
      type: object
      required: [id, name, slug, code, is_channel]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        code: { type: string }
        is_channel: { type: boolean }
    FacetTaxonomy:
      type: object
      required: [id, name, slug, multi_select, terms]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string, description: "与取值 slug 拼成 terms 参数：<维度slug>:<取值slug>" }
        multi_select: { type: boolean, description: 是否可多选（多选时多个取值为「与」） }
        terms: { type: array, items: { $ref: "#/components/schemas/FacetTerm" } }
    ExploreFacets:
      type: object
      required: [taxonomies]
      properties:
        taxonomies:
          type: array
          description: 启用且「在探索页显示」的维度（按维度顺序），只含启用的取值
          items: { $ref: "#/components/schemas/FacetTaxonomy" }
    ExplorePage:
      type: object
      required: [list, next_cursor, total]
      properties:
        facets: { $ref: "#/components/schemas/ExploreFacets", description: 只在第一页（没有 cursor）返回 }
        list: { type: array, items: { $ref: "#/components/schemas/DramaCard" } }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, format: int64 }
    TopicCard:
      type: object
      required: [id, title, slug, summary]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
    TopicListPage:
      type: object
      required: [list, next_cursor, total]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/TopicCard" } }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, format: int64 }
    # ---------- 搜索（S3-4） ----------
    PublicSearchPage:
      type: object
      required: [query, list, next_cursor, total]
      properties:
        query: { type: string, description: 规范化后的搜索词（前台可用它回显） }
        list: { type: array, items: { $ref: "#/components/schemas/DramaCard" } }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, format: int64, description: 命中的可见剧总数 }
    PublicSuggestItem:
      type: object
      required: [id, title]
      properties:
        id: { type: integer, format: int64, description: "剧编号，前台按 /d/{id} 打开" }
        title: { type: string, description: 剧名原文（未转小写） }
    PublicSuggestPage:
      type: object
      required: [query, list]
      properties:
        query: { type: string, description: 规范化后的搜索词 }
        list: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/PublicSuggestItem" } }
    TopicFAQ:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
    TopicDetail:
      allOf:
        - $ref: "#/components/schemas/TopicCard"
        - type: object
          required: [source_type, faq, dramas]
          properties:
            source_type: { type: string, enum: [manual, auto], description: manual 手选（按后台顺序）、auto 按规则自动选 }
            faq: { type: array, items: { $ref: "#/components/schemas/TopicFAQ" } }
            dramas: { type: array, items: { $ref: "#/components/schemas/DramaCard" } }
    AdminPermissionCode:
      type: string
      pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
      maxLength: 64
      description: |
        权限点编码（docs/03 第 2.5 节、docs/adr/0006）：每个页面有 `<页面>.view` 查看、`<页面>.edit` 修改（只读页面没有 edit），
        另有特殊权限点 seo.analytics_code（统计代码，敏感）、blocks.custom_html、ads.custom_html（自定义 HTML）。
        目录见 GET /api/admin/permissions。
      example: dramas.edit
    AdminLoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 64, description: 不区分大小写 }
        password: { type: string, maxLength: 128, format: password }
    AdminUser:
      type: object
      required: [id, username, role, role_name, is_super, mfa_enabled]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, description: 角色编码。内置只有 superadmin，其余为后台新建的自定义角色, example: content_editor }
        role_name: { type: string, example: 内容编辑 }
        is_super: { type: boolean, description: 超级管理员角色拥有全部权限点（此时 permissions 为空数组） }
        mfa_enabled: { type: boolean, description: 是否已绑定二次验证（S2-6 起生效） }
    AdminSession:
      type: object
      required: [user, csrf_token, permissions]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        csrf_token: { type: string, description: 写请求放在 X-CSRF-Token 头；只存内存，不落盘 }
        permissions:
          type: array
          description: 当前角色已授予的权限点（排序后；只用于前端显示控制，后端会再次校验）。超级管理员为空数组，以 user.is_super 判断
          items: { $ref: "#/components/schemas/AdminPermissionCode" }
    AdminLoginResult:
      description: |
        登录第一步的结果。账号已启用二次验证时只含 mfa_required=true + 一次性票据（AdminMFAChallenge），
        不含会话；否则是会话（AdminLoginSession，同 /me 再加 mfa_required=false）。用 mfa_required 区分。
      oneOf:
        - $ref: "#/components/schemas/AdminMFAChallenge"
        - $ref: "#/components/schemas/AdminLoginSession"
    AdminMFAChallenge:
      type: object
      required: [mfa_required, mfa_ticket, mfa_methods]
      properties:
        mfa_required: { type: boolean, enum: [true], description: 恒为 true }
        mfa_ticket: { type: string, description: 一次性票据，调用 /api/admin/login/mfa 时带上，5 分钟内有效 }
        mfa_methods:
          type: array
          description: 该账号可用的二次验证方式
          items: { type: string, enum: [totp, passkey] }
    AdminLoginSession:
      allOf:
        - $ref: "#/components/schemas/AdminSession"
        - type: object
          required: [mfa_required]
          properties:
            mfa_required: { type: boolean, enum: [false], description: 无需二次验证或已通过 }
    AdminLoginMFARequest:
      type: object
      required: [mfa_ticket, method]
      additionalProperties: false
      properties:
        mfa_ticket: { type: string, maxLength: 64, description: 登录第一步返回的一次性票据 }
        method: { type: string, enum: [totp, passkey], description: 二次验证方式, example: totp }
        code: { type: string, maxLength: 16, description: method=totp 时的 6 位验证码, example: "123456" }
        response: { type: object, additionalProperties: true, description: method=passkey 时 startAuthentication 返回的断言响应 }
    AdminReauthRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: { type: string, enum: [totp, passkey], description: 重新验证方式, example: totp }
        code: { type: string, maxLength: 16, description: method=totp 时的 6 位验证码, example: "123456" }
        response: { type: object, additionalProperties: true, description: method=passkey 时 startAuthentication 返回的断言响应 }
    AdminWebAuthnOptions:
      type: object
      additionalProperties: true
      description: WebAuthn 创建 / 断言选项（PublicKeyCredential{Creation,Request}Options），原样交给 @simplewebauthn/browser。
    AdminPasskeyInfo:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    AdminTOTPSetup:
      type: object
      description: 开始绑定 TOTP 的结果（尚未启用，10 分钟内需用验证码确认）。
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Base32 种子，供在认证器中手动输入
          example: JBSWY3DPEHPK3PXP
        otpauth_url:
          type: string
          description: otpauth:// 地址，前端据此生成二维码供认证器扫码
          example: otpauth://totp/x-site%20%E8%BF%90%E8%90%A5%E5%90%8E%E5%8F%B0:alice?secret=JBSWY3DPEHPK3PXP&issuer=x-site%20%E8%BF%90%E8%90%A5%E5%90%8E%E5%8F%B0
    AdminTOTPVerifyRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 认证器当前显示的 6 位一次性验证码
          example: "123456"
    AdminNavNode:
      type: object
      description: 侧栏的一项。一级菜单可以是目录、页面或外链；二级菜单（目录的 children）是页面或外链，children 为空数组。
      required: [code, kind, title, path, icon, children]
      properties:
        code: { type: string, description: 页面的编码即页面编码（权限点前缀），如 dramas }
        kind: { type: string, enum: [group, page, link], description: group 目录、page 后台页面、link 外链（新窗口打开） }
        title: { type: string }
        path: { type: string, description: 页面为前端路由（如 /dramas），外链为完整地址，目录为空 }
        icon: { type: string, description: 图标名（前端图标表中的键），可为空 }
        children:
          type: array
          description: 目录下可见的二级菜单；页面与外链为空数组
          items: { $ref: "#/components/schemas/AdminNavNode" }
    AdminRoleRef:
      type: object
      required: [id, code, name, is_super]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        is_super: { type: boolean }
    AdminAccount:
      type: object
      required: [id, username, status, mfa_enabled, role, last_login_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        status:
          type: string
          enum: [unused, active, inactive]
          description: unused 为新建后从未登录（可以登录，首次登录后变为 active）；inactive 不能登录
        mfa_enabled: { type: boolean }
        role: { $ref: "#/components/schemas/AdminRoleRef" }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    AdminAccountList:
      type: object
      required: [list, total]
      properties:
        list:
          type: array
          items: { $ref: "#/components/schemas/AdminAccount" }
        total: { type: integer }
    AdminCreateRequest:
      type: object
      required: [username, password, role_id]
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 64
          description: 去掉首尾空白并转小写后 3–32 位，只能包含小写字母、数字、下划线、点和连字符
        password: { type: string, minLength: 8, maxLength: 128, format: password, description: 不能与用户名相同 }
        role_id: { type: integer, format: int64, minimum: 1 }
    AdminUpdateRequest:
      type: object
      required: [role_id, status]
      additionalProperties: false
      properties:
        role_id: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, inactive] }
    AdminPasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 8, maxLength: 128, format: password, description: 不能与用户名相同 }
    AdminRoleInfo:
      type: object
      required: [id, code, name, description, is_super, builtin, status, sort, member_count, permissions]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        is_super: { type: boolean, description: 超级管理员角色（唯一、内置），拥有全部权限点，permissions 为空数组 }
        builtin: { type: boolean, description: 内置角色（只有超级管理员）不能删除 }
        status: { type: string, enum: [active, inactive], description: 停用的角色其成员不能登录 }
        sort: { type: integer }
        member_count: { type: integer, format: int64 }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/AdminPermissionCode" }
    AdminRoleList:
      type: object
      required: [list, total]
      properties:
        list:
          type: array
          items: { $ref: "#/components/schemas/AdminRoleInfo" }
        total: { type: integer }
    AdminRoleUpdateRequest:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32, description: 去掉首尾空白后 1–32 个字 }
        description: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, inactive] }
        sort: { type: integer, format: int32, default: 0, description: 越小越靠前 }
    AdminRoleCreateRequest:
      type: object
      required: [code, name, status]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$', description: 角色编码，创建后不能改 }
        name: { type: string, minLength: 1, maxLength: 32, description: 去掉首尾空白后 1–32 个字 }
        description: { type: string, maxLength: 200 }
        status: { type: string, enum: [active, inactive] }
        sort: { type: integer, format: int32, default: 0, description: 越小越靠前 }
    AdminRolePermissionsRequest:
      type: object
      required: [codes]
      additionalProperties: false
      properties:
        codes:
          type: array
          maxItems: 1000
          description: 角色的全部权限点（整体替换）；空数组表示收回全部权限
          items: { $ref: "#/components/schemas/AdminPermissionCode" }
    AdminPermissionNode:
      type: object
      description: 权限树的节点。目录（kind=group）只有 children（其下的页面）；页面（kind=page，一级或二级）只有 permissions。
      required: [code, kind, title, permissions, children]
      properties:
        code: { type: string, description: 目录编码或页面编码 }
        kind: { type: string, enum: [group, page] }
        title: { type: string }
        permissions:
          type: array
          description: 页面的权限点（目录为空数组）
          items:
            type: object
            required: [code, name, sensitive]
            properties:
              code: { $ref: "#/components/schemas/AdminPermissionCode" }
              name: { type: string, example: 修改 }
              sensitive: { type: boolean, description: 高敏权限点（如统计代码、改线路），界面上需提示 }
        children:
          type: array
          description: 目录下的页面（页面为空数组）
          items: { $ref: "#/components/schemas/AdminPermissionNode" }
    AdminMenu:
      type: object
      required: [id, parent_id, kind, code, title, path, icon, sort, visible, builtin]
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: [integer, "null"], format: int64, description: 一级菜单为 null；二级菜单为所属目录的 ID }
        kind: { type: string, enum: [group, page, link], description: group 目录（只能是一级）、page 页面、link 外链 }
        code: { type: string, description: 内置菜单为固定编码；自定义菜单由服务端生成（c_ 开头） }
        title: { type: string }
        path: { type: string, description: 页面为前端路由（不能改），外链为完整地址，目录为空 }
        icon: { type: string }
        sort: { type: integer }
        visible: { type: boolean, description: 隐藏只影响侧栏显示，不收回权限 }
        builtin: { type: boolean, description: 内置菜单不能删除，只能隐藏 }
    AdminMenuList:
      type: object
      required: [list, total]
      properties:
        list:
          type: array
          items: { $ref: "#/components/schemas/AdminMenu" }
        total: { type: integer }
    AdminMenuRequest:
      type: object
      required: [title, visible]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [group, link], description: 新建时必填；修改时忽略 }
        parent_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: 上级目录的 ID；为空表示一级菜单。目录必须为空（只能是一级菜单）
        title: { type: string, minLength: 1, maxLength: 32, description: 去掉首尾空白后 1–32 个字 }
        path: { type: string, maxLength: 500, description: 外链必填，http:// 或 https:// 开头的完整地址；目录忽略；页面的路径不能改 }
        icon: { type: string, pattern: '^[A-Za-z0-9]{0,40}$', description: 图标名（前端图标表中的键），可为空 }
        sort: { type: integer, format: int32, default: 0, description: 越小越靠前 }
        visible: { type: boolean }
    # ---------- 内容管理（S1-3）----------
    ContentSlug:
      type: string
      pattern: '^$|^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
      description: 网址别名：小写字母、数字与连字符，不以连字符开头或结尾，最多 64 个字符
    ContentSlugInput:
      type: string
      maxLength: 64
      description: 去掉首尾空白并转小写后须满足 ContentSlug；留空时自动生成（剧集保持为空）
    AdminDrama:
      type: object
      required: [id, title, aliases, slug, summary, cover_portrait, cover_landscape, badge, score, year, status, display_status,
                 publish_at, is_finished, sort_weight, view_base, view_count, hot_score, latest_episode, seo_title, seo_desc, source,
                 created_at, updated_at]
      properties:
        id: { type: integer, format: int64, description: "剧编号（全站引用的 #ID）" }
        title: { type: string }
        aliases: { type: array, items: { type: string } }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        summary: { type: string }
        cover_portrait: { type: string, description: 竖封面（资源机路径） }
        cover_landscape: { type: string, description: 横封面（资源机路径） }
        badge: { type: string, description: "角标：预设 id 或自定义文案，可为空（取值见 DramaCard.badge）" }
        score: { type: [number, "null"], minimum: 0, maximum: 9.9, description: 评分（一位小数），未填为 null }
        year: { type: [integer, "null"] }
        status: { type: string, enum: [draft, published, offline] }
        display_status:
          type: string
          enum: [draft, published, scheduled, offline]
          description: 列表显示用的状态：已上架但 publish_at 未到为 scheduled（定时未到点，前台不可见）
        publish_at: { type: [string, "null"], format: date-time, description: 上架时间；在未来即定时上架 }
        is_finished: { type: boolean, description: 已完结 }
        sort_weight: { type: integer, description: 推荐排序值，越大越靠前 }
        view_base: { type: integer, format: int64, description: 初始播放量（热度排序时与真实播放量相加） }
        view_count: { type: integer, format: int64, description: 真实播放量（只读） }
        hot_score: { type: integer, format: int64, description: 热度分 = view_base + view_count（只读） }
        latest_episode: { type: integer, description: 「更新至 N 集」：最大集号（只读） }
        seo_title: { type: string }
        seo_desc: { type: string }
        source: { type: string, description: 来源标识（采集批次，只读） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminDramaPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminDrama" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminDramaTerm:
      type: object
      required: [id, taxonomy_id, taxonomy_name, multi_select, name, slug, status]
      properties:
        id: { type: integer, format: int64 }
        taxonomy_id: { type: integer, format: int64 }
        taxonomy_name: { type: string }
        multi_select: { type: boolean, description: 所属维度是否可多选 }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, inactive], description: 停用的取值前台不显示，编辑页需提示 }
    AdminDramaDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDrama"
        - type: object
          required: [tags, terms]
          properties:
            tags: { type: array, items: { $ref: "#/components/schemas/AdminTag" } }
            terms: { type: array, items: { $ref: "#/components/schemas/AdminDramaTerm" }, description: 按维度顺序、维度内按取值顺序 }
    AdminDramaCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: 去掉首尾空白后 1–200 个字 }
        aliases: { type: array, maxItems: 20, items: { type: string, maxLength: 100 }, description: 去掉空项与重复项 }
        slug: { $ref: "#/components/schemas/ContentSlugInput" }
        summary: { type: string, maxLength: 5000 }
        cover_portrait: { type: string, maxLength: 500 }
        cover_landscape: { type: string, maxLength: 500 }
        badge: { type: string, maxLength: 16, description: "角标：预设 id 或自定义文案（取值见 DramaCard.badge）" }
        score: { type: [number, "null"], minimum: 0, maximum: 9.9, description: 保留一位小数 }
        year: { type: [integer, "null"], minimum: 1900, maximum: 2100 }
        publish_at: { type: [string, "null"], format: date-time, description: 定时上架时间（上架后生效） }
        is_finished: { type: boolean, default: false }
        sort_weight: { type: integer, format: int32, default: 0 }
        view_base: { type: integer, format: int64, minimum: 0, default: 0 }
        seo_title: { type: string, maxLength: 200 }
        seo_desc: { type: string, maxLength: 500 }
    AdminDramaUpdateRequest:
      type: object
      required: [title, status]
      additionalProperties: false
      description: 整体保存剧资料：字段同新建，另加 status；未传的可选字段按默认值保存（如未传 aliases 即清空别名）
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        aliases: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        slug: { $ref: "#/components/schemas/ContentSlugInput" }
        summary: { type: string, maxLength: 5000 }
        cover_portrait: { type: string, maxLength: 500 }
        cover_landscape: { type: string, maxLength: 500 }
        badge: { type: string, maxLength: 16, description: "角标：预设 id 或自定义文案（取值见 DramaCard.badge）" }
        score: { type: [number, "null"], minimum: 0, maximum: 9.9 }
        year: { type: [integer, "null"], minimum: 1900, maximum: 2100 }
        status: { type: string, enum: [draft, published, offline], description: published 且 publish_at 为空时写入当前时间 }
        publish_at: { type: [string, "null"], format: date-time, description: 为空表示立即上架（或清除定时） }
        is_finished: { type: boolean, default: false }
        sort_weight: { type: integer, format: int32, default: 0 }
        view_base: { type: integer, format: int64, minimum: 0, default: 0 }
        seo_title: { type: string, maxLength: 200 }
        seo_desc: { type: string, maxLength: 500 }
    AdminTagIdsRequest:
      type: object
      required: [tag_ids]
      additionalProperties: false
      properties:
        tag_ids: { type: array, maxItems: 100, items: { type: integer, format: int64, minimum: 1 } }
    AdminTermIdsRequest:
      type: object
      required: [term_ids]
      additionalProperties: false
      properties:
        term_ids: { type: array, maxItems: 100, items: { type: integer, format: int64, minimum: 1 } }
    AdminDramaBulkRequest:
      type: object
      required: [ids, action]
      additionalProperties: false
      properties:
        ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer, format: int64, minimum: 1 } }
        action: { type: string, enum: [publish, offline, draft, add_tags, add_to_topic, set_terms] }
        tag_ids: { type: array, maxItems: 50, items: { type: integer, format: int64, minimum: 1 }, description: add_tags 必填 }
        topic_id: { type: integer, format: int64, minimum: 1, description: add_to_topic 必填，须为手选专题 }
        term_ids: { type: array, maxItems: 50, items: { type: integer, format: int64, minimum: 1 }, description: set_terms 必填 }
    AdminEpisode:
      type: object
      required: [id, drama_id, number, title, cover, duration_sec, access, trial_sec, media_status, video_object_id, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        drama_id: { type: integer, format: int64 }
        number: { type: integer, description: 集号 }
        title: { type: string }
        cover: { type: string }
        duration_sec: { type: integer, description: 时长（秒），0 表示未知 }
        access: { type: string, enum: [free, login, vip], description: 谁能看：免费 / 登录可看 / VIP（非会员按 trial_sec 试看） }
        trial_sec: { type: integer, description: 可试看秒数，0 为不试看 }
        media_status:
          type: string
          enum: [pending, transcoding, ready, failed]
          description: |
            视频状态（S1-5）：pending 没有视频；transcoding 第一次转封装中；ready 可播放；failed 转封装失败、没有可播放的视频。
            已是 ready 的分集重新转封装时保持 ready（旧产物继续可播），进度看 /api/admin/transcode-jobs。
        video_object_id: { type: [integer, "null"], format: int64, description: 当前使用的视频对象（转封装完成后写入）；没有视频时为 null }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminEpisodeList:
      type: object
      required: [list, total]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminEpisode" } }
        total: { type: integer }
    AdminMediaUploadInitRequest:
      type: object
      required: [purpose, mime, size_bytes]
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [drama_cover, episode_cover, announcement_image, ad_image, ad_poster, feedback_project_cover, static_page_image, episode_video, ad_video]
          description: 决定写入类型、目标前缀与所需后台修改权限
        mime:
          type: string
          enum: [image/webp, image/avif, video/mp4, video/quicktime, video/webm, video/x-matroska]
        image_format:
          type: string
          enum: [webp, avif]
          description: 图片必填且必须与 mime 对应；视频留空
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 4294967296, description: 图片最大 15728640（15 MiB）；视频最大 4294967296（4 GiB） }
        episode_id: { type: integer, format: int64, minimum: 1, description: 仅 purpose=episode_video 必填 }
    AdminMediaUpload:
      type: object
      required: [id, provider_id, purpose, kind, mime, image_format, size_bytes, source_key, output_key, episode_id, transcode_job_id, status, progress, error, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: integer, format: int64, description: 创建会话时固定的 storage_provider 编号；物理目标快照仅服务端使用 }
        purpose: { type: string, enum: [drama_cover, episode_cover, announcement_image, ad_image, ad_poster, feedback_project_cover, static_page_image, episode_video, ad_video] }
        kind: { type: string, enum: [image, video] }
        mime: { type: string }
        image_format: { type: string, enum: ["", webp, avif] }
        size_bytes: { type: integer, format: int64 }
        source_key: { type: string, description: 图片为最终 img/ key；视频为私有 video/source/ key }
        output_key: { type: string, description: 图片 ready 后为 img/ key；广告视频 ready 后为 video/assets/.../master.m3u8；其他状态为空 }
        episode_id: { type: integer, format: int64, description: 非分集视频为 0 }
        transcode_job_id: { type: [string, "null"], format: uuid, description: 分集视频提交后关联的既有转封装任务 }
        status: { type: string, enum: [created, uploading, uploaded, queued, running, ready, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string, description: 最后一次视频转码错误；成功或未失败时为空 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminMediaUploadContent:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [uploaded] }
    AdminTranscodeRequest:
      type: object
      additionalProperties: false
      properties:
        source_key:
          type: string
          maxLength: 1024
          description: |
            源文件在 MEDIA_SOURCE_BUCKET 中的相对路径（本地测试素材如 fixtures/f01-portrait-1080p30.mp4）；
            不能以 / 开头，不能含 . 或 .. 路径段、空路径段、反斜杠与控制字符。留空沿用该集上一个任务的源文件。
        force: { type: boolean, default: false, description: 源文件没有变化也重新转码 }
    AdminTranscodeRendition:
      type: object
      required: [name, width, height, bitrate, peak_bitrate, codecs]
      properties:
        name: { type: string, description: v + 短边，如 v720；也是该档清单的文件名（v720.m3u8） }
        width: { type: integer }
        height: { type: integer }
        bitrate: { type: integer, format: int64, description: 平均码率（bps，含音频） }
        peak_bitrate: { type: integer, format: int64, description: 峰值码率（bps，主清单 BANDWIDTH，RFC 8216 第 4.3.4.2 节） }
        codecs: { type: string, description: RFC 6381 编码，如 avc1.64001f,mp4a.40.2（没有音轨时只有视频） }
    AdminTranscodeJob:
      type: object
      required: [id, episode_id, drama_id, episode_number, source_key, force, status, progress, attempts, error, source_hash,
        key_ver, renditions, poster, duration_sec, created_at, started_at, finished_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 任务编号（UUIDv7） }
        episode_id: { type: integer, format: int64 }
        drama_id: { type: integer, format: int64 }
        episode_number: { type: integer, description: 集号 }
        source_key: { type: string }
        force: { type: boolean }
        status:
          type: string
          enum: [queued, running, succeeded, skipped, failed]
          description: queued 排队中或本次尝试失败后等待重试；running 转码中；succeeded 已切换到新产物；skipped 源文件与当前产物相同，没有重新转码；failed 不可恢复的错误或重试用尽
        progress: { type: integer, minimum: 0, maximum: 100 }
        attempts: { type: integer, description: 已开始的尝试次数（最多 4 次） }
        error: { type: string, description: 最近一次失败的原因（中文），成功或进行中为空 }
        source_hash: { type: string, description: 源文件 SHA-256（十六进制），下载后才有 }
        key_ver: { type: integer, description: 本次产物的内容密钥版本，成功后才有（否则 0） }
        renditions: { type: array, items: { $ref: "#/components/schemas/AdminTranscodeRendition" }, description: 本次产物的码率阶梯（从低到高），成功后才有 }
        poster: { type: string, description: 首帧图（WebP）在图片存储中的相对 key，成功后才有 }
        duration_sec: { type: integer, description: 源时长（秒，四舍五入），成功后才有 }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time, description: 运行中每分钟至少更新一次（心跳） }
    AdminEpisodePreview:
      type: object
      required: [episode_id, drama_id, line_id, line_name, url, expires_at]
      properties:
        episode_id: { type: integer, format: int64 }
        drama_id: { type: integer, format: int64 }
        line_id: { type: integer, format: int64, description: 试播用的线路（选线打分最高的那条，不按地区） }
        line_name: { type: string }
        url:
          type: string
          description: 后台主清单地址，形如 /api/admin/preview/{token}/index.m3u8（同源、不加密、走后台会话）
        expires_at: { type: string, format: date-time, description: 令牌过期时间（签发后十分钟） }
    AdminTranscodeJobPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminTranscodeJob" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminEpisodeRequest:
      type: object
      required: [number]
      additionalProperties: false
      properties:
        number: { type: integer, minimum: 1, maximum: 100000 }
        title: { type: string, maxLength: 200 }
        cover: { type: string, maxLength: 500 }
        duration_sec: { type: integer, minimum: 0, maximum: 86400, default: 0 }
        access: { type: string, enum: [free, login, vip], default: free }
        trial_sec: { type: integer, minimum: 0, maximum: 86400, default: 0, description: 时长大于 0 时不能超过时长 }
    AdminTag:
      type: object
      required: [id, name, slug, is_hidden, status, merged_into_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        is_hidden: { type: boolean, description: 敏感标签：过年龄门才显示、不被搜索引擎收录 }
        status: { type: string, enum: [active, hidden], description: hidden 不在前台显示 }
        merged_into_id: { type: [integer, "null"], format: int64, description: "已并入的标签（显示「已并入 #ID」）；未合并为 null" }
        created_at: { type: string, format: date-time }
    AdminTagPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminTag" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        slug: { $ref: "#/components/schemas/ContentSlugInput" }
        is_hidden: { type: boolean, default: false }
        status: { type: string, enum: [active, hidden], default: active }
    AdminTagMergeRequest:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        target_id: { type: integer, format: int64, minimum: 1, description: 目标标签（不能是自己或已被合并的标签） }
    AdminTerm:
      type: object
      required: [id, taxonomy_id, name, slug, status, is_channel, code, sort]
      properties:
        id: { type: integer, format: int64 }
        taxonomy_id: { type: integer, format: int64 }
        name: { type: string }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        status: { type: string, enum: [active, inactive] }
        is_channel: { type: boolean, description: 有独立频道页 /c/:slug }
        code: { type: string, description: 编号（区块与专题规则引用），空为未设置 }
        sort: { type: integer }
    AdminTaxonomy:
      type: object
      required: [id, name, slug, multi_select, show_in_explore, status, sort, terms]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        multi_select: { type: boolean }
        show_in_explore: { type: boolean }
        status: { type: string, enum: [active, inactive] }
        sort: { type: integer }
        terms: { type: array, items: { $ref: "#/components/schemas/AdminTerm" }, description: 按排序值 }
    AdminTaxonomyList:
      type: object
      required: [list, total]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminTaxonomy" } }
        total: { type: integer }
    AdminTaxonomyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        slug: { $ref: "#/components/schemas/ContentSlugInput" }
        multi_select: { type: boolean, default: false }
        show_in_explore: { type: boolean, default: true }
        status: { type: string, enum: [active, inactive], default: active }
    AdminTermRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        slug: { $ref: "#/components/schemas/ContentSlugInput" }
        status: { type: string, enum: [active, inactive], default: active }
        is_channel: { type: boolean, default: false }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{0,32}$', description: 填写时全站唯一 }
    AdminReorderRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids: { type: array, minItems: 1, maxItems: 1000, items: { type: integer, format: int64, minimum: 1 }, description: 新顺序的全部 ID }
    AdminTopicRule:
      type: object
      required: [term_codes, tag_id, sort, window, limit]
      description: 自动专题的选剧规则（S1-4 执行）：同时满足全部取值编号与标签的已上架剧，按 sort 排序取前 limit 部
      properties:
        term_codes: { type: array, items: { type: string }, description: 取值编号（AdminTerm.code） }
        tag_id: { type: [integer, "null"], format: int64 }
        sort: { type: string, enum: [latest, hot, recommend] }
        window: { type: string, enum: [all, 7d, 14d, 30d, 90d], description: 上新时间窗口 }
        limit: { type: integer, minimum: 1, maximum: 60 }
    AdminTopicRuleInput:
      type: object
      additionalProperties: false
      properties:
        term_codes: { type: array, maxItems: 10, items: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' } }
        tag_id: { type: [integer, "null"], format: int64, minimum: 1 }
        sort: { type: string, enum: [latest, hot, recommend], default: latest }
        window: { type: string, enum: [all, 7d, 14d, 30d, 90d], default: all }
        limit: { type: integer, minimum: 1, maximum: 60, default: 24 }
    AdminTopicFAQ:
      type: object
      required: [question, answer]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 200 }
        answer: { type: string, minLength: 1, maxLength: 2000 }
    AdminTopic:
      type: object
      required: [id, title, slug, summary, status, source_type, rule, faq, list_in_index, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { $ref: "#/components/schemas/ContentSlug" }
        summary: { type: string }
        status: { type: string, enum: [draft, published] }
        source_type: { type: string, enum: [manual, auto], description: manual 手选、auto 按规则自动选 }
        rule: { $ref: "#/components/schemas/AdminTopicRule" }
        faq: { type: array, items: { $ref: "#/components/schemas/AdminTopicFAQ" } }
        list_in_index: { type: boolean, description: 列在专题列表页 }
        created_at: { type: string, format: date-time }
    AdminTopicPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminTopic" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminTopicDrama:
      type: object
      required: [id, title, status, display_status, publish_at, cover_portrait]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string, enum: [draft, published, offline] }
        display_status: { type: string, enum: [draft, published, scheduled, offline] }
        publish_at: { type: [string, "null"], format: date-time }
        cover_portrait: { type: string }
    AdminTopicDetail:
      allOf:
        - $ref: "#/components/schemas/AdminTopic"
        - type: object
          required: [dramas]
          properties:
            dramas: { type: array, items: { $ref: "#/components/schemas/AdminTopicDrama" }, description: 手选的剧（按展示顺序） }
    AdminTopicRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        slug: { $ref: "#/components/schemas/ContentSlugInput" }
        summary: { type: string, maxLength: 2000 }
        status: { type: string, enum: [draft, published], default: draft }
        source_type: { type: string, enum: [manual, auto], default: manual }
        rule: { $ref: "#/components/schemas/AdminTopicRuleInput" }
        faq: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AdminTopicFAQ" } }
        list_in_index: { type: boolean, default: true }
    AdminTopicDramasRequest:
      type: object
      required: [drama_ids]
      additionalProperties: false
      properties:
        drama_ids: { type: array, maxItems: 500, items: { type: integer, format: int64, minimum: 1 }, description: 展示顺序；空数组清空 }
    # ---------- 用户端选线（S1-6d，docs/12 第 4.4、6.2 节）----------
    PublicLine:
      type: object
      required: [line_id, name, region_tag, recommended, probe_url]
      properties:
        line_id: { type: integer, format: int64 }
        name: { type: string, description: 线路名；为空时由客户端显示为「线路 N」 }
        region_tag: { type: string, description: 本地区 / 通用 }
        recommended: { type: boolean, description: 是否为首选（自动模式默认用它） }
        probe_url: { type: string, description: 测速地址（base_url + probe_path）；直连存储的线路为空串，不参与测速 }
    LineListResult:
      type: object
      required: [region, lines, ttl]
      properties:
        region: { type: string, description: 解析出的地区标签，如 CN-广东-电信；未知地区为 XX }
        lines:
          type: array
          description: 已排序的候选线路，第一条为首选
          items: { $ref: "#/components/schemas/PublicLine" }
        ttl: { type: integer, description: 客户端可缓存的秒数 }
    LineReportItem:
      type: object
      required: [line_id, event]
      properties:
        line_id: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [video, image] }
        event: { type: string, enum: [probe, first_frame, stall, error, switch] }
        ms: { type: integer, format: int32, description: probe / first_frame 的耗时（毫秒）；缺失或非正数时不计入首帧均值 }
        reason: { type: string, enum: [timeout, http_4xx, http_5xx, cors, decode], description: event=error 时的原因 }
        to_line_id: { type: integer, format: int64, description: event=switch 时切换到的线路 }
        trigger: { type: string, description: event=switch 时的触发原因，如 auto_stall }
    LineReportRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: 超过 100 条时只处理前 100 条
          items: { $ref: "#/components/schemas/LineReportItem" }
    LineReportAck:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer, description: 实际接受并聚合的条数（被限流丢弃或非法的条目不计入） }
    # ---------- 选源（S1-7，docs/03 第 4.1 节、docs/12 第 4.4 节）----------
    PlaybackSourceLine:
      type: object
      required: [line_id, name, region_tag, recommended, manual, url, expires_at]
      properties:
        line_id: { type: integer, format: int64 }
        name: { type: string, description: 线路名；为空时由客户端显示为「线路 N」 }
        region_tag: { type: string, description: 本地区 / 通用 }
        recommended: { type: boolean, description: 算法排第一的线路（手选线路置顶时它排在第二） }
        manual: { type: boolean, description: 是否为本次请求的手选线路（line_id），手选生效时排第一 }
        url:
          type: string
          description: 清单地址，同源加密接口（S1-8），形如 /api/v1/hls/{令牌}/index.m3u8；令牌不透明，不要解析或拼接
          example: /api/v1/hls/k1.eyJlIjo0MiwibCI6MTJ9.Q2xh.../index.m3u8
        expires_at: { type: string, format: date-time, description: 令牌过期时间（签发后 10 分钟） }
    PlaybackSources:
      type: object
      required: [episode_id, region, access, trial_sec, lines]
      properties:
        episode_id: { type: integer, format: int64 }
        region: { type: string, description: 解析出的地区标签，如 CN-广东-电信；未知地区为 XX }
        access: { type: string, enum: [free, login, vip], description: 分集的观看权限；试看结束后前台据此显示登录墙（login）或 VIP 墙（vip） }
        trial_sec: { type: integer, description: 0 表示完整播放；大于 0 表示只能试看这么多秒（S1-8 的清单只含这段切片） }
        lines:
          type: array
          minItems: 1
          description: 已排序的候选线路，自动模式用第一条，卡顿或失败时依次切换
          items: { $ref: "#/components/schemas/PlaybackSourceLine" }
    # ---------- 用户端身份（S1-10，docs/03 第 2 节、docs/10 第 4 节）----------
    GuestAuthRequest:
      type: object
      additionalProperties: false
      description: 游客签发参数，全部可选；请求体也可为空。
      properties:
        platform: { type: string, enum: [web, ios, android], description: 来源平台；不在枚举内或缺省时按 web }
        source_channel: { type: string, maxLength: 64, description: 来源渠道（投放追踪用，可空） }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 512, description: 上一次签发或刷新返回的 refresh_token }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, role]
      description: 一次签发或刷新的结果。明文令牌只在响应体里出现，不入日志、不落库。
      properties:
        access_token: { type: string, description: 无状态 JWT（JWS 紧凑格式，EdDSA/Ed25519，头部带 kid；载荷 sub/sid/role/iat/exp，固定只接受 alg=EdDSA） }
        refresh_token: { type: string, description: 256 bit 随机串；服务端只存其 SHA-256，游客有效期 180 天，每次刷新轮换 }
        token_type: { type: string, enum: [Bearer], description: 固定 Bearer }
        expires_in: { type: integer, description: access_token 有效秒数（15 分钟 = 900） }
        device_id: { type: string, format: uuid, description: 游客设备 ID（UUIDv7）；注册用户签发时不返回 }
        role: { type: string, enum: [guest, user], description: 令牌主体角色；S1-10 一律 guest，注册用户登录（S2-1）起为 user }
    RegisterRequest:
      type: object
      required: [username, password, ack_no_recovery]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_]{3,32}$', description: 大小写不敏感，库中存小写；展示名另见 nickname }
        password: { type: string, minLength: 8, maxLength: 128, description: 不在常见弱口令表、非纯数字、不等于用户名 }
        nickname: { type: string, maxLength: 40, description: 展示名，可空（空时展示回退用户名） }
        ack_no_recovery: { type: boolean, description: 必须为 true：确认知悉忘记密码无法找回（adr/0001），否则 400 }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 32 }
        password: { type: string, maxLength: 128 }
        challenge:
          description: 登录失败过多后（428 CHALLENGE_REQUIRED）必须带上，由 GET /api/v1/auth/challenge 求解得到
          $ref: "#/components/schemas/ChallengeAnswer"
    AuthChallenge:
      type: object
      required: [nonce, difficulty, expires_in, algorithm]
      description: 人机验证挑战（PoW）。客户端求 solution 使 SHA-256(nonce + ":" + solution) 的前 difficulty 个 bit 为 0。
      properties:
        nonce: { type: string, description: 一次性随机串 }
        difficulty: { type: integer, description: 要求的前导零 bit 数 }
        expires_in: { type: integer, description: 有效秒数 }
        algorithm: { type: string, enum: [sha256-leading-zero-bits] }
    ChallengeAnswer:
      type: object
      required: [nonce, solution]
      additionalProperties: false
      properties:
        nonce: { type: string, description: 来自 GET /api/v1/auth/challenge 的 nonce }
        solution: { type: string, maxLength: 64, description: 求得的解 }
    UserBrief:
      type: object
      required: [id, username, nickname, avatar, status]
      description: 用户概要（不含密码哈希等内部字段）。
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        status: { type: string, enum: [normal, muted, banned] }
    AuthAccount:
      type: object
      required: [user, access_token, refresh_token, token_type, expires_in, role]
      description: 注册 / 登录结果：用户概要 + 令牌。注册用户 role=user，Refresh 30 天滑动。
      properties:
        user: { $ref: "#/components/schemas/UserBrief" }
        access_token: { type: string, description: 无状态 JWT（EdDSA/Ed25519，15 分钟） }
        refresh_token: { type: string, description: 256 bit 随机串；服务端只存 SHA-256，注册用户 30 天滑动，每次刷新轮换 }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: access_token 有效秒数（900） }
        role: { type: string, enum: [user] }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      additionalProperties: false
      properties:
        old_password: { type: string, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128, description: 规则同注册（弱口令 / 纯数字 / 与当前密码相同都拒绝） }
    MeSession:
      type: object
      required: [id, platform, current, created_at, last_seen_at]
      description: 我的设备（会话）摘要，不含令牌。
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [web, ios, android] }
        ua_digest: { type: string, description: UA 摘要（非原始 UA） }
        ip_prefix: { type: string, description: IP 前缀（非完整 IP） }
        current: { type: boolean, description: 是否当前请求所用的会话 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    # ---------- 会员核心（S3-10）----------
    VIPPlan:
      type: object
      required: [id, code, duration_days, price_fen, list_price_fen, price_micro_usdt, badge_key, recommended, channels]
      description: 已上架且允许当前客户端购买的会员套餐；名称按 code 由客户端多语言文案渲染，金额均为整数最小单位。
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, enum: [day, week, month, quarter, year] }
        duration_days: { type: integer, minimum: 1 }
        price_fen: { type: integer, format: int64, minimum: 0, description: 人民币分 }
        list_price_fen: { type: integer, format: int64, minimum: 0, description: 人民币划线价（分）；0 表示不展示 }
        price_micro_usdt: { type: integer, format: int64, minimum: 0, description: USDT 微单位（10^-6） }
        badge_key: { type: string, description: 用户端多语言角标键；空串表示无角标 }
        recommended: { type: boolean }
        channels:
          type: array
          items: { type: string, enum: [alipay, wechat, usdt, iap_apple, iap_google] }
    VIPStatus:
      type: object
      required: [is_vip, expire_at]
      properties:
        is_vip: { type: boolean, description: expire_at 晚于当前服务端时间时为 true }
        expire_at: { type: [string, "null"], format: date-time, description: 从未开通为 null；已过期仍返回实际到期时间 }
    CreatePayOrderRequest:
      type: object
      required: [product, channel, client]
      additionalProperties: false
      properties:
        product:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type: { type: string, enum: [vip_plan] }
            id: { type: integer, format: int64, minimum: 1 }
        channel: { type: string, enum: [alipay, wechat, usdt, iap_apple, iap_google] }
        client: { type: string, enum: [web_pc, web_mobile, app_official, app_store] }
        return_path: { type: string, maxLength: 500, description: 支付成功后前台建议回跳的站内路径；当前模拟模式不使用 }
    PayOrder:
      type: object
      required: [order_no, product_type, product_id, product_snapshot, channel, client, currency, amount, status, expire_at, paid_at, late, created_at]
      properties:
        order_no: { type: string }
        product_type: { type: string, enum: [vip_plan] }
        product_id: { type: integer, format: int64 }
        product_snapshot: { type: object, additionalProperties: true }
        channel: { type: string, enum: [alipay, wechat, usdt, iap_apple, iap_google] }
        client: { type: string, enum: [web_pc, web_mobile, app_official, app_store] }
        currency: { type: string, enum: [CNY, USDT] }
        amount: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [pending, paid, closed, refunded] }
        expire_at: { type: string, format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        late: { type: boolean }
        created_at: { type: string, format: date-time }
    MockPayAction:
      type: object
      required: [type, complete_endpoint]
      description: 仅 development 下创建订单时返回；production 不下发。
      properties:
        type: { type: string, enum: [mock] }
        complete_endpoint: { type: string, description: development 专用模拟完成地址 }
    # ---------- 个人中心（S2-3，docs/13 第 2 节）----------
    MeState:
      type: object
      required: [user, unread]
      description: 登录态 + 身份 + 未读数（GET /api/v1/me/state）。
      properties:
        user:
          type: object
          required: [id, nickname, avatar]
          properties:
            id: { type: integer, format: int64 }
            nickname: { type: string }
            avatar: { type: string, description: 头像引用（预设 key 或已上传对象 key），可为空 }
        unread: { type: integer, description: 未读消息数 }
    MeProfile:
      type: object
      required: [nickname, avatar, bio, nickname_status, bio_status, avatar_status]
      description: 可编辑资料。*_status 为内容审核状态（S2-3 恒为 ok，审核随 S2-9）。
      properties:
        nickname: { type: string }
        avatar: { type: string }
        bio: { type: string }
        nickname_status: { type: string, enum: [ok, pending, rejected] }
        bio_status: { type: string, enum: [ok, pending, rejected] }
        avatar_status: { type: string, enum: [ok, pending, rejected] }
        locale: { type: string, description: 界面语言偏好，可空 }
    ProfilePatchRequest:
      type: object
      additionalProperties: false
      description: PATCH 语义：只改出现的字段，缺省不动，传空串表示清空。
      properties:
        nickname: { type: string, maxLength: 40, description: 去首尾空白、折叠空白、去控制字符后 ≤ 40 字 }
        avatar: { type: string, maxLength: 500, description: 头像引用（预设 key 或已上传对象 key） }
        bio: { type: string, maxLength: 80, description: 纯文本，最多 2 个换行、≤ 80 字 }
    FollowItem:
      type: object
      required:
        [
          id,
          title,
          slug,
          cover_portrait,
          cover_landscape,
          badge,
          score,
          year,
          is_finished,
          latest_episode,
          play_count,
          publish_at,
          watched_episode,
          followed_at,
        ]
      description: 追剧列表的一项（剧卡片字段 + 这个用户的观看进度）。
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        cover_portrait: { type: string, description: 竖版封面引用 }
        cover_landscape: { type: string, description: 横版封面引用 }
        badge: { type: string, description: "角标：预设 id 或自定义文案，空串表示没有（取值见 DramaCard.badge）" }
        score: { type: [number, "null"], description: 评分，一位小数；未填为 null }
        year: { type: [integer, "null"] }
        is_finished: { type: boolean }
        latest_episode: { type: integer, description: 前台可见的最新集号（更新至 N 集） }
        play_count: { type: integer, format: int64 }
        publish_at: { type: [string, "null"], format: date-time }
        watched_episode: { type: integer, description: 这个用户看到第几集；0 表示还没看过 }
        followed_at: { type: string, format: date-time, description: 收藏时间，列表按它倒序 }
    HistoryItem:
      type: object
      required: [drama_id, title, cover, episode_id, episode_number, position_sec, duration_sec, latest_episode, updated_at]
      description: 续播列表的一项（剧卡片字段 + 续播断点）。
      properties:
        drama_id: { type: integer, format: int64 }
        title: { type: string }
        cover: { type: string, description: 竖版封面引用 }
        episode_id: { type: integer, format: int64 }
        episode_number: { type: integer, description: 看到第几集 }
        position_sec: { type: integer, description: 续播位置（秒） }
        duration_sec: { type: integer, description: 该集时长（秒） }
        latest_episode: { type: integer, description: 该剧前台可见的最新集号（更新至 N 集） }
        updated_at: { type: string, format: date-time }
    HistoryReportRequest:
      type: object
      required: [items]
      additionalProperties: false
      description: 续播断点批量上报；单次最多 100 条，非法条目跳过。
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HistoryEntry" }
    HistoryEntry:
      type: object
      required: [drama_id, episode_id]
      additionalProperties: false
      properties:
        drama_id: { type: integer, format: int64 }
        episode_id: { type: integer, format: int64 }
        episode_number: { type: integer }
        position_sec: { type: integer, minimum: 0 }
        duration_sec: { type: integer, minimum: 0 }
    FollowRequest:
      type: object
      required: [drama_id]
      additionalProperties: false
      properties:
        drama_id: { type: integer, format: int64 }
    LikeRequest:
      type: object
      required: [target_type, target_id]
      additionalProperties: false
      properties:
        target_type: { type: string, enum: [drama, episode] }
        target_id: { type: integer, format: int64 }
    Notification:
      type: object
      required: [id, type, payload, is_read, created_at]
      description: 一条站内信。payload 结构按 type 不同（来源由后续里程碑产出）。
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [reply, like, update] }
        payload: { type: object, additionalProperties: true }
        is_read: { type: boolean }
        created_at: { type: integer, format: int64, description: unix 秒 }
    # ---------- 存储源（S1-6a，docs/12）----------
    AdminStorageProvider:
      type: object
      required: [id, name, type, subtype, purpose, role, endpoint, region, bucket, account_id, path_style, path_prefix, has_write_cred, has_read_cred, cred_tail, read_cred_tail, max_presign_ttl, status, created_at, updated_at]
      description: 存储源展示信息。凭据只写不读：只给出是否已配置（has_write_cred / has_read_cred）与 secret 末 4 位（cred_tail），不含明文。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [s3, r2, custom], description: s3 AWS/兼容云存储 / r2 Cloudflare R2 / custom 自建 }
        subtype: { type: string, enum: ["", s3_compatible, http_origin], description: 仅 custom：s3_compatible 走 S3 协议，http_origin 只读 HTTP 源 }
        purpose: { type: string, enum: [video, image, both] }
        role: { type: string, enum: [primary, mirror, readonly] }
        endpoint: { type: string, description: 访问端点；r2 自动生成，http_origin 为 base_url }
        region: { type: string }
        bucket: { type: string }
        account_id: { type: string, description: 仅 r2 }
        path_style: { type: boolean }
        path_prefix: { type: string }
        has_write_cred: { type: boolean, description: 是否已配置读写凭据 }
        has_read_cred: { type: boolean, description: 是否已配置只读凭据（预签名用，未配置时回退到读写凭据） }
        cred_tail: { type: string, description: 读写凭据 secret 末 4 位（显示用） }
        read_cred_tail: { type: string }
        max_presign_ttl: { type: integer, description: 预签名最长有效期（秒），60–604800 }
        status: { type: string, enum: [active, draining, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminStorageProviderPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminStorageProvider" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminStorageCredential:
      type: object
      required: [access_key_id, secret_access_key]
      additionalProperties: false
      description: 一组访问凭据（只写不读）。编辑时整组省略、或两字段都为空，表示保持原值不变。
      properties:
        access_key_id: { type: string, maxLength: 512 }
        secret_access_key: { type: string, maxLength: 1024 }
    AdminStorageProviderRequest:
      type: object
      required: [name, type, purpose, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [s3, r2, custom] }
        subtype: { type: string, enum: ["", s3_compatible, http_origin], description: 仅 custom 必填；其它类型留空 }
        purpose: { type: string, enum: [video, image, both] }
        role: { type: string, enum: [primary, mirror, readonly] }
        endpoint: { type: string, description: s3 可选；r2 忽略（自动生成）；custom/s3_compatible 必填；http_origin 为 base_url }
        region: { type: string, description: s3 必填；r2 固定 auto；s3_compatible 缺省 us-east-1 }
        bucket: { type: string, description: s3/r2/s3_compatible 必填（3–63 位小写字母数字点连字符）；http_origin 不填 }
        account_id: { type: string, description: 仅 r2，32 位十六进制 }
        path_style: { type: boolean, default: false }
        path_prefix: { type: string, maxLength: 256, description: 桶内前缀，如 media/ }
        max_presign_ttl: { type: integer, minimum: 60, maximum: 604800, default: 600 }
        status: { type: string, enum: [active, draining, disabled], default: active }
        write_cred:
          allOf: [{ $ref: "#/components/schemas/AdminStorageCredential" }]
          description: 读写凭据（上传、复制、删除）。新建时除 http_origin 外必填；修改时省略或留空表示不变。
        read_cred:
          allOf: [{ $ref: "#/components/schemas/AdminStorageCredential" }]
          description: 只读凭据（预签名），可选；省略或留空表示不变。
    AdminStorageProbeResult:
      type: object
      required: [ok, elapsed_ms, steps]
      properties:
        ok: { type: boolean, description: 全部步骤成功 }
        elapsed_ms: { type: integer, format: int64 }
        steps:
          type: array
          description: 按顺序执行的步骤；某一步失败（ok=false）后不再继续
          items:
            type: object
            required: [name, ok, ms, message]
            properties:
              name: { type: string, enum: [resolve, put, get, presign, delete, head], description: resolve 解析端点并校验出站 / put 写入 / get 读回校验 / presign 预签名下载 / delete 删除 / head HTTP 源可达性 }
              ok: { type: boolean }
              ms: { type: integer, format: int64 }
              message: { type: string, description: 中文说明（失败原因或结果摘要） }
    # ---------- 存储线路（S1-6b，docs/12 第 3 节）----------
    AdminStorageLineRule:
      type: object
      required: [id, line_id, country, province, isp, asn, effect, boost]
      properties:
        id: { type: integer, format: int64 }
        line_id: { type: integer, format: int64 }
        country: { type: string, description: ISO 两位国家码或 *（不限） }
        province: { type: string, description: 省份或 *（不限） }
        isp: { type: string, description: 运营商或 *（不限） }
        asn: { type: string, description: ASN 数字；留空表示不限 }
        effect: { type: string, enum: [include, exclude], description: include 命中则生效，exclude 命中则排除 }
        boost: { type: integer, minimum: 0, maximum: 100, description: 命中加分 }
    AdminStorageLine:
      type: object
      required: [id, provider_id, kind, name, base_url, access_mode, sign_type, sign_key_ref, token_ttl, priority, weight, region_scope, video_process, probe_path, status, note, rules, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64, description: 所属存储源 }
        kind: { type: string, enum: [video, image] }
        name: { type: string, maxLength: 64 }
        base_url: { type: string, description: 访问域名（含可选路径前缀）；presign 直连存储时为空 }
        access_mode: { type: string, enum: [presign, cdn, public], description: presign 存储预签名 / cdn 经 CDN / public 公开读 }
        sign_type: { type: string, enum: [s3_presign, hmac_token, cdn_vendor, none] }
        sign_key_ref: { type: string, description: "签名密钥引用（指向 LINE_SIGN_KEYS 中的一项，密钥不入库）。hmac_token 填密钥引用；cdn_vendor 填 厂商名/密钥引用；s3_presign 与 none 恒为空" }
        token_ttl: { type: integer, minimum: 60, maximum: 604800, description: 链接有效期（秒） }
        priority: { type: integer, minimum: 0, maximum: 10000, description: 优先级，越大越靠前 }
        weight: { type: integer, minimum: 1, maximum: 100, description: 同优先级内加权随机的权重 }
        region_scope: { type: string, enum: [rules, global], description: rules 按地区规则 / global 兜底对所有地区生效 }
        video_process: { type: string, enum: [standard, text_to_image], description: text_to_image 为历史兼容的旧混淆封装 }
        probe_path: { type: string, description: 连通性探测路径，以 / 开头 }
        status: { type: string, enum: [active, watch, disabled], description: watch 观察中（仍下发但排后） }
        note: { type: string, maxLength: 200 }
        rules:
          type: array
          description: 地区规则（region_scope=rules 时生效）；无规则时可能为 null
          items: { $ref: "#/components/schemas/AdminStorageLineRule" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminStorageLineRequest:
      type: object
      required: [kind, name, access_mode, sign_type]
      properties:
        provider_id: { type: integer, format: int64, description: 所属存储源；仅新建时使用，修改时忽略（线路不能换存储源） }
        kind: { type: string, enum: [video, image] }
        name: { type: string, maxLength: 64 }
        base_url: { type: string, description: access_mode 为 cdn / public 时必填；presign 可留空 }
        access_mode: { type: string, enum: [presign, cdn, public] }
        sign_type: { type: string, enum: [s3_presign, hmac_token, cdn_vendor, none] }
        sign_key_ref:
          type: string
          description: |
            签名密钥引用（密钥本身由 LINE_SIGN_KEYS 注入，不入库）。hmac_token 必填，形如 cdn-main；
            cdn_vendor 必填，形如 厂商名/密钥引用（当前支持厂商 timestamp_md5）；s3_presign 与 none 会被清空。
            只允许字母、数字、连字符与下划线，最长 64 个字符。保存时只校验格式，密钥是否已注入由线路测试的签名自检发现。
        token_ttl: { type: integer, minimum: 60, maximum: 604800, default: 600 }
        priority: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        weight: { type: integer, minimum: 1, maximum: 100, default: 100 }
        region_scope: { type: string, enum: [rules, global], default: global }
        video_process: { type: string, enum: [standard, text_to_image], default: standard }
        probe_path: { type: string, default: /_probe/256k.bin }
        status: { type: string, enum: [active, watch, disabled], default: active }
        note: { type: string, maxLength: 200 }
    AdminStorageLineRuleInput:
      type: object
      properties:
        country: { type: string, description: ISO 两位国家码（大小写不限）或 *；留空按 * 存 }
        province: { type: string, description: 留空按 * 存 }
        isp: { type: string, description: 留空按 * 存 }
        asn: { type: string, description: ASN 数字；留空表示不限 }
        effect: { type: string, enum: [include, exclude], default: include }
        boost: { type: integer, minimum: 0, maximum: 100, default: 0 }
    AdminStorageLineRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          description: 整体替换该线路的全部地区规则
          items: { $ref: "#/components/schemas/AdminStorageLineRuleInput" }
    AdminStorageSignCheck:
      type: object
      required: [ok, type, sample_url, message]
      properties:
        ok: { type: boolean, description: 用线路当前的签名配置成功生成了示例地址 }
        type: { type: string, enum: [s3_presign, hmac_token, cdn_vendor, none] }
        sample_url: { type: string, description: 示例地址，签名值与凭据已替换为 ***（只用于确认形态，不可直接访问） }
        message: { type: string, description: 中文说明（失败原因或有效期） }
    AdminStorageLineProbeResult:
      type: object
      required: [ok, elapsed_ms, url, http_status, content_type, cors, cors_origin, message, sign]
      properties:
        ok: { type: boolean }
        elapsed_ms: { type: integer, format: int64 }
        url: { type: string, description: 实际探测的 URL（base_url + probe_path） }
        http_status: { type: integer }
        content_type: { type: string }
        cors: { type: boolean, description: 是否返回了允许站点域名的 CORS 头 }
        cors_origin: { type: string, description: 实际返回的 Access-Control-Allow-Origin }
        message: { type: string, description: 中文说明（失败原因或结果摘要） }
        sign:
          allOf: [{ $ref: "#/components/schemas/AdminStorageSignCheck" }]
          description: 签名配置自检；直连存储线路没有连通性结果，但仍会自检签名
    # ---------- 存储设置（S1-6d，docs/12 第 7、8.4 节）----------
    AdminStorageSettings:
      type: object
      required: [candidate_count, default_ttl, smart_routing, primary_video_provider_id, primary_image_provider_id, replicate_on_upload, updated_at]
      properties:
        candidate_count: { type: integer, minimum: 1, maximum: 5, description: 下发给客户端的候选线路数量 }
        default_ttl: { type: integer, minimum: 60, maximum: 604800, description: 默认链接有效期（秒） }
        smart_routing: { type: boolean, description: 是否启用按地区智能选线 }
        primary_video_provider_id: { type: integer, format: int64, description: 视频主存储；0 表示未设置 }
        primary_image_provider_id: { type: integer, format: int64, description: 图片主存储；0 表示未设置 }
        replicate_on_upload: { type: boolean, description: 上传后是否异步复制到镜像存储 }
        updated_at: { type: string, format: date-time }
        delivery:
          allOf: [{ $ref: "#/components/schemas/AdminStorageDeliveryCheck" }]
          description: 交付自检；只有 GET 返回，PUT 的响应里没有这个字段
    AdminStorageDeliveryCheck:
      type: object
      required: [ok, issues]
      description: |
        交付自检：选源只从「产物副本已就绪的存储源」上挑线路，所以主存储没挂线路时，
        上传 / 转码 / 复制全部成功，前台却取不到资源（播放返回 503「暂无可用线路」）。
        这里把这种落差显式报出来，issues 为空数组表示配置正常。
      properties:
        ok: { type: boolean, description: 是否没有发现问题 }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AdminStorageDeliveryIssue" }
    AdminStorageDeliveryIssue:
      type: object
      required: [kind, code, message]
      properties:
        kind: { type: string, enum: [video, image], description: 受影响的内容类型 }
        code:
          type: string
          enum: [no_primary, no_line_on_primary, no_line_at_all]
          description: |
            no_primary 没有可写入的主存储（上传本身就会失败）；
            no_line_on_primary 主存储上没有可用线路，但别的存储源上有；
            no_line_at_all 全站都没有该类型的可用线路。
        message: { type: string, description: 给运营看的中文说明，含修复指引 }
    AdminStorageSettingsRequest:
      type: object
      required: [candidate_count, default_ttl, smart_routing, primary_video_provider_id, primary_image_provider_id, replicate_on_upload]
      properties:
        candidate_count: { type: integer, minimum: 1, maximum: 5 }
        default_ttl: { type: integer, minimum: 60, maximum: 604800 }
        smart_routing: { type: boolean }
        primary_video_provider_id: { type: integer, format: int64, description: 0 表示不设 }
        primary_image_provider_id: { type: integer, format: int64, description: 0 表示不设 }
        replicate_on_upload: { type: boolean }
    # ---------- 选线预览（S1-6d，docs/12 第 8.3 节）----------
    AdminStorageScoreDetail:
      type: object
      required: [precision, boost, priority, health, watch, total]
      properties:
        precision: { type: integer, description: 匹配精度分（asn 60 > 国省商 50 > 国商 40 > 国省 30 > 国 20 > 全 * 10 > 兜底 5） }
        boost: { type: integer, description: 命中规则的加分 }
        priority: { type: integer, description: 优先级 × 10 }
        health: { type: integer, description: 健康分 × 0.3（取整） }
        watch: { type: integer, description: 观察中扣分（正数表示扣了多少） }
        total: { type: integer, description: 总分 = 精度 + 加分 + 优先级 + 健康 − 观察扣分 }
    AdminStorageLineEval:
      type: object
      required: [line_id, name, status, rank, recommended, region_tag, health_score, detail]
      properties:
        line_id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string, enum: [candidate, overflow, excluded, unmatched, unhealthy, disabled], description: candidate 入选 / overflow 命中但超候选数 / excluded 被 exclude 规则排除 / unmatched 无规则命中 / unhealthy 健康分过低 / disabled 已停用 }
        rank: { type: integer, description: 候选排名（1 起）；非候选为 0 }
        recommended: { type: boolean, description: 是否排名第一 }
        region_tag: { type: string, description: 本地区 / 通用 }
        health_score: { type: integer, minimum: 0, maximum: 100, description: 生效健康分（探测与客户端上报融合后） }
        detail: { $ref: "#/components/schemas/AdminStorageScoreDetail" }
        health:
          allOf: [{ $ref: "#/components/schemas/AdminStorageHealthBreakdown" }]
          description: 健康分的来源分解，便于运营核对分数构成；无任何数据时不返回该字段
    AdminStoragePreviewResult:
      type: object
      required: [region, country, province, isp, asn, candidate_count, lines]
      properties:
        region: { type: string, description: 格式化的地区标签，如 CN-广东-电信 }
        country: { type: string }
        province: { type: string }
        isp: { type: string }
        asn: { type: string }
        candidate_count: { type: integer, description: 当前设置的候选线路数量 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/AdminStorageLineEval" }
    # ---------- 媒体复制与迁移（S1-6f，docs/12 第 5 节）----------
    AdminStorageReplicateRequest:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [all, drama, provider], description: all 全部对象 / drama 某部剧 / provider 某存储源上有副本的对象 }
        drama_id: { type: integer, format: int64, description: scope=drama 时必填 }
        provider_id: { type: integer, format: int64, description: scope=provider 时必填 }
    AdminStorageMigrateRequest:
      type: object
      required: [from_provider_id, to_provider_id]
      properties:
        from_provider_id: { type: integer, format: int64, description: 迁出的存储源（建议先设为 draining） }
        to_provider_id: { type: integer, format: int64, description: 迁入的存储源，必须可写 }
    AdminStorageAdoptRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id: { type: integer, format: int64, description: 这些历史产物实际所在的存储源（通常是原默认桶登记成的那个） }
    AdminStorageCleanupRequest:
      type: object
      properties:
        dry_run: { type: boolean, default: false, description: 只统计会删掉什么、不实际删除。清理不可逆，建议先用它确认 }
    AdminStorageCleanupResult:
      type: object
      required: [scanned, deleted, files, bytes, kept, dry_run]
      properties:
        scanned: { type: integer, description: 扫描到的已过保留期的孤立对象数 }
        deleted: { type: integer, description: 已删除（dry_run 时为「会删除」）的对象数 }
        files: { type: integer, description: 删除的物理文件数（dry_run 时为 0） }
        bytes: { type: integer, format: int64, description: 释放的字节数（按对象登记的大小） }
        kept: { type: integer, description: 跳过的对象数（重新被引用，或文件删除失败留到下轮） }
        dry_run: { type: boolean }
    AdminStorageOrphanStats:
      type: object
      required: [total, expired, bytes, retention_hours]
      properties:
        total: { type: integer, format: int64, description: 已标记为孤立的对象数 }
        expired: { type: integer, format: int64, description: 其中已过保留期、可以清理的 }
        bytes: { type: integer, format: int64, description: 已标记对象的总字节数 }
        retention_hours: { type: integer, description: 当前保留期（小时，MEDIA_ORPHAN_RETENTION） }
    AdminStorageEnqueueResult:
      type: object
      required: [objects, capped, scanned]
      properties:
        objects: { type: integer, description: 已入队的对象数 }
        capped: { type: boolean, description: 达到单次上限（50000）被截断，可再次触发继续 }
        scanned: { type: integer, description: 扫描到的对象数 }
    # ---------- 线路健康看板（S1-6d，docs/12 第 8.3 节）----------
    AdminStorageClientQuality:
      type: object
      required: [samples, first_frame_ms, fail_rate_pct, stalls, score, counted]
      properties:
        samples: { type: integer, format: int64, description: 窗口内的上报条数 }
        first_frame_ms: { type: integer, format: int64, description: 平均首帧耗时；无首帧样本时为 0 }
        fail_rate_pct: { type: integer, description: 失败率（百分比，取整） }
        stalls: { type: integer, format: int64, description: 卡顿次数 }
        score: { type: integer, minimum: 0, maximum: 100, description: 客户端上报分 }
        counted: { type: boolean, description: 样本是否足够（≥5 条）、已参与健康分 }
    AdminStorageHealthLine:
      type: object
      required: [line_id, name, provider_id, kind, status, base_url, score, has_data, probe_score, has_probe, probe_ok, http_status, elapsed_ms, content_type, cors, message, checked_at, client]
      properties:
        line_id: { type: integer, format: int64 }
        name: { type: string }
        provider_id: { type: integer, format: int64 }
        kind: { type: string, enum: [video, image] }
        status: { type: string, enum: [active, watch, disabled] }
        base_url: { type: string }
        score: { type: integer, minimum: 0, maximum: 100, description: 生效健康分（探测 × 40% + 客户端 × 60%，缺一边时用另一边，都没有时为缺省满分 100） }
        has_data: { type: boolean, description: 是否有任一来源的数据（探测或客户端上报） }
        probe_score: { type: integer, minimum: 0, maximum: 100, description: 服务端探测分 }
        has_probe: { type: boolean, description: 是否有探测数据 }
        probe_ok: { type: boolean, description: 最近一次探测是否可达 }
        http_status: { type: integer }
        elapsed_ms: { type: integer, format: int64 }
        content_type: { type: string }
        cors: { type: boolean, description: 探测时线路是否返回允许站点域名的 CORS 头 }
        message: { type: string, description: 最近探测的中文说明 }
        checked_at: { type: ["string", "null"], format: date-time, description: 最近探测时间；无数据时为 null }
        client:
          allOf: [{ $ref: "#/components/schemas/AdminStorageClientQuality" }]
          description: 最近 window_min 分钟的客户端上报指标（全部地区汇总；选线时按用户所在地区单独计算）
    AdminStorageHealthOverview:
      type: object
      required: [probe_enabled, window_min, probe_weight, client_weight, lines]
      properties:
        probe_enabled: { type: boolean, description: 服务端探测是否开启 }
        window_min: { type: integer, description: 客户端上报的统计窗口（分钟） }
        probe_weight: { type: integer, description: 探测在健康分中的权重（百分比） }
        client_weight: { type: integer, description: 客户端上报在健康分中的权重（百分比） }
        lines:
          type: array
          items: { $ref: "#/components/schemas/AdminStorageHealthLine" }
    AdminStorageQualityDelta:
      type: object
      required: [samples, first_frame_sum, first_frame_n, errors, stalls]
      properties:
        samples: { type: integer, format: int64 }
        first_frame_sum: { type: integer, format: int64, description: 首帧耗时之和（毫秒） }
        first_frame_n: { type: integer, format: int64, description: 带耗时的首帧样本数 }
        errors: { type: integer, format: int64 }
        stalls: { type: integer, format: int64 }
    AdminStorageHealthBreakdown:
      type: object
      required: [final, probe_score, has_probe, client_score, has_client, quality, by_region]
      properties:
        final: { type: integer, minimum: 0, maximum: 100, description: 生效健康分 }
        probe_score: { type: integer, description: 服务端探测分 }
        has_probe: { type: boolean }
        client_score: { type: integer, description: 客户端上报分 }
        has_client: { type: boolean, description: 客户端样本是否足够、已参与融合 }
        quality:
          allOf: [{ $ref: "#/components/schemas/AdminStorageQualityDelta" }]
          description: 窗口内的上报聚合；样本不足时也返回，供核对
        by_region: { type: boolean, description: 客户端数据取自本地区（false 表示回退到全部地区的汇总） }
    # ---------- 资源机（S1-6）----------
    AdminFTPServer:
      type: object
      required: [id, name, host, port, tls, passive, cred_ref, cred_env, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        host: { type: string, description: 域名或 IP（小写，IPv6 不带方括号） }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls:
          type: string
          enum: [none, explicit, implicit]
          description: none 不加密 / explicit 显式 TLS（AUTH TLS）/ implicit 隐式 TLS；非开发环境只允许 explicit
        passive: { type: boolean, description: 被动模式；目前只支持被动模式，恒为 true }
        cred_ref: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,31}$', description: 凭据标识（账号密码的引用） }
        cred_env:
          type: object
          required: [user, password]
          description: worker 读取账号密码的两个环境变量名（不是账号密码本身）；连不上时把它们发给技术配置
          properties:
            user: { type: string, example: FTP_HK1_USER }
            password: { type: string, example: FTP_HK1_PASSWORD }
        status: { type: string, enum: [active, inactive], description: 停用后不参与扫描入库（S4-6），仍可测连 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminFTPServerPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminFTPServer" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminFTPServerRequest:
      type: object
      required: [name, host]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        host: { type: string, maxLength: 253, description: 域名或 IP，不带协议、端口和路径；中文域名填 xn-- 开头的编码形式；保存时转小写 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 21 }
        tls: { type: string, enum: [none, explicit, implicit], default: explicit, description: 非开发环境只允许 explicit }
        passive: { type: boolean, default: true, description: 只支持被动模式，传 false 返回 400 }
        cred_ref:
          type: string
          maxLength: 32
          description: 大写字母开头的大写字母、数字与下划线（保存前转大写）；新建时留空自动生成，保存时留空保持原值
        status: { type: string, enum: [active, inactive], default: active }
    AdminFTPListRequest:
      type: object
      additionalProperties: false
      properties:
        path: { type: string, maxLength: 1024, description: 要打开的目录（绝对路径，或相对登录目录）；不能含控制字符；空为登录目录 }
    # ---------- 功能开关与年龄门（S3-3 / A3-3）----------
    AdminFeatureFlag:
      type: string
      description: 功能开关编码（docs/06 第 36 节列的 8 项）
      enum: [comments, danmaku, register, guest_interaction, ranks, share_poster, pwa, search_suggest]
    AdminFlagInfo:
      type: object
      required: [flag, title, impact, on]
      properties:
        flag: { $ref: "#/components/schemas/AdminFeatureFlag" }
        title: { type: string, description: 中文名称 }
        impact:
          type: string
          description: 关掉会怎样。由后端给出 —— 开关的实际行为由后端决定，前后端分开写必然漂移
        on: { type: boolean }
    AdminAgeGate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        title: { type: string, maxLength: 60, description: 弹层标题；启用时必填 }
        desc: { type: string, maxLength: 500, description: 说明文字 }
        confirm_text: { type: string, maxLength: 20, description: 确认按钮文字；启用时必填 }
        deny_text: { type: string, maxLength: 20, description: 拒绝按钮文字；启用时必填 }
        deny_url:
          type: string
          maxLength: 500
          description: 点「拒绝」后跳转的完整 http(s) 网址；留空则停留在当前页
        remember_days:
          type: integer
          minimum: 0
          maximum: 365
          description: 确认后多少天内不再弹；0 表示每次打开都确认
    AdminFeatureConfig:
      type: object
      required: [flags, age_gate]
      properties:
        flags:
          type: array
          items: { $ref: "#/components/schemas/AdminFlagInfo" }
        age_gate: { $ref: "#/components/schemas/AdminAgeGate" }
    # ---------- 白标：品牌、配色与布局（S3-3 / A3-3） ----------
    AdminBrand:
      type: object
      required: [site_name]
      additionalProperties: false
      properties:
        site_name: { type: string, minLength: 1, maxLength: 30, description: 站名，页头与标题模板都用它 }
        slogan: { type: string, maxLength: 60 }
        copyright: { type: string, maxLength: 100, description: 页脚版权文字 }
        support_url: { type: string, maxLength: 500, description: 在线客服链接，完整 http(s) 地址 }
        logo_light: { type: string, maxLength: 300, description: "头部 Logo：上传后的图片相对路径（如 img/logo.webp）或完整 http(s) 地址；留空用站名文字" }
        favicon: { type: string, maxLength: 300 }
    AdminTheme:
      type: object
      additionalProperties: false
      properties:
        preset: { type: string, enum: [classic, midnight, forest, violet, neutral], default: classic, description: 皮肤预设 }
        color_scheme: { type: string, enum: [dark, light, system], default: dark, description: 默认深浅色 }
        allow_scheme_toggle: { type: boolean, description: 是否允许访客自己切换深浅色 }
        colors:
          type: object
          description: 覆盖预设里的颜色；键只能是 primary / accent / bg / surface / text / muted，值为 #RGB 或 #RRGGBB，留空表示用预设色
          additionalProperties: { type: string }
        radius: { type: integer, minimum: 0, maximum: 32, default: 12, description: 卡片圆角（px） }
        cover_ratio: { type: string, enum: ["2:3", "3:4", "16:9"], default: "2:3" }
        font: { type: string, enum: [system, serif, rounded], default: system }
    AdminLayout:
      type: object
      additionalProperties: false
      properties:
        header_style: { type: string, enum: [classic, centered, pill], default: classic }
        card_style: { type: string, enum: [below, overlay], default: below, description: 卡片标题在封面下还是压在封面上 }
        play_mode: { type: string, enum: [mobile_immersive, all_immersive, all_detail], default: mobile_immersive }
        mobile_tabbar: { type: boolean, description: 手机是否显示底部标签栏 }
    AdminSEOVerification:
      type: object
      required: [name, content]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 60, description: "meta 标签的 name，如 google-site-verification；只能用字母、数字、点、下划线与连字符" }
        content: { type: string, maxLength: 200 }
    AdminSEO:
      type: object
      additionalProperties: false
      properties:
        title_templates:
          type: object
          description: "「页面编码 → 标题模板」。页面只能是 home/list/play/rank/drama/topic/search/channel/tag；模板里的 {变量} 必须在 GET 返回的 variables 里；留空表示该页用前台默认"
          additionalProperties: { type: string, maxLength: 120 }
        desc_templates:
          type: object
          description: 「页面编码 → 描述模板」，规则同上
          additionalProperties: { type: string, maxLength: 120 }
        og_image: { type: string, maxLength: 300, description: 默认分享图：上传后的图片相对路径或完整 http(s) 地址 }
        robots_allow: { type: boolean, default: true, description: 关掉后整站输出 noindex 并让 robots.txt 拒绝抓取 }
        robots_extra: { type: string, maxLength: 2000, description: 追加到 robots.txt 末尾 }
        sitemap: { type: boolean, default: true }
        structured_data: { type: boolean, default: true }
        verifications:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AdminSEOVerification" }
          description: 站长验证，名称不区分大小写去重；整行留空的忽略
    AdminSEOConfigData:
      type: object
      required: [seo, pages, variables, max_template]
      properties:
        seo: { $ref: "#/components/schemas/AdminSEO" }
        pages:
          type: array
          items: { $ref: "#/components/schemas/AdminBrandingOption" }
          description: 可配置模板的页面（含中文名与可用变量提示）
        variables:
          type: array
          items: { $ref: "#/components/schemas/AdminBrandingOption" }
          description: 模板里可插入的变量，前端的「点击插入」照此渲染
        max_template: { type: integer, description: 单条模板的字数上限 }
    AdminAnalyticsCode:
      type: object
      additionalProperties: false
      properties:
        head_snippet: { type: string, maxLength: 20000, description: 注入 <head> 的统计代码，原样输出、不做清洗 }
        body_snippet: { type: string, maxLength: 20000, description: "注入 </body> 前的统计代码" }
    AdminBrandingOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string, description: 中文名，直接显示在下拉里 }
        hint: { type: string, description: 补充说明，只有需要解释的选项才有 }
    AdminBrandingConfigData:
      type: object
      required: [brand, theme, layout, options]
      properties:
        brand: { $ref: "#/components/schemas/AdminBrand" }
        theme: { $ref: "#/components/schemas/AdminTheme" }
        layout: { $ref: "#/components/schemas/AdminLayout" }
        options:
          type: object
          description: 各下拉的可选值与上限，前端照此渲染，不要在前端抄一份枚举
          required: [presets, color_schemes, colors, cover_ratios, fonts, header_styles, card_styles, play_modes, max_radius]
          properties:
            presets: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            color_schemes: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            colors: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" }, description: 可配置的颜色键 }
            cover_ratios: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            fonts: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            header_styles: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            card_styles: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            play_modes: { type: array, items: { $ref: "#/components/schemas/AdminBrandingOption" } }
            max_radius: { type: integer }
    AdminFeatureFlagsRequest:
      type: object
      required: [flags]
      additionalProperties: false
      properties:
        flags:
          type: object
          description: 「开关编码 → 是否打开」。未传的按打开保存；出现未登记的编码返回 400
          additionalProperties: { type: boolean }
    # ---------- 回收站（A4-3 / S4-7）----------
    AdminTrashCategory:
      type: string
      description: |
        回收站分类。目前只有剧集：设置类数据不进回收站（docs/06 第 35 节），其余内容模块还没实现软删。
      enum: [dramas]
    AdminTrashCategoryInfo:
      type: object
      required: [category, title, desc, count]
      properties:
        category: { $ref: "#/components/schemas/AdminTrashCategory" }
        title: { type: string }
        desc: { type: string, description: 还原与彻底删除各会影响什么，页面直接展示 }
        count: { type: integer }
    AdminTrashOverview:
      type: object
      required: [retention_days, categories]
      properties:
        retention_days: { type: integer, description: 保留期天数（TRASH_RETENTION，默认 30 天） }
        categories:
          type: array
          items: { $ref: "#/components/schemas/AdminTrashCategoryInfo" }
        oldest_expires_at:
          type: [string, "null"]
          format: date-time
          description: 最近一条到期的时间；回收站为空时为 null
    # ---------- CSV 批量导入（A4-2 / S4-6，docs/06 第 8 节）----------
    AdminImportRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: |
            CSV 文件。第一行要是表头，列名认「剧名 / 别名 / 简介 / 标签」及其常见写法
            （title / aliases / summary / tags、名称 / 又名 / 描述 等）。
            上限 1 MiB、2000 行。要 UTF-8（Excel 用「CSV UTF-8」另存；BOM 会被自动去掉）
        source:
          type: string
          maxLength: 60
          description: 来源标识（采集批次），选填。会写进 drama.source 便于追溯
    AdminImportAction:
      type: string
      description: |
        一行的处置。create=新建一部剧（草稿）；update=剧已存在，只补充别名与简介；
        skip=这一行用不了（没填剧名或文件内重复）；reject=命中屏蔽词，不导入
      enum: [create, update, skip, reject]
    AdminImportActionInfo:
      type: object
      required: [action, title, desc]
      description: 一种处置及其中文说明，页面做图例用
      properties:
        action: { $ref: "#/components/schemas/AdminImportAction" }
        title: { type: string }
        desc: { type: string }
    AdminImportRow:
      type: object
      required:
        [line, title, aliases, summary, tags, action, action_title, drama_id, matched_by, in_trash, new_tags, reason]
      properties:
        line: { type: integer, description: 在文件里的行号（含表头，从 1 开始） }
        title: { type: string }
        aliases: { type: array, items: { type: string } }
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        action: { $ref: "#/components/schemas/AdminImportAction" }
        action_title: { type: string }
        drama_id:
          type: integer
          format: int64
          description: update 时是已存在的那部剧；create 时预览为 0、正式导入后是新建的编号
        matched_by: { type: string, description: 按什么判定为已存在的（剧名 / 别名） }
        in_trash:
          type: boolean
          description: 匹配到的剧在回收站里。它仍算已存在，不会重建一部同名的
        new_tags: { type: array, items: { type: string }, description: 这一行会自动新建的标签名 }
        reason: { type: string, description: 跳过或被拒的原因 }
    AdminImportStats:
      type: object
      required:
        [rows_total, dramas_created, dramas_updated, episodes_created, episodes_updated, skipped, rejected, tags_created]
      properties:
        rows_total: { type: integer, description: 数据行数（不含表头） }
        dramas_created: { type: integer }
        dramas_updated: { type: integer }
        episodes_created:
          type: integer
          description: |
            **CSV 场景恒为 0**：CSV 的列里没有分集信息。保留这两个字段是为了让 FTP 扫描与
            开放平台推送（S4-6 的另两种来源）共用同一套统计口径
        episodes_updated: { type: integer, description: 同上，CSV 场景恒为 0 }
        skipped: { type: integer, description: 行本身用不了（没填剧名）或文件内重复 }
        rejected: { type: integer, description: 命中屏蔽词（只认 block 类） }
        tags_created: { type: integer, description: 自动新建的标签数 }
    AdminImportResult:
      type: object
      required: [dry_run, stats, rows, actions, log_id, note]
      properties:
        dry_run: { type: boolean, description: 为真表示这是预览，没有写库 }
        stats: { $ref: "#/components/schemas/AdminImportStats" }
        rows: { type: array, items: { $ref: "#/components/schemas/AdminImportRow" } }
        actions: { type: array, items: { $ref: "#/components/schemas/AdminImportActionInfo" } }
        log_id: { type: integer, format: int64, description: 正式导入后的记录编号；预览为 0 }
        note: { type: string, description: 说明 CSV 能带什么、不能带什么（后端给出，页面照抄） }
    AdminImportLog:
      type: object
      required:
        [id, source, file_name, rows_total, dramas_created, dramas_updated, episodes_created, episodes_updated,
         skipped, rejected, tags_created, admin_id, admin_name, created_at]
      properties:
        id: { type: integer, format: int64 }
        source: { type: string }
        file_name: { type: string }
        rows_total: { type: integer }
        dramas_created: { type: integer }
        dramas_updated: { type: integer }
        episodes_created: { type: integer, description: CSV 场景恒为 0 }
        episodes_updated: { type: integer, description: CSV 场景恒为 0 }
        skipped: { type: integer }
        rejected: { type: integer }
        tags_created: { type: integer }
        admin_id: { type: integer, format: int64, description: 操作人（无外键，批次记录比账号活得久） }
        admin_name: { type: string, description: 操作人用户名；账号已删时为空 }
        created_at: { type: string, format: date-time }
    AdminImportLogPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminImportLog" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    # ---------- 资源预热（S4-5 / A4-2，docs/06 第 10 节）----------
    AdminResourceWarmMode:
      type: string
      description: |
        预热深度。playlist_only=只拉清单（热的是服务端清单原文缓存，流量极小）；
        with_segments=连每档前 N 个切片一起拉（真正的边缘预热）
      enum: [playlist_only, with_segments]
    AdminResourceWarmStatus:
      type: string
      description: |
        一轮预热的状态。running=在跑；done=正常跑完（中途有拿不到的资源不影响这个状态，数量在 failed 里）；
        stopped=运营点了停止（已热好的算数）；interrupted=出错或预热进程失去响应（心跳停 5 分钟判定）
      enum: [running, done, stopped, interrupted]
    AdminResourceWarmStatusInfo:
      type: object
      required: [status, title, desc]
      description: 一种状态及其中文说明，页面做图例用
      properties:
        status: { $ref: "#/components/schemas/AdminResourceWarmStatus" }
        title: { type: string }
        desc: { type: string }
    AdminResourceWarmJob:
      type: object
      required:
        [id, drama_id, drama_title, mode, mode_title, segments_per_quality, concurrency, include_unpublished,
         status, status_title, episodes_total, episodes_done, warmed, failed, fetched, traffic_bytes,
         current, stop_requested, error, admin_id, started_at, heartbeat_at, finished_at, elapsed_ms, percent]
      properties:
        id: { type: integer, format: int64 }
        drama_id: { type: integer, format: int64, description: 0 表示全部剧 }
        drama_title: { type: string }
        mode: { $ref: "#/components/schemas/AdminResourceWarmMode" }
        mode_title: { type: string }
        segments_per_quality: { type: integer, description: 每个清晰度拉前几片（1–20，默认 2 ≈ 8 秒起播） }
        concurrency: { type: integer, description: 同时热几集（1–16，默认 4） }
        include_unpublished: { type: boolean }
        status: { $ref: "#/components/schemas/AdminResourceWarmStatus" }
        status_title: { type: string }
        episodes_total: { type: integer }
        episodes_done: { type: integer }
        warmed: { type: integer, format: int64, description: 热好的资源数（清单与切片各算一个） }
        failed:
          type: integer
          format: int64
          description: 拿不到的资源数。它们会同时写进资源体检的结果里，可以在那边逐条排查
        fetched: { type: integer, format: int64, description: 切片拉取次数 }
        traffic_bytes: { type: integer, format: int64 }
        current: { type: string, description: 当前在热什么（如「某剧 第 12 集」）；结束后为空 }
        stop_requested: { type: boolean, description: 为真且 status 仍是 running 表示正在收尾 }
        error: { type: string }
        admin_id: { type: integer, format: int64, description: 发起人（无外键，任务记录比账号活得久） }
        started_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time, description: worker 每写一次进度就更新；停 5 分钟判定为中断 }
        finished_at: { type: string, format: date-time, nullable: true }
        elapsed_ms: { type: integer, format: int64, description: 已跑或总共跑了多久 }
        percent: { type: integer, description: 0–100；没有总数时为 0 }
    AdminResourceWarmProgress:
      type: object
      required: [job, running, statuses, note]
      properties:
        job:
          allOf: [{ $ref: "#/components/schemas/AdminResourceWarmJob" }]
          nullable: true
          description: 在跑的那一轮；没有在跑的时候是最近一轮。为 null 表示从来没跑过
        running: { type: boolean }
        statuses:
          type: array
          items: { $ref: "#/components/schemas/AdminResourceWarmStatusInfo" }
        note:
          type: string
          description: |
            对预热效果的说明：切片进边缘长缓存（预热的正主），清单不进边缘、预热它热的是服务端清单原文缓存。
            写在后端是因为哪一层被热到由后端行为决定，前端照抄一份必然漂移
    AdminResourceWarmStartRequest:
      type: object
      additionalProperties: false
      properties:
        drama_id: { type: integer, format: int64, minimum: 0, description: 0 或省略表示全部剧 }
        include_unpublished:
          type: boolean
          description: 只在全部剧时有意义。默认只热已上架的
        mode:
          allOf: [{ $ref: "#/components/schemas/AdminResourceWarmMode" }]
          description: 省略时为 with_segments
        segments_per_quality: { type: integer, minimum: 1, maximum: 20, description: 省略时为 2 }
        concurrency: { type: integer, minimum: 1, maximum: 16, description: 省略时为 4 }
    AdminResourceWarmStopRequest:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
    AdminResourceWarmHistory:
      type: object
      required: [list]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminResourceWarmJob" } }
    # ---------- 资源体检（S4-5 / A4-2，docs/06 第 9 节）----------
    AdminResourceCheckResult:
      type: string
      description: |
        体检结果（docs/02 第 4.3 节）。ok=能打开（2xx/3xx）、not_found=404/410、forbidden=401/403、
        server_error=5xx、unopenable=其他 4xx 或地址非法、unreachable=传输层失败（DNS / 拒绝 / 超时 / 被出站策略拦截）
      enum: [ok, not_found, forbidden, server_error, unopenable, unreachable]
    AdminResourceCheckField:
      type: string
      description: 具体哪个字段。只有 file_type 的话运营不知道该去改哪个
      enum: [cover_portrait, cover_landscape, episode_cover, episode_poster, video]
    AdminResourceCheckResultInfo:
      type: object
      required: [result, title, desc]
      description: 一种结果及其中文说明，页面做图例用
      properties:
        result: { $ref: "#/components/schemas/AdminResourceCheckResult" }
        title: { type: string }
        desc: { type: string, description: 这种结果通常意味着什么、该怎么处理 }
    AdminResourceCheckRow:
      type: object
      required:
        [id, drama_id, drama_title, episode_id, episode_number, file_type, field, field_title, url,
         line_id, line_name, result, result_title, status_code, elapsed_ms, message, checked_at]
      properties:
        id: { type: integer, format: int64 }
        drama_id: { type: integer, format: int64 }
        drama_title: { type: string }
        episode_id: { type: integer, format: int64, description: 0 表示剧级资源（封面） }
        episode_number: { type: integer, description: 0 表示剧级资源 }
        file_type: { type: string, enum: [video, cover] }
        field: { $ref: "#/components/schemas/AdminResourceCheckField" }
        field_title: { type: string, description: 字段的中文名（竖封面 / 本集封面 / 视频…） }
        url:
          type: string
          description: 探测的地址，**不含查询串** —— 签名材料（HMAC 令牌、S3 预签名）不入库
        line_id: { type: integer, format: int64, description: 0 表示没经线路（运营把封面填成了完整网址） }
        line_name: { type: string }
        result: { $ref: "#/components/schemas/AdminResourceCheckResult" }
        result_title: { type: string, description: 结果的中文名（正常 / 404 / 拒绝访问…） }
        status_code: { type: integer, description: HTTP 状态码；0 表示没拿到响应 }
        elapsed_ms: { type: integer }
        message: { type: string, description: 给运营看的中文说明 }
        checked_at: { type: string, format: date-time }
    AdminResourceCheckSummary:
      type: object
      required: [total, bad, last_checked_at]
      description: 全站概览，不受筛选影响
      properties:
        total: { type: integer, format: int64 }
        bad: { type: integer, format: int64, description: 结果不是 ok 的条数 }
        last_checked_at: { type: string, format: date-time, nullable: true }
    AdminResourceCheckOverview:
      type: object
      required: [list, total, shown, limit, summary, results, line_warning]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminResourceCheckRow" } }
        total: { type: integer, format: int64, description: 符合筛选条件的总数，可能大于 shown }
        shown: { type: integer, description: 本次返回了多少条 }
        limit: { type: integer }
        summary: { $ref: "#/components/schemas/AdminResourceCheckSummary" }
        results:
          type: array
          items: { $ref: "#/components/schemas/AdminResourceCheckResultInfo" }
          description: 六种结果及中文说明，页面做图例用（前端不必写死）
        line_warning:
          type: string
          description: 非空时说明有一类资源没有可用线路、体检会跳过它们（缺线路不会被记成「连不上」）
    AdminResourceCheckRunRequest:
      type: object
      additionalProperties: false
      properties:
        drama_id: { type: integer, format: int64, minimum: 0, description: 0 或省略表示全部剧 }
        include_unpublished:
          type: boolean
          description: 只在全部剧时有意义。默认只检已上架的 —— 那些是观众现在就能点开的
    AdminResourceCheckRunResult:
      type: object
      required: [dramas, queued]
      properties:
        dramas: { type: integer, description: 符合范围的剧数 }
        queued: { type: integer, description: 已入队的任务数（按剧分片，一部剧一个任务） }
    AdminResourceCheckClearRequest:
      type: object
      additionalProperties: false
      properties:
        drama_id: { type: integer, format: int64, minimum: 0, description: 0 或省略表示清全部 }
    AdminResourceCheckClearResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, format: int64, description: 清掉的结果条数 }
    # ---------- 开放平台 API Key（A4-3，docs/06 第 32 节）----------
    AdminAPIScope:
      type: string
      description: 权限范围
      enum: [drama.push, analytics.read]
    AdminAPIScopeInfo:
      type: object
      required: [scope, title, desc]
      description: 权限范围及其中文说明，页面直接展示
      properties:
        scope: { $ref: "#/components/schemas/AdminAPIScope" }
        title: { type: string }
        desc: { type: string, description: 这个范围允许做什么、有什么限制 }
    AdminAPIKey:
      type: object
      required:
        [id, name, owner, hint, scopes, status, used_count, last_used_at, created_by, created_at, updated_at, display_status]
      description: 一把密钥。完整密钥不在这里，也不在库里 —— 只有生成那一次的响应带 secret
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: 用途（这把密钥做什么用），1–60 字 }
        owner: { type: string, description: 使用方（谁在用），选填，最多 60 字 }
        hint: { type: string, description: 密钥开头 10 位（含 xsk_ 前缀），供后台识别与搜索 }
        scopes: { type: array, items: { $ref: "#/components/schemas/AdminAPIScope" } }
        status: { type: string, enum: [active, inactive], description: 库里存的启用状态 }
        used_count: { type: integer, format: int64, description: 累计调用次数 }
        last_used_at: { type: string, format: date-time, nullable: true, description: 最近一次调用；从未用过为 null }
        created_by: { type: integer, format: int64, description: 生成人的管理员编号（无外键，密钥记录比账号活得久） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        display_status:
          type: string
          enum: [active, inactive, unused]
          description: 页面显示的状态，由 status 与 last_used_at 算出：可用 / 停用 / 未用过（启用中但从未被调用）
    AdminNewAPIKey:
      allOf:
        - $ref: "#/components/schemas/AdminAPIKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                完整密钥，**只有这一次**能拿到。格式 xsk_ + 32 字节随机数的 base64url 编码，共 47 字符。
                系统里只留 SHA-256 哈希与开头 10 位，这次响应之后谁也取不回来。
    AdminAPIKeyRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: 用途 }
        owner: { type: string, maxLength: 60, description: 使用方，选填 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AdminAPIScope" }
          description: 权限范围，至少一个；重复项会去重。**改接口（PATCH）会忽略这个字段**
    AdminAPIKeyPage:
      type: object
      required: [list, total, page, page_size, scopes]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminAPIKey" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AdminAPIScopeInfo" }
          description: 全部权限范围及说明，供页面展示（前端不必写死清单）
    AdminTrashItem:
      type: object
      required: [id, title, slug, cover, status, extra, deleted_at, updated_at, expires_at, days_left]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        cover: { type: string }
        status: { type: string, description: 删除前的状态，还原后恢复成它 }
        extra: { type: integer, description: 附带内容的条数；剧集为分集数 }
        deleted_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 到期自动彻底删除的时间 }
        days_left: { type: integer, description: 剩余天数（向上取整）；0 表示今天到期 }
    AdminTrashPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminTrashItem" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminTrashActionRequest:
      type: object
      required: [category]
      additionalProperties: false
      properties:
        category: { $ref: "#/components/schemas/AdminTrashCategory" }
    AdminTrashRestoreResult:
      type: object
      required: [id, title, slug, status]
      description: 还原的结果。只含还原后仍有意义的字段 —— 到期时间与剩余天数随删除标记一起没了
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        status: { type: string, description: 恢复成的状态 }
    # ---------- 审计日志（A4-3 / S4-7）----------
    AdminAuditItem:
      type: object
      required: [id, admin_id, username, action, target_type, target_id, ip_prefix, request_id, created_at, chained, has_diff]
      properties:
        id: { type: integer, format: int64 }
        admin_id: { type: integer, format: int64 }
        username: { type: string, description: 操作人用户名 }
        action: { type: string, description: 如 drama.update；handler 没有单独声明时为「方法 + 路由模板」, example: taxonomy.create }
        target_type: { type: string, description: 对象类型，如 drama、taxonomy、ftp_server }
        target_id: { type: string }
        ip_prefix: { type: string, description: 来源 IP 的网段（只记到网段，不记完整地址）, example: 203.0.0.0/16 }
        request_id: { type: string }
        created_at: { type: string, format: date-time }
        chained: { type: boolean, description: 是否在哈希链上；启用哈希链（迁移 00026）之前的记录为 false }
        has_diff: { type: boolean, description: 有改动前后内容可看 }
    AdminAuditDetail:
      allOf:
        - $ref: "#/components/schemas/AdminAuditItem"
        - type: object
          required: [prev_hash, hash]
          properties:
            before:
              type: [object, "null"]
              additionalProperties: true
              description: 改动前（新建操作为 null）。按系统原字段名，密码密钥类字段的值为 ***
            after:
              type: [object, "null"]
              additionalProperties: true
              description: 改动后（删除操作为 null）
            prev_hash: { type: string, description: 上一条记录的哈希；链首为空串 }
            hash: { type: string, description: 本条的哈希；未入链时为空串 }
    AdminAuditPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminAuditItem" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminAuditFacet:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, format: int64 }
    AdminAuditFacets:
      type: object
      required: [actions, target_types, admins]
      description: 实际出现过的筛选项，各带条数（动作有 60 多种且会随功能增加）
      properties:
        actions: { type: array, items: { $ref: "#/components/schemas/AdminAuditFacet" } }
        target_types: { type: array, items: { $ref: "#/components/schemas/AdminAuditFacet" } }
        admins:
          type: array
          items:
            type: object
            required: [id, username, count]
            properties:
              id: { type: integer, format: int64 }
              username: { type: string }
              count: { type: integer, format: int64 }
    AdminAuditVerifyResult:
      type: object
      required: [ok, checked, chained, unchained, first_at, last_at]
      properties:
        ok: { type: boolean, description: 链完整 }
        checked: { type: integer, format: int64, description: 本次实际校验的条数 }
        chained: { type: integer, format: int64, description: 带哈希、参与校验的记录总数 }
        unchained: { type: integer, format: int64, description: 启用哈希链之前的记录数，不参与校验 }
        first_at: { type: string, format: date-time, description: 链上最早一条的时间 }
        last_at: { type: string, format: date-time, description: 链上最晚一条的时间 }
        broken:
          type: [object, "null"]
          description: 第一处对不上的记录；ok 为真时为 null
          required: [id, reason, action, at]
          properties:
            id: { type: integer, format: int64 }
            reason: { type: string, description: 「内容与哈希对不上」或「与上一条的哈希对不上」 }
            action: { type: string }
            at: { type: string, format: date-time }
    # ---------- 配置导出导入（S4-4）----------
    AdminConfigCounts:
      type: object
      required: [menus, static_pages, blocks, taxonomies, terms, ads]
      description: 备份正文里各类数据的条数。菜单、静态页、区块的后端还没实现（A3-1 / A3-2），恒为 0
      properties:
        menus: { type: integer }
        static_pages: { type: integer }
        blocks: { type: integer }
        taxonomies: { type: integer }
        terms: { type: integer, description: 全部维度下的取值总数 }
        ads: { type: integer }
    AdminConfigBackupTerm:
      type: object
      required: [name, slug, status, is_channel, code, sort]
      description: 维度下的一个取值。不含数据库主键，导入按「维度 slug + 取值 slug」匹配
      properties:
        name: { type: string, maxLength: 64 }
        slug: { type: string, maxLength: 64, description: 小写字母、数字与连字符 }
        status: { type: string, enum: [active, inactive] }
        is_channel: { type: boolean, description: 有独立频道页；为真时 slug 要全站唯一 }
        code: { type: string, maxLength: 64, description: 供区块与专题规则引用；非空时全站唯一 }
        sort: { type: integer, format: int32 }
    AdminConfigBackupTaxonomy:
      type: object
      required: [name, slug, multi_select, show_in_explore, status, sort, terms]
      description: 一个筛选维度及其取值。不含数据库主键，导入按 slug 匹配（备份可以在不同环境之间搬）
      properties:
        name: { type: string, maxLength: 64 }
        slug: { type: string, maxLength: 64 }
        multi_select: { type: boolean }
        show_in_explore: { type: boolean }
        status: { type: string, enum: [active, inactive] }
        sort: { type: integer, format: int32 }
        terms:
          type: array
          items: { $ref: "#/components/schemas/AdminConfigBackupTaxonomyTerm" }
    AdminConfigBackupTaxonomyTerm:
      $ref: "#/components/schemas/AdminConfigBackupTerm"
    AdminConfigBackupAd:
      type: object
      required: [name, slot, creative_type, status]
      description: 一条广告素材。不含 imp_count / click_count（运行期统计不进备份）
      properties:
        name: { type: string, maxLength: 50 }
        slot: { type: string, description: 广告位，取值见 AdminAd.slot }
        creative_type: { type: string, enum: [image, video, text, html] }
        image: { type: string }
        video_url: { type: string }
        text: { type: string }
        html: { type: string }
        alt: { type: string }
        click_url: { type: string }
        device: { type: string, enum: [all, mobile, desktop] }
        locales: { type: array, items: { type: string } }
        weight: { type: integer }
        end_at: { type: [string, "null"], format: date-time }
        freq_cap: { type: integer }
        status: { type: string, enum: [active, inactive] }
    AdminConfigBackupData:
      type: object
      required: [menus, static_pages, blocks, taxonomies, ads]
      description: 备份正文。签名针对「格式版本 + 这一段的规范 JSON」计算
      properties:
        menus: { type: array, items: {}, description: 前台菜单，A3-2 实现后填充（当前恒为空数组） }
        static_pages: { type: array, items: {}, description: 静态页，A3-2 实现后填充 }
        blocks: { type: array, items: {}, description: 页面区块，A3-1 实现后填充 }
        taxonomies:
          type: array
          items: { $ref: "#/components/schemas/AdminConfigBackupTaxonomy" }
        ads:
          type: array
          items: { $ref: "#/components/schemas/AdminConfigBackupAd" }
    AdminConfigBackup:
      type: object
      required: [format, data]
      description: 备份文件。导出得到它，导入时原样回传
      properties:
        format: { type: integer, minimum: 1, description: 格式版本，当前为 1；一并参与签名，单独改版本号会让校验失败 }
        exported_at: { type: string, format: date-time }
        site: { type: string, description: 导出时的站点版本（如 v12），便于分辨备份来自哪个环境, example: v12 }
        signature:
          type: string
          description: "kid:base64url(HMAC-SHA256(派生密钥, 格式版本 ‖ 正文))；没配 CONFIG_BACKUP_KEYS 时为空串"
        data: { $ref: "#/components/schemas/AdminConfigBackupData" }
    AdminConfigBackupSummary:
      type: object
      required: [id, format, reason, admin_id, note, counts, signed, created_at]
      properties:
        id: { type: integer, format: int64 }
        format: { type: integer }
        reason:
          type: string
          enum: [manual, before_import]
          description: manual 为导出时留的存档，before_import 为导入或回滚前自动存的
        admin_id: { type: integer, format: int64, description: 操作人；不加外键，备份要比账号活得久 }
        note: { type: string }
        counts: { $ref: "#/components/schemas/AdminConfigCounts" }
        signed: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminConfigImportResult:
      type: object
      required: [format, signed, backup_id, applied, taxonomies_kept, terms_kept, kept_names, ads_replaced]
      properties:
        format: { type: integer }
        signed: { type: boolean, description: 这次导入是否校验过签名 }
        backup_id: { type: integer, format: int64, description: 导入前自动存档的编号，用于回滚 }
        applied: { $ref: "#/components/schemas/AdminConfigCounts" }
        taxonomies_kept:
          type: integer
          description: 库里有、备份里没有、因此保留未删的维度数量（删维度会级联删取值，再级联删剧集的维度归属）
        terms_kept: { type: integer, description: 同上，取值的数量 }
        kept_names:
          type: array
          items: { type: string }
          description: 保留未删的维度与取值名称，供运维确认后在「筛选维度」页手动处理
        ads_replaced: { type: boolean, description: 广告做了整表替换，原有的曝光与点击计数归零 }
    # ---------- 缓存管理（S4-4）----------
    AdminCacheScope:
      type: string
      description: |
        清理范围。site_config 站点设置（含版本 +1）/ home 首页信息流 / list 频道与标签列表 /
        drama 单部剧详情（要 drama_id）/ play 单部剧的清单原文（要 drama_id）/ topic 专题 /
        rank 排行下发 / ops 运营下发（公告、广告、热搜词）/ all 全部可清缓存。
        docs/06 第 28 节还列了「搜索」，但搜索结果目前没有缓存（搜索功能随 S3-4 实现），所以没有这个范围。
      enum: [site_config, home, list, drama, play, topic, rank, ops, all]
    AdminCacheScopeInfo:
      type: object
      required: [scope, title, desc, needs_drama]
      properties:
        scope: { $ref: "#/components/schemas/AdminCacheScope" }
        title: { type: string, description: 页面上显示的名称 }
        desc: { type: string, description: 这个范围清的是什么、什么时候用 }
        needs_drama: { type: boolean, description: 为真时必须带 drama_id }
    AdminCacheKeyPrefix:
      type: object
      required: [prefix, title, purgeable, reason, keys]
      properties:
        prefix: { type: string, description: "Valkey 键前缀（含 xsite 命名空间），* 结尾表示按前缀统计", example: "xsite:content:*" }
        title: { type: string }
        purgeable: { type: boolean, description: 是否属于可清的读穿缓存 }
        reason: { type: string, description: 不可清的原因（有状态数据）；可清时为空 }
        keys: { type: integer, format: int64, description: 当前匹配的键数量 }
    AdminCacheOverview:
      type: object
      required: [site_version, total_keys, memory_used, memory_text, scopes, prefixes]
      properties:
        site_version: { type: integer, format: int64, description: 当前站点配置版本（前台配置的 ETag 由它派生） }
        total_keys: { type: integer, format: int64, description: Valkey 当前库的键总数，含有状态数据 }
        memory_used: { type: integer, format: int64, description: Valkey 已用内存字节数；取不到时为 0 }
        memory_text: { type: string, description: 便于阅读的内存占用；取不到时为空, example: 1.52M }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AdminCacheScopeInfo" }
        prefixes:
          type: array
          description: 各键前缀的当前键数；purgeable=false 的是故意不清的有状态数据
          items: { $ref: "#/components/schemas/AdminCacheKeyPrefix" }
    AdminCachePurgeRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope: { $ref: "#/components/schemas/AdminCacheScope" }
        drama_id:
          type: integer
          format: int64
          minimum: 1
          description: 剧集编号；scope=drama 或 play 时必填，其余范围忽略
    AdminCachePurgeResult:
      type: object
      required: [scope, keys]
      properties:
        scope: { $ref: "#/components/schemas/AdminCacheScope" }
        keys: { type: integer, format: int64, description: 实际删除的键数量 }
        site_version:
          type: integer
          format: int64
          description: 版本 +1 之后的新站点版本；只有 scope=site_config 或 all 时返回
    AdminFTPProbeResult:
      type: object
      required: [ok, elapsed_ms, steps, path, entries, truncated]
      properties:
        ok: { type: boolean, description: 全部步骤成功 }
        elapsed_ms: { type: integer, format: int64 }
        steps:
          type: array
          description: 按顺序执行的步骤；某一步失败（ok=false）后不再继续
          items:
            type: object
            required: [name, ok, ms, message]
            properties:
              name:
                type: string
                enum: [resolve, connect, login, list]
                description: resolve 解析地址并校验出站策略 / connect 建立连接（含 TLS 握手）/ login 登录 / list 进入目录并读取
              ok: { type: boolean }
              ms: { type: integer, format: int64 }
              message: { type: string, description: 中文说明：失败原因（服务器原始应答最多保留 200 字）或结果摘要 }
        path: { type: string, description: 服务器返回的实际目录；没有走到读取目录时为空 }
        entries:
          type: array
          description: 目录条目；只有打开目录返回，测连为空数组
          items:
            type: object
            required: [name, type, size, modified_at, target]
            properties:
              name: { type: string }
              type: { type: string, enum: [dir, file, link] }
              size: { type: integer, format: int64, minimum: 0, description: 字节数；目录为 0 }
              modified_at: { type: [string, "null"], format: date-time, description: 服务器没有给出时间时为 null }
              target: { type: string, description: 符号链接的目标，其余为空 }
        truncated: { type: boolean, description: 超过 1000 条时为 true，只返回前 1000 条 }
    # ---------- 反馈社区（feedback/docs/03，迁移 00012）----------
    FbStatus:
      type: string
      description: 反馈状态（adr/0004）
      enum: [submitted, triaged, planned, in_progress, verifying, shipped, closed, duplicate, declined]
    FbKind:
      type: string
      description: 反馈类型（competitor 为迁移 00016 新增的「竞品发现」）
      enum: [bug, experience, feature, content, access, competitor, other]
    FbPriority:
      type: string
      enum: [critical, high, medium, low, unset]
    FbVisibility:
      type: string
      description: public 所有人可见，members 仅项目成员，private 仅作者与项目团队
      enum: [public, members, private]
    FbProjectStatus:
      type: string
      enum: [draft, recruiting, active, paused, archived]
    FbJoinMode:
      type: string
      description: open 可自助加入，application 需审核，invite_only 只能用邀请码，closed 不接受新成员
      enum: [open, application, invite_only, closed]
    FbMemberRole:
      type: string
      description: member 是测试成员，其余属于项目团队
      enum: [member, operator, maintainer, owner]
    FbUserStatus:
      type: string
      enum: [active, restricted, suspended]
    FbUser:
      type: object
      properties:
        id: { type: integer, format: int64 }
        handle: { type: string, description: 用户名，大小写不敏感唯一 }
        nickname: { type: string }
        bio: { type: string }
        show_level: { type: boolean, description: 是否公开贡献等级与署名 }
        status: { $ref: "#/components/schemas/FbUserStatus" }
        tester_no: { type: integer, format: int64, description: 内测编号（从 1001 起），展示署名用，不暴露用户 ID }
        points: { type: integer, description: 贡献值（非货币化，adr/0005） }
        created_at: { type: string, format: date-time }
    FbAuthResult:
      type: object
      properties:
        user: { $ref: "#/components/schemas/FbUser" }
        token: { type: string, description: 会话令牌，由 H5 前台服务端存成 HttpOnly Cookie 并以 Bearer 转发 }
        expires_in: { type: integer, format: int64, description: 空闲过期秒数（滑动） }
        # 没有 recovery_code：恢复码已删除（adr/0011），任何认证响应都不再返回找回凭据。
    FbRegisterRequest:
      type: object
      required: [handle, password, invite_code]
      properties:
        handle: { type: string, minLength: 3, maxLength: 32, description: 3–32 位字母数字下划线连字符，不能全是数字 }
        password: { type: string, minLength: 12, maxLength: 128 }
        invite_code: { type: string, description: 大小写与连字符不敏感 }
        nickname: { type: string, maxLength: 40 }
        # 没有 ack_no_recovery：注册不再发恢复码，也就没有需要用户确认的找回凭据（adr/0011）。
        # 注意主平台的 RegisterRequest 仍有同名字段，那是另一套账号体系，不要一起改。
    FbLoginRequest:
      type: object
      required: [handle, password]
      properties:
        handle: { type: string }
        password: { type: string }
    # FbRecoverRequest 已随 /auth/recover 一起删除（0.41.0，adr/0011）。
    FbChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 128 }
    FbProfileRequest:
      type: object
      properties:
        nickname: { type: string, maxLength: 40 }
        bio: { type: string, maxLength: 300 }
        show_level: { type: boolean }
    FbProject:
      type: object
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        key_prefix: { type: string, description: 反馈编号前缀，如 APP-1024 中的 APP }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        cover: { type: string }
        try_url: { type: string, description: 「去试用」地址，只允许 https }
        status: { $ref: "#/components/schemas/FbProjectStatus" }
        visibility: { type: string, enum: [public, members] }
        join_mode: { $ref: "#/components/schemas/FbJoinMode" }
        sort: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FbProjectView:
      allOf:
        - $ref: "#/components/schemas/FbProject"
        - type: object
          properties:
            joined: { type: boolean, description: 当前访问者是否已加入 }
            member_role: { $ref: "#/components/schemas/FbMemberRole" }
            member_status:
              type: string
              enum: ["", active, pending, removed]
              description: |
                访问者在该项目的成员状态；空串表示还不是成员。
                pending 表示申请中，前台据此把「申请加入」换成「申请中，等待确认」。
            member_count: { type: integer, format: int64 }
            feedback_count: { type: integer, format: int64 }
    FbProjectInput:
      type: object
      required: [slug, key_prefix, name]
      properties:
        slug: { type: string, description: 2–48 位小写字母数字连字符 }
        key_prefix: { type: string, description: 2–8 位大写字母数字，以字母开头 }
        name: { type: string, maxLength: 60 }
        summary: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        cover: { type: string }
        try_url: { type: string, description: 只允许 https }
        status: { $ref: "#/components/schemas/FbProjectStatus" }
        visibility: { type: string, enum: [public, members] }
        join_mode: { $ref: "#/components/schemas/FbJoinMode" }
        sort: { type: integer }
    FbMember:
      type: object
      properties:
        project_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        handle: { type: string }
        nickname: { type: string }
        user_status: { $ref: "#/components/schemas/FbUserStatus" }
        role: { $ref: "#/components/schemas/FbMemberRole" }
        status: { type: string, enum: [pending, active, removed] }
        joined_at: { type: string, format: date-time }
    FbInvite:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code_hint: { type: string, description: 明文前 4 位，供运营辨认 }
        project_id: { type: integer, format: int64, description: 为 0 表示只注册、不自动加入项目 }
        project_name: { type: string }
        role: { $ref: "#/components/schemas/FbMemberRole" }
        max_uses: { type: integer }
        used_count: { type: integer }
        note: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    FbInviteInput:
      type: object
      properties:
        project_id: { type: integer, format: int64, description: 留空表示只注册、不加入项目 }
        role: { $ref: "#/components/schemas/FbMemberRole" }
        max_uses: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        note: { type: string, maxLength: 100 }
        expires_at: { type: string, format: date-time, nullable: true }
    FbPost:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        project_name: { type: string }
        project_slug: { type: string }
        kind: { type: string, enum: [announcement, test_task, changelog] }
        title: { type: string }
        body: { type: string, description: 受限 Markdown 源文 }
        status: { type: string, enum: [draft, published, hidden] }
        visibility: { type: string, enum: [public, members] }
        pinned: { type: boolean }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FbPostInput:
      type: object
      required: [project_id, kind, title]
      properties:
        project_id: { type: integer, format: int64 }
        kind: { type: string, enum: [announcement, test_task, changelog] }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 50000 }
        status: { type: string, enum: [draft, published, hidden] }
        visibility: { type: string, enum: [public, members] }
        pinned: { type: boolean }
    FbFeedback:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        project_slug: { type: string }
        project_name: { type: string }
        number: { type: integer, format: int64, description: 项目内连续编号 }
        key: { type: string, description: 展示编号，如 APP-1024 }
        author_id: { type: integer, format: int64 }
        author_handle: { type: string }
        author_nickname: { type: string }
        kind: { $ref: "#/components/schemas/FbKind" }
        title: { type: string }
        body: { type: string }
        env: { type: string, description: 机型、浏览器、网络等上下文；不含精确位置 }
        visibility: { $ref: "#/components/schemas/FbVisibility" }
        status: { $ref: "#/components/schemas/FbStatus" }
        priority: { $ref: "#/components/schemas/FbPriority" }
        duplicate_of: { type: integer, format: int64 }
        vote_count: { type: integer }
        voted: { type: boolean, description: 当前访问者是否已投票 }
        source: { $ref: "#/components/schemas/FbSource" }
        api_key_id: { type: integer, format: int64, description: source=open_api 时的来源 Key }
        page_url: { type: string, description: 出问题的页面地址；查询串与片段已在入库前丢弃 }
        contact: { type: string, description: 提交者自愿留的联系方式，只出现在 /api/admin 响应 }
        version: { type: integer, description: 乐观锁，后台保存时回传 }
        last_activity_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    FbFeedbackEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        from_status: { type: string }
        to_status: { $ref: "#/components/schemas/FbStatus" }
        note: { type: string, description: 公开说明 }
        internal_note: { type: string, description: 内部备注，只出现在 /api/admin 响应 }
        actor_name: { type: string }
        created_at: { type: string, format: date-time }
    FbFeedbackDetail:
      type: object
      properties:
        feedback: { $ref: "#/components/schemas/FbFeedback" }
        events: { type: array, items: { $ref: "#/components/schemas/FbFeedbackEvent" } }
    FbSubmitRequest:
      type: object
      required: [project_slug, kind, title, body]
      properties:
        project_slug: { type: string }
        kind: { $ref: "#/components/schemas/FbKind" }
        title: { type: string, minLength: 4, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        env: { type: string, maxLength: 500 }
        page_url: { type: string, maxLength: 500, description: 出问题的页面地址；查询串与片段会被丢弃 }
        visibility: { $ref: "#/components/schemas/FbVisibility" }
    FbTriageRequest:
      type: object
      required: [version]
      properties:
        status: { $ref: "#/components/schemas/FbStatus" }
        priority: { $ref: "#/components/schemas/FbPriority" }
        visibility: { $ref: "#/components/schemas/FbVisibility" }
        duplicate_of: { type: integer, format: int64, description: status=duplicate 时必填，必须同项目 }
        note: { type: string, maxLength: 1000, description: 公开说明；status=declined 时必填 }
        internal_note: { type: string, maxLength: 1000, description: 内部备注，不下发前台 }
        version: { type: integer, description: 当前版本号，不一致返回 409 }
    FbLeaderboardEntry:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        handle: { type: string }
        nickname: { type: string }
        points: { type: integer }
    # ---------- 运营（docs/specs/A3-4.md） ----------
    AnnouncementPage:
      type: string
      enum: [home, explore, channel, tag, topic, drama, play, shua, rank, search, me]
      description: 公告可以出现的前台页面
    Locale:
      type: string
      enum: [zh-CN, en, es, vi, ja, ko, th, hi, ar]
    PublicAnnouncement:
      type: object
      required: [id, kind, content, click_url, frequency, pages, image]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [topbar, popup], description: topbar 顶部滚动条、popup 弹窗 }
        content: { type: string }
        click_url: { type: string, description: 跳转地址（站内路径或 http(s) 地址），空表示不跳转 }
        frequency: { type: string, enum: [always, once, daily], description: always 每次显示、once 每人一次、daily 每人每天一次 }
        pages: { type: array, items: { $ref: "#/components/schemas/AnnouncementPage" }, description: 出现页面，空数组表示全部页面 }
        image: { type: string, description: 弹窗配图（资源路径或图片地址），没有时为空 }
    AdminAnnouncement:
      type: object
      required: [id, kind, content, click_url, frequency, pages, locales, image, start_at, end_at, status, display_status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [topbar, popup, inbox] }
        content: { type: string }
        click_url: { type: string }
        frequency: { type: string, enum: [always, once, daily] }
        pages: { type: array, items: { $ref: "#/components/schemas/AnnouncementPage" }, description: 空数组表示全部页面 }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" }, description: 投放语言，空数组表示全部语言 }
        image: { type: string }
        start_at: { type: [string, "null"], format: date-time }
        end_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, inactive] }
        display_status: { type: string, enum: [live, scheduled, ended, inactive], description: live 显示中、scheduled 未开始、ended 已结束、inactive 已停用 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminAnnouncementPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminAnnouncement" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminAnnouncementRequest:
      type: object
      required: [kind, content]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [topbar, popup], description: 站内信 inbox 暂未开放 }
        content: { type: string, minLength: 1, maxLength: 500, description: 去掉首尾空白后 1–500 个字 }
        click_url: { type: string, maxLength: 500, description: 站内路径（/ 开头，不能是 //）或 http(s) 完整地址；留空不跳转 }
        frequency: { type: string, enum: [always, once, daily], default: always }
        pages: { type: array, items: { $ref: "#/components/schemas/AnnouncementPage" }, description: 去重后按固定顺序保存；不传或空数组表示全部页面 }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" }, description: 不传或空数组表示全部语言 }
        image: { type: string, maxLength: 500, description: 弹窗配图，规则同 click_url；不是弹窗时忽略 }
        start_at: { type: [string, "null"], format: date-time, description: 为空表示立即开始 }
        end_at: { type: [string, "null"], format: date-time, description: 为空表示不结束；须晚于开始时间 }
        status: { type: string, enum: [active, inactive], default: active }
    AdSlot:
      type: string
      enum: [global_popup, home_top, home_mid, home_bottom, footer_banner, list_feed, detail_banner, preroll, pause, immersive_feed, text_link, app_download]
      description: |
        广告位置：global_popup 全站弹窗、home_top / home_mid / home_bottom 首页顶 / 中 / 底横幅、footer_banner 页脚横幅、
        list_feed 列表信息流、detail_banner 详情页横幅、preroll 播放前贴片、pause 暂停贴片、immersive_feed 沉浸流插入、
        text_link 文字链、app_download App 下载浮窗
    PublicAd:
      type: object
      required: [id, slot, creative_type, image, video_url, text, html, alt, click_url]
      properties:
        id: { type: integer, format: int64, description: 上报曝光 / 点击时用 }
        slot: { $ref: "#/components/schemas/AdSlot" }
        creative_type: { type: string, enum: [image, video, text, html] }
        image: { type: string, description: 图片素材；视频素材的封面（可为空） }
        video_url: { type: string }
        text: { type: string }
        html: { type: string, description: 已清洗的自定义 HTML，只能在沙箱 iframe 中渲染 }
        alt: { type: string, description: 图片 / 视频说明 }
        click_url: { type: string, description: 跳转地址（站内路径或 http(s) 地址），空表示不跳转 }
    CommentAuthor:
      type: object
      required: [is_guest, nickname]
      description: 评论作者的展示信息（S2-5）。游客 is_guest=true、nickname「游客」，不含 user_id、不暴露用户名。
      properties:
        is_guest: { type: boolean }
        user_id: { type: integer, format: int64, description: 注册用户才有 }
        nickname: { type: string }
        avatar: { type: string }
    CommentView:
      type: object
      required: [id, content, image_count, like_count, created_at, author]
      description: 评论列表的一项（S2-5）。
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, description: 回复目标，顶层评论无此字段 }
        content: { type: string, description: 命中 mask 的词已替换为 *** }
        image_count: { type: integer }
        like_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/CommentAuthor" }
    CommentPage:
      type: object
      required: [list]
      description: 一页评论（游标分页）。next_cursor 为空表示没有更多。
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/CommentView" } }
        next_cursor: { type: string }
    Comment:
      type: object
      required: [id, episode_id, content, status, like_count, created_at]
      description: 发表评论的回执（S2-5）。status=visible 立即可见；pending 审核中（先审后显或命中 review 词）。
      properties:
        id: { type: integer, format: int64 }
        episode_id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64 }
        content: { type: string }
        status: { type: string, enum: [pending, visible, hidden] }
        like_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    DanmakuView:
      type: object
      required: [id, time_ms, content, color]
      description: 按窗口拉取的一条弹幕（S2-5），仅播放器需要的最小字段。
      properties:
        id: { type: integer, format: int64 }
        time_ms: { type: integer, description: 出现时间（毫秒） }
        content: { type: string }
        color: { type: string, description: RRGGBB }
    Danmaku:
      type: object
      required: [id, episode_id, time_ms, content, color, status, created_at]
      description: 发送弹幕的回执（S2-5）。status=visible 立即可见；pending 审核中（命中 review 词）。
      properties:
        id: { type: integer, format: int64 }
        episode_id: { type: integer, format: int64 }
        time_ms: { type: integer }
        content: { type: string }
        color: { type: string, description: RRGGBB }
        status: { type: string, enum: [pending, visible, hidden] }
        created_at: { type: string, format: date-time }
    EmojiView:
      type: object
      required: [code, image]
      description: 前台下发的一个表情（S2-5）。code 形如 [微笑]，前台在评论 / 弹幕文本里替换为 image。
      properties:
        code: { type: string }
        image: { type: string, description: 资源路径或地址 }
    EmojiPackView:
      type: object
      required: [id, name, emojis]
      description: 前台下发的一个表情包（S2-5）。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        emojis: { type: array, items: { $ref: "#/components/schemas/EmojiView" } }
    AdminEmoji:
      type: object
      required: [id, pack_id, code, image, sort, created_at]
      description: 后台表情（S2-5）。
      properties:
        id: { type: integer, format: int64 }
        pack_id: { type: integer, format: int64 }
        code: { type: string }
        image: { type: string }
        sort: { type: integer }
        created_at: { type: string, format: date-time }
    AdminEmojiPack:
      type: object
      required: [id, name, sort, created_at, emojis]
      description: 后台表情包（S2-5），含其表情。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer }
        created_at: { type: string, format: date-time }
        emojis: { type: array, items: { $ref: "#/components/schemas/AdminEmoji" } }
    AdminEmojiPackRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32, description: 去首尾空白后 1–32 个字 }
        sort: { type: integer, description: 排序，越小越靠前 }
    AdminEmojiRequest:
      type: object
      required: [code, image]
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 32, description: "表情码，形如 [微笑]，全局唯一" }
        image: { type: string, maxLength: 500, description: 资源路径或地址 }
        sort: { type: integer, description: 排序，越小越靠前 }
    AdminReport:
      type: object
      required: [id, target_type, target_id, reason, detail, status, handle_note, reporter, created_at]
      description: 后台举报队列的一项（S2-5，§25）。reporter 为举报人展示（游客不暴露用户名）。
      properties:
        id: { type: integer, format: int64 }
        target_type: { type: string, enum: [comment, danmaku, drama, comment_image] }
        target_id: { type: integer, format: int64 }
        reason: { type: string, enum: [attack, vulgar, illegal, minor, ad, spoiler, other] }
        detail: { type: string }
        status: { type: string, enum: [pending, resolved, rejected] }
        handle_note: { type: string }
        reporter: { $ref: "#/components/schemas/CommentAuthor" }
        created_at: { type: string, format: date-time }
    UserAccount:
      type: object
      required: [id, username, nickname, avatar, bio, status, locale, verified_at, created_at]
      description: |
        后台用户列表 / 改状态返回的注册用户（S2-7，§26）。不含密码哈希 —— 后台没有任何接口读它，
        也不提供重设密码（docs/adr/0001）。
      properties:
        id: { type: integer, format: int64 }
        username: { type: string, description: "注册时固定、全小写，3–32 位的小写字母 / 数字 / 下划线" }
        nickname: { type: string }
        avatar: { type: string }
        bio: { type: string }
        status: { $ref: "#/components/schemas/UserAccountStatus" }
        locale: { type: string, description: 界面语言，未设置时为空串 }
        verified_at: { type: [string, "null"], format: date-time, description: 为空表示未做过验证（目前还没有写入它的业务） }
        created_at: { type: string, format: date-time }
    UserAccountStatus:
      type: string
      enum: [normal, muted, banned]
      description: |
        账号状态（§26）：normal 正常；muted 禁言，能登录与观看但发不出评论 / 弹幕；
        banned 封禁，立即下线全部设备、不能再登录，也发不出评论 / 弹幕。
    UserAccountStats:
      type: object
      required: [comment_count, danmaku_count, report_sent, report_against, follow_count, history_count, session_count]
      description: |
        用户详情里的社区足迹（S2-7，§26）。§26 还要求会员状态、等级成长值、金币余额、邀请关系与风控标记，
        那些表要等会员支付（S3-10）与福利体系（M6），本切片不含。
      properties:
        comment_count: { type: integer, format: int64, description: 未删除的评论数 }
        danmaku_count: { type: integer, format: int64 }
        report_sent: { type: integer, format: int64, description: 他发出的举报数 }
        report_against: { type: integer, format: int64, description: 针对他所发评论 / 弹幕的举报数 }
        follow_count: { type: integer, format: int64 }
        history_count: { type: integer, format: int64 }
        session_count: { type: integer, format: int64, description: 当前有效会话（登录设备）数 }
    UserAccountDetail:
      allOf:
        - $ref: "#/components/schemas/UserAccount"
        - type: object
          required: [nickname_status, bio_status, avatar_status, history_paused, stats]
          properties:
            nickname_status: { type: string, enum: [ok, pending, rejected], description: 命中先审词时为 pending }
            bio_status: { type: string, enum: [ok, pending, rejected] }
            avatar_status: { type: string, enum: [ok, pending, rejected] }
            history_paused: { type: boolean, description: 用户自己关掉了看剧历史记录 }
            stats: { $ref: "#/components/schemas/UserAccountStats" }
    GuestDevice:
      type: object
      required: [id, first_seen, source_channel, platform, attest_level, merged_user_id, merged_username]
      description: |
        游客设备（S2-7，§26「类型＝游客」）。只读：guest_device 没有账号状态列，
        约束游客只能用站点的「游客互动」功能开关。
      properties:
        id: { type: string, format: uuid, description: 设备编号（uuid v7） }
        first_seen: { type: string, format: date-time }
        source_channel: { type: string, description: 来源渠道，未带时为空串 }
        platform: { type: string, enum: [web, ios, android] }
        attest_level: { type: string, enum: [none, basic, strong], description: 设备校验强度 }
        merged_user_id: { type: [integer, "null"], format: int64, description: 非空表示该设备的数据已并入这个注册账号 }
        merged_username: { type: string, description: 已并入账号的用户名，未并入时为空串 }
    CommentPolicy:
      type: object
      required: [pre_moderation]
      additionalProperties: false
      description: 评论先审后显开关（S2-5，§24）。
      properties:
        pre_moderation: { type: boolean, description: 为 true 时所有评论先进待审 }
    ModerationItem:
      type: object
      required: [id, kind, episode_id, content, status, author, report_count, hit_words, created_at]
      description: 评论 / 弹幕审核列表的一项（S2-5，§24）。按 kind 取用各自特有字段；hit_words 为当前命中的屏蔽词。
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [comment, danmaku] }
        episode_id: { type: integer, format: int64 }
        content: { type: string }
        status: { type: string, enum: [pending, visible, hidden] }
        author: { $ref: "#/components/schemas/CommentAuthor" }
        report_count: { type: integer, format: int64 }
        hit_words: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        parent_id: { type: integer, format: int64, description: 评论特有：回复目标 }
        like_count: { type: integer, format: int64, description: 评论特有 }
        time_ms: { type: integer, description: 弹幕特有：出现时间（毫秒） }
        color: { type: string, description: 弹幕特有：RRGGBB }
    Blockword:
      type: object
      required: [id, word, group, action, created_at]
      description: 屏蔽词（docs/02 第 5.7 节，S2-4）。word 为规范化后的形式。
      properties:
        id: { type: integer, format: int64 }
        word: { type: string, description: 规范化后的词（全角转半角、小写、去零宽字符） }
        group: { type: string, description: 分组（如「引流」），可空 }
        action: { type: string, enum: [block, mask, review], description: 处理办法：block 直接拦 / mask 变 *** / review 先送审 }
        created_at: { type: string, format: date-time }
    AdminVIPPlan:
      type: object
      required: [id, code, duration_days, price_fen, list_price_fen, price_micro_usdt, badge_key, recommended, channels, clients, sort, status, updated_at]
      description: 后台会员套餐配置。金额均为整数最小单位；code 固定，名称由用户端按 code 本地化。
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, enum: [day, week, month, quarter, year] }
        duration_days: { type: integer, minimum: 1, maximum: 3660 }
        price_fen: { type: integer, format: int64, minimum: 0, description: 人民币分 }
        list_price_fen: { type: integer, format: int64, minimum: 0, description: 人民币划线价（分）；0 表示不展示 }
        price_micro_usdt: { type: integer, format: int64, minimum: 0, description: USDT 微单位（10^-6） }
        badge_key: { type: string, maxLength: 64, description: 用户端角标 i18n 键；空串表示无角标 }
        recommended: { type: boolean }
        channels:
          type: array
          items: { type: string, enum: [alipay, wechat, usdt, iap_apple, iap_google] }
        clients:
          type: array
          items: { type: string, enum: [web_pc, web_mobile, app_official, app_store] }
        sort: { type: integer, minimum: 0, maximum: 9999 }
        status: { type: string, enum: [on, off] }
        updated_at: { type: string, format: date-time }
    AdminVIPPlanUpdateRequest:
      type: object
      required: [duration_days, price_fen, list_price_fen, price_micro_usdt, badge_key, recommended, channels, clients, sort, status]
      additionalProperties: false
      properties:
        duration_days: { type: integer, minimum: 1, maximum: 3660 }
        price_fen: { type: integer, format: int64, minimum: 0 }
        list_price_fen: { type: integer, format: int64, minimum: 0 }
        price_micro_usdt: { type: integer, format: int64, minimum: 0 }
        badge_key: { type: string, maxLength: 64, description: 为空表示无角标；非空必须是 vip. 前缀的 i18n 键 }
        recommended: { type: boolean }
        channels:
          type: array
          items: { type: string, enum: [alipay, wechat, usdt, iap_apple, iap_google] }
        clients:
          type: array
          items: { type: string, enum: [web_pc, web_mobile, app_official, app_store] }
        sort: { type: integer, minimum: 0, maximum: 9999 }
        status: { type: string, enum: [on, off] }
    AdminAd:
      type: object
      required: [id, name, slot, creative_type, image, video_url, text, html, alt, click_url, device, locales, weight, end_at, freq_cap, status, display_status, imp_count, click_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slot: { $ref: "#/components/schemas/AdSlot" }
        creative_type: { type: string, enum: [image, video, text, html] }
        image: { type: string }
        video_url: { type: string }
        text: { type: string }
        html: { type: string, description: 清洗后的 HTML }
        alt: { type: string }
        click_url: { type: string }
        device: { type: string, enum: [all, mobile, desktop] }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" }, description: 投放语言，空数组表示全部语言 }
        weight: { type: integer, minimum: 1, maximum: 100 }
        end_at: { type: [string, "null"], format: date-time }
        freq_cap: { type: integer, minimum: 0, maximum: 1000, description: 每设备每天曝光上限，0 表示不限 }
        status: { type: string, enum: [active, inactive] }
        display_status: { type: string, enum: [live, ended, inactive], description: live 投放中、ended 已结束、inactive 已停用 }
        imp_count: { type: integer, format: int64, description: 累计曝光（最多晚 1 分钟） }
        click_count: { type: integer, format: int64, description: 累计点击（最多晚 1 分钟） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminAdPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminAd" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AdminAdRequest:
      type: object
      required: [name, slot, creative_type]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50, description: 广告名（后台识别用），去掉首尾空白后 1–50 个字 }
        slot: { $ref: "#/components/schemas/AdSlot" }
        creative_type: { type: string, enum: [image, video, text, html], description: html 要 ads.custom_html 权限 }
        image: { type: string, maxLength: 500, description: 图片素材（creative_type=image 时必填）或视频封面；资源路径（/ 开头）或 http(s) 地址 }
        video_url: { type: string, maxLength: 500, description: 视频素材（creative_type=video 时必填），规则同 image }
        text: { type: string, maxLength: 200, description: 文字内容（creative_type=text 时必填） }
        html: { type: string, maxLength: 10000, description: 自定义 HTML（creative_type=html 时必填），保存时按白名单清洗 }
        alt: { type: string, maxLength: 100, description: 图片 / 视频说明 }
        click_url: { type: string, maxLength: 500, description: 站内路径（/ 开头，不能是 //）或 http(s) 完整地址；留空不跳转 }
        device: { type: string, enum: [all, mobile, desktop], default: all }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" }, description: 不传或空数组表示全部语言 }
        weight: { type: integer, minimum: 0, maximum: 100, default: 10, description: 出现机会（同一位置内的权重，1–100）；0 或不传按 10 }
        end_at: { type: [string, "null"], format: date-time, description: 为空表示一直投放 }
        freq_cap: { type: integer, minimum: 0, maximum: 1000, default: 0, description: 每设备每天曝光上限（北京时间），0 表示不限 }
        status: { type: string, enum: [active, inactive], default: active }
    PublicHotWord:
      type: object
      required: [word, pinned]
      properties:
        word: { type: string, description: 规范化后的词 }
        pinned: { type: boolean, description: 是否运营置顶 }
    AdminHotWord:
      type: object
      required: [id, word, search_count, miss_count, pinned, pin_sort, visible, source, last_searched_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        word: { type: string }
        search_count: { type: integer, format: int64, description: 累计搜索次数（每小时更新） }
        miss_count: { type: integer, format: int64, description: 搜了但片库没有结果的次数 }
        pinned: { type: boolean }
        pin_sort: { type: integer, description: 置顶顺序，从 1 开始；未置顶为 0 }
        visible: { type: boolean, description: 是否显示在热搜榜；置顶的一定显示 }
        source: { type: string, enum: [manual, auto], description: manual 后台手动加、auto 用户搜过自动收录 }
        last_searched_at: { type: [string, "null"], format: date-time, description: 最近一次有搜索的落库时间（按小时）；手动加且没人搜过时为 null }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: 后台最后修改时间（计数落库不改） }
    AdminHotWordPage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminHotWord" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    RankBoard:
      type: string
      enum: [drama_week, drama_month]
      description: drama_week 剧集周榜、drama_month 剧集月榜（追剧、点赞、看完的数据接入前两张榜的分数相同）
    RankWeights:
      type: object
      description: 计分系数。分数 = 播放 × play + 追剧 × follow + 点赞 × like + 看完 × finish + 运营加分；默认 1 / 3 / 2 / 2
      required: [play, follow, like, finish]
      additionalProperties: false
      properties:
        play: { type: number, minimum: 0, maximum: 1000, description: 播放的系数，保留两位小数 }
        follow: { type: number, minimum: 0, maximum: 1000, description: 追剧的系数 }
        like: { type: number, minimum: 0, maximum: 1000, description: 点赞的系数 }
        finish: { type: number, minimum: 0, maximum: 1000, description: 看完的系数 }
    PublicRankItem:
      type: object
      required: [rank, heat, drama]
      properties:
        rank: { type: integer, minimum: 1, description: 名次，从 1 开始连续编号 }
        heat: { type: number, description: 热度值（算出的分数，保留两位小数；运营减分后可能为负） }
        drama: { $ref: "#/components/schemas/DramaCard" }
    PublicRankBoard:
      type: object
      required: [board, computed_at, list]
      properties:
        board: { $ref: "#/components/schemas/RankBoard" }
        computed_at: { type: [string, "null"], format: date-time, description: 本次结果的排名时间 }
        list: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PublicRankItem" } }
    AdminRankOverride:
      type: object
      description: 一部剧在这张榜上的人工调整
      required: [drama_id, title, drama_status, in_trash, pinned, blocked, boost, updated_at]
      properties:
        drama_id: { type: integer, format: int64 }
        title: { type: string }
        drama_status: { type: string, enum: [draft, published, offline], description: 剧现在的状态；前台不可见（未上架、已下架、定时未到点或在回收站）时不上榜，调整保留 }
        in_trash: { type: boolean, description: 剧是否在回收站 }
        pinned: { type: boolean, description: 置顶：排在最前，多部置顶之间按分数 }
        blocked: { type: boolean, description: 不让上榜 }
        boost: { type: integer, format: int64, description: 运营加分，负数为减分 }
        updated_at: { type: string, format: date-time }
    AdminRankRow:
      type: object
      required: [rank, drama_id, title, heat, pinned]
      properties:
        rank: { type: integer, minimum: 1 }
        drama_id: { type: integer, format: int64 }
        title: { type: string, description: 剧名；剧已被彻底删除时为空字符串 }
        heat: { type: number, description: 分数（保留两位小数） }
        pinned: { type: boolean, description: 是否因置顶排在前面。只有 preview 标出；live 来自线上榜单，不存这个标记，恒为 false }
    AdminRankBoard:
      type: object
      required: [board, overrides, computed_at, live, preview]
      properties:
        board: { $ref: "#/components/schemas/RankBoard" }
        overrides: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AdminRankOverride" }, description: 这张榜全部的人工调整：置顶的在前，其次不让上榜的，再按加分从高到低 }
        computed_at: { type: [string, "null"], format: date-time, description: 线上榜单的排名时间；还没算过为 null }
        live: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AdminRankRow" }, description: 前台正在显示的前 20 名（上次重新排名的结果，读的时候不去掉之后下架的剧） }
        preview: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AdminRankRow" }, description: 按当前系数与人工调整现算的前 20 名 }
    # ---------- 站点编排：静态页、前台菜单、页面区块（docs/06 第 12、13、15 节，docs/specs/A3-1.md）----------
    PageBodyFormat:
      type: string
      enum: [rich, html]
      description: rich 后台富文本编辑器，html 直接写 HTML；两种格式入库前都按同一白名单清洗
    PublicStaticPage:
      type: object
      required: [slug, title, body, seo_title, seo_desc, updated_at]
      properties:
        slug: { type: string }
        title: { type: string }
        body: { type: string, description: 已清洗的 HTML，可直接渲染 }
        seo_title: { type: string, description: 为空时前台用 title }
        seo_desc: { type: string }
        updated_at: { type: string, format: date-time }
    AdminStaticPage:
      type: object
      required: [id, title, slug, body, body_format, status, seo_title, seo_desc, is_footer, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string, description: "前台地址 /p/{slug}" }
        body: { type: string, description: 清洗后的 HTML（保存时清洗，这里是清洗结果） }
        body_format: { $ref: "#/components/schemas/PageBodyFormat" }
        status: { type: string, enum: [draft, published], description: 草稿不对前台下发 }
        seo_title: { type: string }
        seo_desc: { type: string }
        is_footer: { type: boolean, description: 已发布且标记为页脚页的会出现在前台页脚「帮助与条款」 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminStaticPageRequest:
      type: object
      required: [title, slug, body]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 100, description: 去掉首尾空白后 1–100 个字 }
        slug: { type: string, maxLength: 64, description: 小写字母、数字与连字符，首尾为字母或数字；保存时转小写，全站唯一 }
        body: { type: string, maxLength: 100000, description: 正文；按白名单清洗后入库，清洗后为空或超过 50000 个字符返回 400 }
        body_format: { $ref: "#/components/schemas/PageBodyFormat" }
        status: { type: string, enum: [draft, published], default: draft }
        seo_title: { type: string, maxLength: 100 }
        seo_desc: { type: string, maxLength: 200 }
        is_footer: { type: boolean, default: false }
    AdminStaticPagePage:
      type: object
      required: [list, total, page, page_size]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/AdminStaticPage" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    # ---------- 议题区与开放提交接口（feedback/docs/03，迁移 00016）----------
    FbSource:
      type: string
      description: community 为社区用户自己提交，open_api 为外部网站经 API Key 送入
      enum: [community, open_api]
    FbTopicStatus:
      type: string
      description: open 即前台显示的「征集中」；draft 与 archived 不对前台下发
      enum: [draft, open, closed, archived]
    FbTopic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        project_name: { type: string }
        project_slug: { type: string }
        project_cover: { type: string }
        title: { type: string }
        body: { type: string }
        answer_hint: { type: string, description: 回答输入框的引导语 }
        status: { $ref: "#/components/schemas/FbTopicStatus" }
        visibility: { $ref: "#/components/schemas/FbVisibility" }
        pinned: { type: boolean }
        answer_count: { type: integer, description: 可见回答数（含回复），以明细重算 }
        ends_at: { type: [string, "null"], format: date-time, description: 截止时间；为 null 表示不限 }
        published_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        can_answer: { type: boolean, description: 只在前台详情里有意义：当前访问者能否回答 }
    FbAnswer:
      type: object
      description: 一条议题回答。署名用内测编号（tester_no），不暴露社区用户 ID。
      properties:
        id: { type: integer, format: int64 }
        topic_id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, description: 回复的顶层回答；0 表示本身是顶层回答 }
        tester_no: { type: integer, format: int64, description: 内测编号，从 1001 起 }
        handle: { type: string }
        nickname: { type: string }
        body: { type: string }
        featured: { type: boolean, description: 运营标记的精选回答，排在最前 }
        helpful_count: { type: integer }
        helpful_by_me: { type: boolean }
        status: { type: string, enum: [visible, hidden], description: 只出现在 /api/admin 响应 }
        created_at: { type: string, format: date-time }
    FbTopicInput:
      type: object
      required: [project_id, title]
      properties:
        project_id: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, maxLength: 20000 }
        answer_hint: { type: string, maxLength: 200 }
        status: { $ref: "#/components/schemas/FbTopicStatus" }
        visibility: { type: string, enum: [public, members], description: 议题不支持 private }
        pinned: { type: boolean }
        ends_at: { type: [string, "null"], format: date-time }
    FbAnswerRequest:
      type: object
      required: [body]
      properties:
        parent_id: { type: integer, format: int64, description: 回复某条回答；0 表示发顶层回答。只支持一层回复，回复「回复」会被挂到同一个顶层回答下 }
        body: { type: string, minLength: 2, maxLength: 5000 }
    FbHelpfulRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean, description: 目标状态，重复提交结果一致 }
    FbFeaturedRequest:
      type: object
      required: [featured]
      properties:
        featured: { type: boolean }
    FbAnswerStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [visible, hidden] }
    FbAPIKey:
      type: object
      description: 开放提交接口的密钥。明文只在创建响应里出现一次，库里只存 SHA-256 哈希。
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        project_name: { type: string }
        project_slug: { type: string }
        name: { type: string }
        key_hint: { type: string, description: 明文末 6 位，用于在列表里认出是哪一个 }
        default_visibility: { $ref: "#/components/schemas/FbVisibility" }
        allowed_origins:
          type: array
          description: 来源白名单，形如 https://example.com。为空表示不限来源；非空时不带 Origin 的请求一律拒绝
          items: { type: string }
        daily_limit: { type: integer, description: 每日提交上限 }
        status: { type: string, enum: [active, inactive] }
        used_count: { type: integer, format: int64 }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    FbAPIKeyInput:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: integer, format: int64, description: 改的时候忽略：换项目会让历史反馈归属错乱 }
        name: { type: string, minLength: 1, maxLength: 60 }
        default_visibility: { $ref: "#/components/schemas/FbVisibility" }
        allowed_origins: { type: array, maxItems: 20, items: { type: string } }
        daily_limit: { type: integer, minimum: 1, maximum: 100000, default: 500 }
        status: { type: string, enum: [active, inactive], default: active }
    FbIntakeRequest:
      type: object
      required: [title, body]
      description: 所属项目由 API Key 决定，提交方不能指定，未知字段一律拒绝。
      properties:
        kind: { $ref: "#/components/schemas/FbKind" }
        title: { type: string, minLength: 4, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        env: { type: string, maxLength: 500 }
        page_url: { type: string, maxLength: 500, description: 查询串与片段会被丢弃，避免把令牌写进库 }
        contact: { type: string, maxLength: 120 }
    FbIntakeResult:
      type: object
      description: 提交回执，只给可展示给用户的编号与状态，不回显正文。
      properties:
        key: { type: string, description: 展示编号，如 APP-1024 }
        number: { type: integer, format: int64 }
        project_slug: { type: string }
        status: { $ref: "#/components/schemas/FbStatus" }
    # ---------- 域名与证书、安全中心（A4-4 / S4-8）----------
    DomainEntry:
      type: object
      required: [id, host, role, role_title, weight, region, cdn, dns_provider, cert_state, status, status_title, note, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        host: { type: string }
        role: { type: string, enum: [web_primary, web_backup, nav, api, media, admin] }
        role_title: { type: string }
        weight: { type: integer }
        region: { type: string }
        cdn: { type: string }
        dns_provider: { type: string }
        cert_expires_at: { type: ["string", "null"], format: date-time }
        cert_state: { type: string, enum: [ok, expiring, expired, unknown] }
        cert_days_left: { type: ["integer", "null"] }
        status: { type: string, enum: [active, watch, disabled] }
        status_title: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DomainInput:
      type: object
      required: [host, role, weight, status]
      properties:
        host: { type: string, maxLength: 253, description: 只填主机名，不带协议 / 端口 / 路径 }
        role: { type: string, enum: [web_primary, web_backup, nav, api, media, admin] }
        weight: { type: integer, minimum: 1, maximum: 100 }
        region: { type: string, description: ISO 3166-1 alpha-2 或 *（全部地区）；留空按 * }
        cdn: { type: string, maxLength: 64 }
        dns_provider: { type: string, maxLength: 64 }
        cert_expires_at: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [active, watch, disabled] }
        note: { type: string, maxLength: 200 }
    GenCertRequest:
      type: object
      required: [common_name, days]
      properties:
        common_name: { type: string, description: 证书主题 Common Name，域名或泛域名（*.example.com） }
        sans: { type: array, items: { type: string }, description: 附加 SAN，会自动并入 CN，最多 64 个 }
        days: { type: integer, minimum: 1, maximum: 3650 }
        key_type: { type: string, enum: [ec_p256, rsa_2048], default: ec_p256 }
    GeneratedCert:
      type: object
      required: [cert_pem, key_pem, key_type, sans, not_before, not_after, fingerprint]
      properties:
        cert_pem: { type: string }
        key_pem: { type: string, description: 私钥 PEM，只返回这一次，服务端不保存、不记日志、不记审计 }
        key_type: { type: string, enum: [ec_p256, rsa_2048] }
        sans: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint: { type: string, description: 证书 DER 的 SHA-256 指纹（大写、冒号分隔） }
    CertPEMRequest:
      type: object
      required: [cert_pem]
      properties:
        cert_pem: { type: string, description: PEM 证书内容（-----BEGIN CERTIFICATE-----） }
    CertInfo:
      type: object
      required: [subject, issuer, sans, not_before, not_after, fingerprint, is_ca, self_signed]
      properties:
        subject: { type: string }
        issuer: { type: string }
        sans: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint: { type: string }
        is_ca: { type: boolean }
        self_signed: { type: boolean }
    ReleaseHost:
      type: object
      properties:
        host: { type: string }
        weight: { type: integer }
        region: { type: string }
    ReleaseWebEntry:
      type: object
      properties:
        host: { type: string }
        role: { type: string, enum: [primary, backup] }
    ReleasePayload:
      type: object
      required: [v, issued_at, expires_at]
      description: 被签名的清单正文（docs/09 第 4.1 节），不含 sig
      properties:
        v: { type: integer, format: int64 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        api: { type: array, items: { $ref: "#/components/schemas/ReleaseHost" } }
        web: { type: array, items: { $ref: "#/components/schemas/ReleaseWebEntry" } }
        media: { type: array, items: { $ref: "#/components/schemas/ReleaseHost" } }
        nav: { type: string }
    DomainRelease:
      type: object
      required: [version, payload, signature, note, published_at]
      properties:
        version: { type: integer, format: int64 }
        payload: { $ref: "#/components/schemas/ReleasePayload" }
        signature: { type: string }
        note: { type: string }
        published_by: { type: ["integer", "null"], format: int64 }
        published_by_name: { type: string }
        published_at: { type: string, format: date-time }
    ReleasePreview:
      type: object
      required: [version, hosts, payload]
      properties:
        version: { type: integer, format: int64, description: 发布时将使用的版本号 }
        from_version: { type: ["integer", "null"], format: int64 }
        hosts: { type: integer }
        payload: { $ref: "#/components/schemas/ReleasePayload" }
    PublishReleaseRequest:
      type: object
      required: [payload, signature]
      properties:
        payload: { $ref: "#/components/schemas/ReleasePayload" }
        signature: { type: string, description: 离线签名工具签出的 base64 签名 }
        note: { type: string, maxLength: 200 }
    DomainHealthRow:
      type: object
      properties:
        host: { type: string }
        region: { type: string }
        probe_ok: { type: integer, format: int64 }
        probe_fail: { type: integer, format: int64 }
        success_rate: { type: ["number", "null"], description: 探测成功率 0–1，无样本时为空 }
        failover_count: { type: integer, format: int64 }
        fail_reasons: { type: object, additionalProperties: { type: integer, format: int64 } }
    DomainHealthOverview:
      type: object
      required: [list, since_days]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/DomainHealthRow" } }
        since_days: { type: integer }
        note: { type: string, description: 看板为空时的说明 }
    DomainLoginLog:
      type: object
      required: [id, username, result, result_title, suspicious, ip_prefix, ua_digest, created_at]
      properties:
        id: { type: integer, format: int64 }
        admin_id: { type: ["integer", "null"], format: int64 }
        username: { type: string, description: 本次登录尝试用的用户名 }
        current_username: { type: string, description: 关联账号的当前用户名（账号已删时为空） }
        result: { type: string, enum: [success, bad_password, inactive, mfa_failed, locked] }
        result_title: { type: string }
        suspicious: { type: boolean, description: 失败类结果，异常登录告警据此标记 }
        ip_prefix: { type: string }
        ua_digest: { type: string }
        created_at: { type: string, format: date-time }
    DomainLoginLogPage:
      type: object
      required: [list, total, page, page_size, results]
      properties:
        list: { type: array, items: { $ref: "#/components/schemas/DomainLoginLog" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              result: { type: string }
              title: { type: string }
    DomainKeyVersion:
      type: object
      required: [purpose, purpose_title, version, primary]
      properties:
        purpose: { type: string }
        purpose_title: { type: string }
        version: { type: string, description: 密钥标识 kid（不含密钥本身） }
        primary: { type: boolean, description: 是否当前签发 / 加密用 }
    DomainRiskItem:
      type: object
      properties:
        kind: { type: string }
        title: { type: string }
        value: { type: ["integer", "null"], format: int64, description: 为空表示实时计数源未接入 }
        desc: { type: string }
    DomainRiskOverview:
      type: object
      required: [items, note]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DomainRiskItem" } }
        note: { type: string }
  responses:
    AdminDomainResult:
      description: 保存后的域名
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/DomainEntry" } } }
    Error:
      description: 业务错误（加密请求时响应体同样加密）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    EncError:
      description: |
        报文加密协议错误，发生在解密之前，响应为明文 JSON：ENC_REQUIRED、ENC_INVALID、
        ENC_KEY_UNKNOWN（刷新公钥后重试一次）、ENC_TIME_SKEW（按响应 Date 头校准时间后重试一次）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: 429 RATE_LIMITED，按 Retry-After 秒数后再试
      headers:
        Retry-After: { schema: { type: integer }, description: 需等待的秒数 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    # ---------- 内容管理（S1-3）的成功响应 ----------
    AdminOK:
      description: 成功（data 为空）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    AdminDramaPage:
      description: 剧集列表的一页
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminDramaPage" } } }
    AdminDramaResult:
      description: 保存后的剧
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminDrama" } } }
    AdminDramaDetailResult:
      description: 剧集详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminDramaDetail" } } }
    AdminDramaTagsResult:
      description: 保存后的标签
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [tags]
                    properties:
                      tags: { type: array, items: { $ref: "#/components/schemas/AdminTag" } }
    AdminDramaTermsResult:
      description: 保存后的维度取值
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [terms]
                    properties:
                      terms: { type: array, items: { $ref: "#/components/schemas/AdminDramaTerm" } }
    AdminBulkResult:
      description: 受影响的剧数
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [affected]
                    properties:
                      affected: { type: integer, format: int64 }
    AdminEpisodeListResult:
      description: 全部分集（按集号）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminEpisodeList" } } }
    AdminEpisodeResult:
      description: 保存后的分集
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminEpisode" } } }
    AdminMediaUploadResult:
      description: 后台媒体上传会话
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminMediaUpload" } } }
    AdminMediaUploadContentResult:
      description: 二进制内容已流式写入对象存储
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminMediaUploadContent" } } }
    AdminTranscodeJobResult:
      description: 转封装任务
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTranscodeJob" } } }
    AdminEpisodePreviewResult:
      description: 分集试播地址
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminEpisodePreview" } } }
    AdminTranscodeJobPageResult:
      description: 转封装任务的一页
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTranscodeJobPage" } } }
    AdminTagPage:
      description: 标签列表的一页
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTagPage" } } }
    AdminTagResult:
      description: 保存后的标签
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTag" } } }
    AdminTagMergeResult:
      description: 合并结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [merged_into_id, moved_dramas]
                    properties:
                      merged_into_id: { type: integer, format: int64 }
                      moved_dramas: { type: integer, format: int64, description: 源标签原有的剧数（已挂到目标标签） }
    AdminTaxonomyListResult:
      description: 全部维度（含取值）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTaxonomyList" } } }
    AdminTaxonomyResult:
      description: 保存后的维度（含取值）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTaxonomy" } } }
    AdminTermResult:
      description: 保存后的取值
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTerm" } } }
    AdminTopicPage:
      description: 专题列表的一页
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTopicPage" } } }
    AdminTopicResult:
      description: 保存后的专题
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTopic" } } }
    AdminTopicDetailResult:
      description: 专题详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminTopicDetail" } } }
    AdminTopicDramasResult:
      description: 保存后的手选剧（按展示顺序）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [drama_ids]
                    properties:
                      drama_ids: { type: array, items: { type: integer, format: int64 } }
    # ---------- 用户端选线（S1-6d）的成功响应 ----------
    LineListResult:
      description: 当前地区的候选线路列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/LineListResult" } } }
    LineReportResult:
      description: 质量上报的接受条数
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/LineReportAck" } } }
    # ---------- 存储源（S1-6a）的成功响应 ----------
    AdminStorageProviderPage:
      description: 存储源列表的一页
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageProviderPage" } } }
    AdminStorageProviderResult:
      description: 保存后的存储源
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageProvider" } } }
    AdminStorageProbeResult:
      description: 连通性测试结果（探测失败也是 200，原因写在 steps 中）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageProbeResult" } } }
    # ---------- 存储线路 / 设置 / 选线预览（S1-6b/d）的成功响应 ----------
    AdminStorageLinePage:
      description: 线路列表（含地区规则，一次返回全部）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [list, total]
                    properties:
                      list: { type: array, items: { $ref: "#/components/schemas/AdminStorageLine" } }
                      total: { type: integer }
    AdminStorageLineResult:
      description: 保存后的线路
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageLine" } } }
    AdminStorageLineRules:
      description: 保存后的地区规则列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    required: [rules]
                    properties:
                      rules: { type: array, items: { $ref: "#/components/schemas/AdminStorageLineRule" } }
    AdminStorageLineProbeResult:
      description: 线路连通性测试结果（探测失败也是 200，原因写在 message）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageLineProbeResult" } } }
    AdminStorageSettingsResult:
      description: 存储全局设置
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageSettings" } } }
    AdminStoragePreviewResult:
      description: 选线预览结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStoragePreviewResult" } } }
    AdminStorageCleanupResult:
      description: 清理结果（dry_run 时为预览）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageCleanupResult" } } }
    AdminStorageOrphanStats:
      description: 孤立产物统计
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - { type: object, properties: { data: { $ref: "#/components/schemas/AdminStorageOrphanStats" } } }
    AdminStorageEnqueueResult:
      description: 批量入队的结果（实际搬运由 worker 执行）
      content:
        application/json:
          schema:
