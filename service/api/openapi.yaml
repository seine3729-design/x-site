    0.45.0（新增，S4-5 / A4-2 资源体检，docs/06 第 9 节、docs/03 第 9.4 节，迁移 00033）：
    GET /api/admin/resource-checks（结果列表 + 概览 + 结果图例，按剧编号筛选、只看打不开、搜剧名或剧编号）、
    POST /api/admin/resource-checks/run（发起体检，按剧入队 worker 任务后立即返回）、
    POST /api/admin/resource-checks/clear（清空结果，只清体检表）。权限点 resource_checks.view / resource_checks.edit。
    体检查的是**资源在不在**（逐个对象去读），不是线路好不好（后者是 GET /api/admin/storage/health 的事）；
    整条线路挂了这里会全红，那种情况该去看线路健康。
    探测目标：剧的竖 / 横封面、每集的封面 / 首帧图、每集当前视频产物（hls_dir 探 master.m3u8，并把产物目录作为签名前缀，
    和播放时的签名方式一致）。空字段与没有产物的分集直接跳过 —— 没填与没转封装都不是资源故障。
    每个资源只留最后一次的结果（唯一索引 drama_id + coalesce(episode_id,0) + file_type + field 上的 UPSERT），
    重复体检不会让表随次数膨胀。
    迁移 00033 在 docs/02 第 4.3 节的字段上加了三列：field（分辨竖封面 / 横封面 / 本集封面 / 首帧图 / 视频，
    只有 file_type 的话运营不知道该去改哪个字段）、line_id（同一个对象键经不同线路的可达性可能不同，
    记下用的哪条线路结果才解释得通）、elapsed_ms 与 message（只有状态码区分不出「连不上」是 DNS、超时还是被出站策略拦截）。
    **url 存不含查询串的地址**：HMAC 令牌与 S3 预签名都带密钥派生值与过期时间，落库等于把签名材料留在表里、
    还会显示在后台页面上；探测时按线路现算签名。
    选线不走 domain/storage.Evaluate（那是按用户地理位置给单个播放请求择优），而是取该 kind 里启用中、配了访问域名、
    priority 最小的那条（同优先级取编号小的）：体检要的是可重复的参照，同一个资源每次都走同一条线路，结果才有可比性。
    缺对应 kind 的线路时跳过那类资源、不写结果（记成「连不上」会把「后台还没配线路」误报成「资源丢了」），
    列表接口用 line_warning 单独提示。
    封面是运营手填的文本，可能是相对路径、带前导斜杠或整个网址：带 http(s) 协议的直接探、不经线路（line_id 为 0），
    其他协议（data:、ftp: 等）与省略协议的 //host/x 当没填。
    worker 任务 resource_check 按剧分片进 media 队列（最多重试 2 次、单部剧 10 分钟超时），单部剧内部并发 4 个资源；
    队列并发度 × 任务内并发就是对源站的实际压力（River 没有按存储源分组限并发的能力）。
    探测用 GET + Range: bytes=0-0 只取一个字节（不用 HEAD —— 部分存储与 CDN 对 HEAD 返回 405，会被误判成「打不开」），
    单个资源 10 秒超时，经 netguard 校验出站地址。
    结果映射：2xx/3xx → ok、404/410 → not_found、401/403 → forbidden、5xx → server_error、
    其他 4xx 与地址非法 → unopenable、传输层失败（DNS / 拒绝 / 超时 / 被拦截）→ unreachable。
    列表不分页，最多返回 200 条（docs/03 第 9.4 节）：体检是「扫一遍找出坏的」的工具，翻页看第 140 条没有意义，
    超出上限时用 total 告诉运营还有多少没显示。坏的排在最前。
