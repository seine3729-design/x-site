# 运营后台的页面服务器（Dokploy 路径，docs/14）。TLS 与域名由 Traefik 负责，这里只发文件。
#
# 为什么自己带一层 nginx 而不是把产物交给别的东西发：构建期 scripts/precompress.mjs 把
# .js / .css **以及 index.html** 压成了 Brotli 11，`brotli_static` 能把它们原样送出去，
# 比任何运行时压缩都小且零 CPU。基础镜像用 alpine + nginx-mod-http-brotli 而不是官方 nginx 镜像：
# 官方镜像没有 brotli 模块，而 Alpine 的 nginx 与该模块同仓库同版本，装上就能用。
#
# 关键约束：**index.html 必须由后台域名自己发**，不能搬到 CDN 裸域。后台会话是 HttpOnly Cookie，
# 后端还要校验 Origin 白名单与 CSRF（docs/03 第 2.3 节），页面和 /api/admin 必须同源。
# 只有带内容哈希的 assets/ 走 CDN（构建期由 ADMIN_ASSET_BASE 指过去）。

user nginx;
worker_processes auto;
pcre_jit on;
error_log /dev/stderr warn;

# Brotli 的两个动态模块（Alpine 的 nginx-mod-http-brotli 装的）
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志关掉：Traefik 已经记了一份，这里再记一遍只是重复，而且含完整 IP
    access_log    off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout 65;

    # 没有预压缩文件时的兜底（实时压，5 档）。带 .br 的文件走下面的 brotli_static，不会到这里
    brotli            on;
    brotli_comp_level 5;
    brotli_types      text/plain text/css text/javascript application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;
    gzip              on;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /srv/admin;
        index index.html;

        # 容器存活判断
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # 带内容哈希的产物。接了 CDN 之后浏览器从 cdn.<域名> 取，这里是兜底与直连入口。
        # 注意 add_header 的继承规则：一个 location 里只要出现过 add_header，
        # 就不再继承外层的那些，所以每个 location 都要把该发的头写全
        location /assets/ {
            brotli_static on;
            gzip_static   on;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            try_files $uri =404;
        }

        # favicon 这类没有内容哈希的文件，短缓存
        location /images/ {
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            try_files $uri =404;
        }

        # /api/admin/ 由 Traefik 以更高优先级指到 service，走不到这里。
        # 其余 /api/* 不对外开放（契约见 docs/07 第 0.5 节）
        location /api/ {
            return 404;
        }

        # SPA 兜底：前端路由由 TanStack Router 接管，刷新任何路径都要回 index.html。
        # index.html 绝不能缓存，否则改版后老用户一直引用已被删掉的 chunk。
        # 它本身也有 .br（scripts/precompress.mjs 会压 .html），是整页的第一个字节
        location / {
            brotli_static on;
            gzip_static   on;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Vary "Accept-Encoding" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
